<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备档案 · 管网运维平台</title><link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="archive">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">

  <div class="topbar">
    <div class="crumb">管网运维 / <b>设备档案</b></div>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="exportBtn"><svg style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>导出</button>
    <button class="btn btn-sm btn-primary" id="addBtn"><span style="display:inline-flex;align-items:center;gap:6px"><svg style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>新增资产</span></button>
  </div>

  <div class="grid g-4" style="margin:18px 0">
    <div class="kpi reveal"><div class="lab">资产总数</div><div class="val" id="kpiTotal">0</div><div class="sub">全量台账</div></div>
    <div class="kpi reveal"><div class="lab">在运</div><div class="val" style="color:var(--success)" id="kpiRun">0</div><div class="sub">正常运行</div></div>
    <div class="kpi reveal"><div class="lab">待检修</div><div class="val" style="color:var(--warn)" id="kpiRepair">0</div><div class="sub">需排期处理</div></div>
    <div class="kpi reveal"><div class="lab">临保到期</div><div class="val" style="color:var(--alert)" id="kpiWarr">0</div><div class="sub">2026 年内保期截止</div></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <span class="crumb">资产目录</span>
      <div class="search" style="margin-left:auto">
        <input class="input" id="fKw" placeholder="搜索编号 / 名称 / 类别">
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>资产编号</th><th>资产名称</th><th>类别</th><th>状态</th><th>安装日期</th>
          <th>保修到期</th><th>最近维保</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</main>
<script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/components.js"></script>
<script>
const s = new Shell('archive');
s.mount();

const stC = {'在运':'s', '待检修':'w', '停用':'d'};
let assets = [];

api.archive.page().then(res=>{
  assets = res.list || [];
  syncKpis();
  render();
});

function syncKpis(){
  document.getElementById('kpiTotal').textContent = assets.length;
  document.getElementById('kpiRun').textContent = assets.filter(a=>a.status==='在运').length;
  document.getElementById('kpiRepair').textContent = assets.filter(a=>a.status==='待检修').length;
  document.getElementById('kpiWarr').textContent = assets.filter(a=>a.warranty_end && a.warranty_end.indexOf('2026')===0).length;
}

function render(){
  const kw = document.getElementById('fKw').value.trim().toLowerCase();
  const rows = assets.filter(a=>!kw || String(a.asset_no+a.name+a.category).toLowerCase().includes(kw));
  const tb = document.getElementById('tbody');
  if(!rows.length){
    tb.innerHTML = '<tr><td colspan="8"><div class="empty">'+s.icon('file-text')+'<span>暂无可展示的资产记录</span></div></td></tr>';
    return;
  }
  tb.innerHTML = rows.map(a=>`<tr>
    <td><span class="code">${s.esc(a.asset_no)}</span></td>
    <td><b>${s.esc(a.name)}</b></td>
    <td>${s.esc(a.category)}</td>
    <td>${s.tag(stC[a.status]||'g', a.status)}</td>
    <td class="code">${s.esc(a.install_date)}</td>
    <td class="code">${s.esc(a.warranty_end||'—')}</td>
    <td class="code faint">${s.esc(a.last_case||'—')}</td>
    <td><div class="row-tools">
      <button class="btn btn-sm" data-arch="${a.id}">查看档案</button>
      <button class="btn btn-sm" data-work="${a.id}">发起工单</button>
    </div></td>
  </tr>`).join('');
  tb.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>viewArch(+b.dataset.arch));
  tb.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>createOrder(+b.dataset.work));
}

function findA(id){ return assets.find(x=>x.id===id); }

function viewArch(id){
  const a = findA(id);
  s.openModal({
    title:'资产档案 · '+s.esc(a.asset_no),
    size:640,
    bodyHtml:`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field"><label>资产编号</label><div class="code">${s.esc(a.asset_no)}</div></div>
        <div class="field"><label>资产名称</label><div><b>${s.esc(a.name)}</b></div></div>
        <div class="field"><label>类别</label><div>${s.esc(a.category)}</div></div>
        <div class="field"><label>当前状态</label><div>${s.tag(stC[a.status]||'g', a.status)}</div></div>
        <div class="field"><label>安装日期</label><div class="code">${s.esc(a.install_date)}</div></div>
        <div class="field"><label>保修到期</label><div class="code">${s.esc(a.warranty_end||'—')}</div></div>
      </div>
      <div class="divider"></div>
      <div class="field"><label>设备生命周期</label>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px">
          <span class="tag s">安装 · ${s.esc(a.install_date)}</span>
          <span class="code faint">→</span>
          <span class="tag p">投入在运</span>
          <span class="code faint">→</span>
          <span class="tag g">周期维保</span>
          <span class="code faint">→</span>
          <span class="code">${s.esc(a.last_case||'待定')}</span>
        </div>
      </div>
      <div class="field"><label>最近维保记录</label><div class="muted">${s.esc(a.last_case||'暂无记录')}</div></div>`,
    okText:'关闭'
  });
}

function createOrder(id){
  const a = findA(id);
  s.openModal({
    title:'发起工单 · '+s.esc(a.asset_no),
    bodyHtml:`
      <div class="field"><label>资产</label><div><b>${s.esc(a.name)}</b> <span class="code faint">${s.esc(a.asset_no)}</span></div></div>
      <div class="field"><label>工单类型</label>
        <select class="select"><option>巡检工单</option><option>维修工单</option><option>维保工单</option></select></div>
      <div class="field"><label>工作说明</label><textarea class="textarea" rows="3" placeholder="简要描述设备问题或维保需求"></textarea></div>
      <div class="muted faint" style="font-size:12px">本项将对接外部工单 / BPM 系统，提交后进入审批流转。</div>`,
    okText:'提交工单',
    onOk:()=>{ s.toast('已提交工单','ok'); }
  });
}

document.getElementById('addBtn').onclick = ()=>{
  s.openModal({
    title:'新增资产',
    bodyHtml:`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field"><label>资产编号</label><input class="input" placeholder="如 ZB-2026-0001"></div>
        <div class="field"><label>资产名称</label><input class="input" placeholder="如水厂清水泵"></div>
        <div class="field"><label>类别</label>
          <select class="select"><option>机泵设备</option><option>计量仪表</option><option>自控设备</option><option>输配管道</option></select></div>
        <div class="field"><label>状态</label>
          <select class="select"><option>在运</option><option>待检修</option><option>停用</option></select></div>
      </div>`,
    okText:'提交',
    onOk:()=>{ s.toast('已新增资产','ok'); }
  });
};

document.getElementById('exportBtn').onclick = ()=>{
  s.toast('原型导出：准备导出资产台账','ok');
};
document.getElementById('fKw').oninput = render;
</script></body></html>
