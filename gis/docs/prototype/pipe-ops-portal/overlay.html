<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>覆盖物管理 · 管网运维平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head><body data-page="overlay">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content" style="padding:0 20px 48px">

  <div class="topbar reveal">
    <a class="crumb" href="index.html"><b>覆盖物管理</b></a><span class="crumb">GIS 资产 / 统一覆盖物表</span>
    <div class="spacer"></div>
    <button class="iconbtn" id="ovRefresh" title="刷新"></button>
    <button class="btn btn-primary" id="ovNew"></button>
  </div>

  <!-- 工具栏 -->
  <div class="card" style="margin-top:16px">
    <div class="toolbar">
      <div class="search"></div>
      <select class="select" id="ovType" style="width:150px"></select>
      <select class="select" id="ovUsage" style="width:130px">
        <option value="all">全部状态</option>
        <option value="1">在用</option>
        <option value="2">备用</option>
        <option value="3">停用</option>
      </select>
      <button class="btn btn-sm" id="ovClear">清除</button>
      <div style="flex:1"></div>
      <button class="btn btn-sm btn-danger" id="ovBatchDel">批量删除</button>
      <span class="pill-input" id="ovAiTool" title="AI 批量识别补全">AI 批量识别补全</span>
    </div>

    <!-- 表格 -->
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="width:36px"><input type="checkbox" id="ovCheckAll"></th>
          <th>ID</th><th>类型</th><th>覆盖物编号</th><th>设备编号</th>
          <th>名称</th><th>规格</th><th>使用状态</th><th>采集人员</th><th>更新时间</th>
          <th style="width:120px">操作</th>
        </tr></thead>
        <tbody id="ovBody"></tbody>
      </table>
      <div id="ovEmpty"></div>
    </div>

    <!-- 分页条 -->
    <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border)">
      <span class="muted" style="font-size:12px" id="ovPageInfo">第 1/1 页 · 共 0 条</span>
      <div style="flex:1"></div>
      <span class="code faint">数据经 GIS 覆盖物统一表实时同步</span>
    </div>
  </div>

</main>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/components.js"></script>
<script>
const s = new Shell('overlay');
s.mount();
document.getElementById('ovRefresh').innerHTML = s.icon('refresh-cw');
document.getElementById('ovNew').innerHTML = s.icon('plus') + '新建覆盖物';
document.getElementById('ovAiTool').innerHTML = s.icon('cpu') + 'AI 批量识别补全';
const searchWrap = document.querySelector('.toolbar .search');
searchWrap.innerHTML = s.icon('search') + '<input class="input" id="ovKeyword" placeholder="搜索编号 / 名称…">';

const TYPE_KEYS = Object.keys(window.MOCK.overlayTypes);
document.getElementById('ovType').innerHTML =
  '<option value="all">全部类型</option>' +
  TYPE_KEYS.map(k => `<option value="${k}">${window.MOCK.overlayTypes[k]}</option>`).join('');

const GV = { keyword:'', type:'all', usage:'all', selected:new Set() };

function usageTag(v){
  if((+v)===1) return s.tag('s','在用');
  if((+v)===2) return s.tag('w','备用');
  return s.tag('d','停用');
}

async function render(){
  GV.selected.clear();
  const chkAll = document.getElementById('ovCheckAll'); if(chkAll) chkAll.checked = false;
  GV.keyword = (document.getElementById('ovKeyword').value||'').trim();
  GV.type = document.getElementById('ovType').value;
  GV.usage = document.getElementById('ovUsage').value;
  const r = await api.overlay.page({ type:GV.type, usage_state: GV.usage==='all'?undefined:GV.usage, keyword:GV.keyword });
  const rows = r.list;
  const empty = document.getElementById('ovEmpty');
  document.getElementById('ovPageInfo').innerHTML = `第 1/1 页 · 共 ${r.total} 条`;
  if(!rows.length){
    document.getElementById('ovBody').innerHTML = '';
    empty.innerHTML = `<div class="empty">${s.icon('map-pin')}<div>未找到匹配的覆盖物记录</div>
      <div class="faint" style="font-size:12px">请调整关键字或筛选条件</div></div>`;
    return;
  }
  empty.innerHTML = '';
  document.getElementById('ovBody').innerHTML = rows.map(o=>{
    const typeName = s.esc(window.MOCK.overlayTypes[o.type] || o.type || '');
    const tt = `经度 ${o.lng} · 纬度 ${o.lat}`;
    return `<tr data-id="${o.id}">
      <td><input type="checkbox" class="ov-row-check" value="${o.id}"></td>
      <td class="code faint">${o.id}</td>
      <td>${s.tag('p', typeName)}</td>
      <td class="code">${s.esc(o.overlay_number)}</td>
      <td class="code faint">${s.esc(o.device_number||'—')}</td>
      <td title="${s.esc(tt)}">${s.esc(o.name||'—')}</td>
      <td>${s.esc(o.spec||'—')}</td>
      <td>${usageTag(o.usage_state)}</td>
      <td>${s.esc(o.collect_worker||'—')}</td>
      <td class="code faint" style="white-space:nowrap">${s.esc(o.updated_at||'')}</td>
      <td><div class="row-tools">
        <button class="iconbtn" data-act="view" data-id="${o.id}" title="查看">${s.icon('info')}</button>
        <button class="iconbtn" data-act="edit" data-id="${o.id}" title="编辑">${s.icon('pencil')}</button>
        <button class="iconbtn" data-act="del" data-id="${o.id}" title="删除">${s.icon('trash-2')}</button>
      </div></td>
    </tr>`;
  }).join('');
}

function typeOptions(sel){ return '<option value="">请选择类型</option>'+TYPE_KEYS.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${window.MOCK.overlayTypes[k]}</option>`).join(''); }
function usageOptions(sel){
  const map=[[1,'在用'],[2,'备用'],[3,'停用']];
  return map.map(([v,t])=>`<option value="${v}" ${(+sel)===v?'selected':''}>${t}</option>`).join('');
}
function formModal(base){
  const b = base||{};
  return `<div class="field"><label>覆盖物编号（系统编号）</label><input class="input" id="fNumber" value="${s.esc(b.overlay_number||'')}" placeholder="如 FM-2026-0001"></div>
  <div class="field"><label>覆盖物类型</label><select class="select" id="fType">${typeOptions(b.type||'')}</select></div>
  <div class="field"><label>设备编号</label><input class="input" id="fDev" value="${s.esc(b.device_number||'')}" placeholder="如 DV-GS-0118"></div>
  <div class="field"><label>名称</label><input class="input" id="fName" value="${s.esc(b.name||'')}" placeholder="如 城南路1号阀门"></div>
  <div class="field"><label>规格型号</label><input class="input" id="fSpec" value="${s.esc(b.spec||'')}" placeholder="如 DN400 蝶阀"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="field"><label>经度</label><input class="input" id="fLng" value="${s.esc(b.lng??'')}" placeholder="如 121.47367"></div>
    <div class="field"><label>纬度</label><input class="input" id="fLat" value="${s.esc(b.lat??'')}" placeholder="如 31.23042"></div>
  </div>
  <div class="field"><label>使用状态</label><select class="select" id="fUsage">${usageOptions(b.usage_state??1)}</select></div>`;
}

document.getElementById('ovNew').addEventListener('click', ()=>{
  const mask = s.openModal({ title:'新增覆盖物', size:560, bodyHtml:formModal(), okText:'保存',
    onOk: async ()=>{
      const name=(document.getElementById('fName').value||'').trim();
      const number=(document.getElementById('fNumber').value||'').trim();
      if(!name || !number){ s.toast('名称与编号为必填项','err'); return false; }
      await api.overlay.create({overlay_number:number,name});
      const id = Date.now();
      window.MOCK.overlay.unshift({
        id, type:document.getElementById('fType').value,
        overlay_number:number, device_number:document.getElementById('fDev').value.trim(),
        name, spec:document.getElementById('fSpec').value.trim(),
        lng:+document.getElementById('fLng').value||0, lat:+document.getElementById('fLat').value||0,
        usage_state:+document.getElementById('fUsage').value,
        collect_worker:'(新建)', updated_at:'2026-09-13 '+(new Date().toTimeString().slice(0,5))
      });
      s.toast('保存成功','ok'); render();
    }});
});

document.getElementById('ovBody').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const id = +btn.dataset.id, act = btn.dataset.act;
  const row = (await api.overlay.get(id)) || window.MOCK.overlay.find(o=>o.id===id);
  if(act==='view' && row){
    s.openModal({ title:'覆盖物详情', size:580,
      bodyHtml:`<div style="display:grid;gap:10px">
        <div class="field"><label>编号 / 类型</label><div class="muted" style="font-size:13px"><b class="code">${s.esc(row.overlay_number)}</b> · ${s.esc(window.MOCK.overlayTypes[row.type]||'-')}</div></div>
        <div class="field"><label>名称</label><div class="muted">${s.esc(row.name||'—')}</div></div>
        <div class="field"><label>设备编号</label><div class="muted code">${s.esc(row.device_number||'—')}</div></div>
        <div class="field"><label>坐标（GeoJSON WGS84）</label><div class="muted code">经度 ${row.lng} · 纬度 ${row.lat}</div></div>
        <div class="field"><label>规格</label><div class="muted">${s.esc(row.spec||'—')}</div></div>
        <div class="field"><label>状态 / 更新时间</label><div style="display:flex;align-items:center;gap:8px">${usageTag(row.usage_state)}<span class="muted" style="font-size:13px">采集人：${s.esc(row.collect_worker||'—')} · ${s.esc(row.updated_at||'—')}</span></div></div>
      </div>`, footer:false });
    return;
  }
  if(act==='edit' && row){
    const mask = s.openModal({ title:'编辑覆盖物', size:560, bodyHtml:formModal(row), okText:'保存',
      onOk: async ()=>{
        const updated={ ...row, overlay_number:(document.getElementById('fNumber').value||'').trim(),
          type:document.getElementById('fType').value, device_number:document.getElementById('fDev').value.trim(),
          name:(document.getElementById('fName').value||'').trim(), spec:document.getElementById('fSpec').value.trim(),
          lng:+document.getElementById('fLng').value||0, lat:+document.getElementById('fLat').value||0,
          usage_state:+document.getElementById('fUsage').value, updated_at:'2026-09-13 '+(new Date().toTimeString().slice(0,5)) };
        await api.overlay.update(updated);
        const i=window.MOCK.overlay.findIndex(o=>o.id===updated.id);
        if(i>=0) window.MOCK.overlay[i]=updated; else window.MOCK.overlay.unshift(updated);
        s.toast('保存成功','ok'); render();
      }});
    return;
  }
  if(act==='del'){
    delConfirm([id]); return;
  }
});

function delConfirm(ids){
  s.openModal({ title:'删除确认', size:420,
    bodyHtml:`<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="color:var(--danger)">${s.icon('alert-triangle')}</div>
      <div><div style="font-size:14px">确定删除选中覆盖物？</div>
      <div class="muted" style="font-size:12px;margin-top:6px">共 ${ids.length} 条，删除后将从 GIS 覆盖物统一表中移除，且不可恢复。</div></div></div>`,
    okText:'确认删除',
    onOk: async ()=>{
      await api.overlay.delete({ ids: ids.join(',') });
      ids.forEach(id=>{ const i=window.MOCK.overlay.findIndex(o=>o.id===+id); if(i>=0) window.MOCK.overlay.splice(i,1); });
      s.toast('已删除 '+ids.length+' 条','ok'); render();
    }});
}

document.getElementById('ovBatchDel').addEventListener('click', ()=>{
  const checks=[...document.querySelectorAll('.ov-row-check:checked')];
  if(!checks.length){ s.toast('请先勾选要删除的记录','err'); return; }
  delConfirm(checks.map(c=>+c.value));
});
document.getElementById('ovCheckAll').addEventListener('change', e=>{
  document.querySelectorAll('.ov-row-check').forEach(c=>c.checked=e.target.checked);
});
document.getElementById('ovClear').addEventListener('click', ()=>{
  document.getElementById('ovKeyword').value='';
  document.getElementById('ovType').value='all';
  document.getElementById('ovUsage').value='all';
  render();
});
document.getElementById('ovKeyword').addEventListener('input', ()=>render());
['ovType','ovUsage'].forEach(id=>document.getElementById(id).addEventListener('change', render));
document.getElementById('ovAiTool').addEventListener('click', ()=>s.toast('原型演示','info'));

render();
</script>
</body></html>
