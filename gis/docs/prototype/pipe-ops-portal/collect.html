<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>采集管理 · 管网运维平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head><body data-page="collect">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content" style="padding:0 20px 48px">

  <div class="topbar reveal">
    <a class="crumb" href="index.html"><b>采集管理</b></a><span class="crumb">RTK / CAD 外业数据 → GIS</span>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="clImport"></button>
  </div>

  <!-- 上：采集批次表 -->
  <div class="card" style="margin-top:16px">
    <div class="card-head"><h3>采集批次</h3>
      <span class="sub">外业导入批次台账</span>
      <div class="tools"><button class="iconbtn" id="clRefresh" title="刷新"></button></div></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>批次号</th><th>采集日期</th><th>数据来源</th><th>导入方式</th><th>管线数</th><th>点数</th>
          <th>状态</th><th>创建时间</th><th style="width:170px">操作</th>
        </tr></thead>
        <tbody id="batchBody"></tbody>
      </table>
      <div id="batchEmpty"></div>
    </div>
  </div>

  <!-- 下：采集点位明细 -->
  <div class="card" style="margin-top:16px">
    <div class="card-head"><h3>采集点位明细</h3>
      <span class="sub">坐标 → PostGIS geom(4326)</span>
      <div class="tools">
        <select class="select" id="ptBatch" style="width:230px"></select>
        <button class="iconbtn" id="ptRefresh" title="刷新"></button>
      </div></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>点位ID</th><th>采集点位号</th><th>管点</th><th>经度</th><th>纬度</th><th>高程(m)</th>
          <th>特征</th><th>口径</th><th>建筑区域</th>
        </tr></thead>
        <tbody id="pointBody"></tbody>
      </table>
      <div id="pointEmpty"></div>
    </div>
    <div style="padding:12px 16px;border-top:1px solid var(--border)">
      <span class="faint" style="font-size:12px">提示：点击点位行可预览「生成覆盖物」字段映射。</span>
    </div>
  </div>

</main>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/components.js"></script>
<script>
const s = new Shell('collect');
s.mount();
document.getElementById('clImport').innerHTML = s.icon('upload') + '导入数据';
document.getElementById('clRefresh').innerHTML = s.icon('refresh-cw');
document.getElementById('ptRefresh').innerHTML = s.icon('refresh-cw');

let currentBatchId = null;

function statusTag(st){
  if(st==='已生成') return s.tag('s','已生成');
  if(st==='已导入') return s.tag('p','已导入');
  return s.tag('w','待生成');
}
function importWay(way){
  if(way==='P') return '<span class="tag p">P · 点位</span>';
  return '<span class="tag g">L · 管线</span>';
}

async function renderBatches(keep){
  const r = await api.collect.batchPage();
  const empty = document.getElementById('batchEmpty');
  if(!r.list.length){
    document.getElementById('batchBody').innerHTML='';
    empty.innerHTML=`<div class="empty">${s.icon('database')}<div>暂无采集批次</div></div>`;
  }else{
    empty.innerHTML='';
    document.getElementById('batchBody').innerHTML = r.list.map(b=>`
      <tr data-id="${b.id}">
        <td class="code">${s.esc(b.identifier)}</td>
        <td class="code faint">${s.esc(b.building_date)}</td>
        <td>${s.esc(b.data_sources)}</td>
        <td>${importWay(b.import_way)}</td>
        <td class="num">${b.import_way==='L'?b.pipe_number:'—'}</td>
        <td class="num">${b.import_way==='P'?b.point_number:'—'}</td>
        <td>${statusTag(b.status)}</td>
        <td class="code faint" style="white-space:nowrap">${s.esc(b.created_at)}</td>
        <td><div class="row-tools">
          <button class="btn btn-sm" data-act="detail" data-id="${b.id}">点位详情</button>
          <button class="btn btn-sm" data-act="gen" data-id="${b.id}">生成资产</button>
        </div></td>
      </tr>`).join('');
  }
  if(!keep){
    // 重建下拉，保持选择
    const cur = document.getElementById('ptBatch').value || currentBatchId || (r.list[0]&&r.list[0].id) || '';
    buildBatchSelect(cur);
  }
}

function buildBatchSelect(selVal){
  currentBatchId = selVal;
  const opts = window.MOCK.collectBatch.map(b=>`<option value="${b.id}">${b.identifier}</option>`).join('');
  document.getElementById('ptBatch').innerHTML = opts || '<option value="">无批次</option>';
  document.getElementById('ptBatch').value = String(selVal || '');
}

const FEATURE_TYPE = { '三通':'net_part','弯头':'net_part','阀门':'valve','压力监测':'pressure_meter','流量计':'flow_meter','消防栓':'fire_fighting' };

async function renderPoints(){
  const batchId = +document.getElementById('ptBatch').value;
  currentBatchId = batchId;
  if(!batchId){ document.getElementById('pointBody').innerHTML='';
    document.getElementById('pointEmpty').innerHTML=`<div class="empty">${s.icon('map-pin')}<div>请选择批次</div></div>`;
    return; }
  const r = await api.collect.pointPage({ batch_id: batchId });
  const empty = document.getElementById('pointEmpty');
  if(!r.list.length){
    document.getElementById('pointBody').innerHTML='';
    empty.innerHTML=`<div class="empty">${s.icon('layers')}<div>该批次暂无可预览点位，可执行「生成资产」补全</div></div>`;
  }else{
    empty.innerHTML='';
    document.getElementById('pointBody').innerHTML = r.list.map(p=>`
      <tr data-id="${p.id}" style="cursor:pointer">
        <td class="code faint">${p.id}</td>
        <td class="code">${s.esc(p.position)}</td>
        <td class="code faint">${s.esc(p.code)}</td>
        <td class="num">${p.lng}</td>
        <td class="num">${p.lat}</td>
        <td class="num">${p.elevation}</td>
        <td>${s.esc(p.feature)}</td>
        <td>${s.esc(p.spec||'—')}</td>
        <td>${s.esc(p.building_area||'—')}</td>
      </tr>`).join('');
  }
}

// 批次表操作
document.getElementById('batchBody').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const id = +btn.dataset.id, act = btn.dataset.act;
  const batch = window.MOCK.collectBatch.find(b=>b.id===id);
  if(act==='detail'){
    buildBatchSelect(id); renderPoints(); return;
  }
  if(act==='gen'){
    const r = await api.collect.generate({ batch_id: id });
    s.toast(`覆盖物生成 ${r.overlay_generated} · 管线 ${r.pipe_generated}`,'ok');
    if(batch){ batch.status='已生成'; batch.point_number = batch.point_number||r.overlay_generated; batch.pipe_number = batch.pipe_number||r.pipe_generated; }
    renderBatches(true);
    return;
  }
});

// 导入数据模态
document.getElementById('clImport').addEventListener('click', ()=>{
  const batchOpts = window.MOCK.collectBatch.map(b=>`<option value="${b.id}">${b.identifier}</option>`).join('');
  s.openModal({ title:'导入采集数据', size:520,
    bodyHtml:`
      <div style="border:1.5px dashed var(--border-strong);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--text-sub)">
        <div style="color:var(--primary);margin-bottom:8px">${s.icon('upload')}</div>
        <div style="font-size:13px">拖放数据文件到此处，或将文件拖入外业上传目录</div>
        <div class="faint" style="font-size:12px;margin-top:4px">支持 RTK 测点表 / CAD 提取 · Excel / CSV</div>
      </div>
      <div class="field"><label>选择采集方式</label>
        <select class="select" id="importWay">
          <option value="RTK">RTK 车载测绘</option>
          <option value="CAD">CAD 图纸转换</option>
          <option value="station">全站仪补测</option>
        </select></div>
      <div class="field"><label>关联采集批次（生成至该批覆盖物）</label>
        <select class="select" id="importBatch">${batchOpts}</select></div>`,
    okText:'上传并导入',
    onOk: async ()=>{
      const bid = +document.getElementById('importBatch').value;
      const r = await api.collect.generate({ batch_id: bid });
      s.toast(`导入完成：覆盖物 ${r.overlay_generated} · 管线 ${r.pipe_generated}`,'ok');
      const b = window.MOCK.collectBatch.find(x=>x.id===bid);
      if(b){ b.status='已生成'; }
      renderBatches(true);
    }});
});

// 状态批量列 attr
document.getElementById('pointBody').addEventListener('click', async (e)=>{
  const tr = e.target.closest('tr[data-id]'); if(!tr) return;
  const pid = +tr.dataset.id;
  const batchId = +document.getElementById('ptBatch').value;
  const points = await api.collect.pointPage({ batch_id: batchId });
  const p = points.list.find(x=>x.id===pid); if(!p) return;
  const typeKey = FEATURE_TYPE[p.feature] || 'net_part';
  const typeName = window.MOCK.overlayTypes[typeKey] || p.feature;
  const rows = [
    ['覆盖物编号 overlay_number', p.position || '—','由点位号派生'],
    ['覆盖物类型 type', typeName + ' ('+typeKey+')','由采集特征映射'],
    ['规格口径 spec', p.spec || '—','直接落库'],
    ['地面高程 ground_elevation', p.elevation ? p.elevation+' m' : '—','取点高程'],
    ['坐标 geom(4326)', `POINT(${p.lng} ${p.lat})`,'WGS84 → PostGIS 空间字段'],
    ['建筑区域 building_area', p.building_area || '—','分区归属']
  ];
  s.openModal({ title:'生成覆盖物预览 · '+p.position, size:560,
    bodyHtml:`<div style="display:grid;gap:8px">
      ${rows.map(([k,v,note])=>`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md)">
        <span class="code" style="color:var(--primary);width:220px">${k}</span>
        <span style="flex:1;font-size:13px">${s.esc(v)}</span>
        <span class="faint" style="font-size:11px">${note}</span></div>`).join('')}
      <div class="muted" style="font-size:12px;margin-top:4px">生成后写入 GIS 覆盖物统一表，供管网 GIS 图层引用。</div>
    </div>`, footer:false });
});

document.getElementById('ptBatch').addEventListener('change', renderPoints);
document.getElementById('ptRefresh').addEventListener('click', ()=>{ renderPoints(); });
document.getElementById('clRefresh').addEventListener('click', ()=>renderBatches());

renderBatches().then(()=>renderPoints());
</script>
</body></html>
