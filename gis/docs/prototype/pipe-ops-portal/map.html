<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  /* 仅本页 scoped 样式，全部挂 #mapCard 之下 */
  #mapCard{position:relative;overflow:hidden}
  #mapCard .map-rt{position:absolute;top:12px;left:12px;z-index:5;pointer-events:none}
  #mapCard .map-tip{position:absolute;z-index:20;display:none;pointer-events:none;max-width:230px}
  #mapCard .coord-box{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-size:12px}
  #mapCard .coord-box .lab{color:var(--text-sub);font-size:11px;display:flex;align-items:center;gap:6px}
  #mapCard .coord-box .num{font-family:var(--mfont);color:var(--primary)}

    radial-gradient(circle at 30% 20%, rgba(47,184,201,.10), transparent 60%), #081322}
  #mapSvg .mgrid path{stroke:rgba(120,165,220,.10)}
  #mapSvg .pipe-hl{animation:pulseHL 1.5s var(--ease) infinite}
  @keyframes pulseHL{0%,100%{opacity:.25}50%{opacity:1}}
  #mapSvg .alarm-pulse{animation:alarmPulse 2s var(--ease) infinite}
  @keyframes alarmPulse{0%{opacity:.15;r:6}80%,100%{opacity:.05;r:18}}
  #bisect-rect{fill:rgba(47,184,201,.08);stroke:var(--primary);stroke-width:1.2;stroke-dasharray:5 4;display:none}
  #bboxInfo{position:absolute;left:12px;bottom:12px;z-index:5;display:none}

  .detail-sheet.open{transform:none}
  .detail-item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
  .detail-item .k{color:var(--text-sub);flex:none}
  .detail-item .v{text-align:right;word-break:break-all}
  #mapCard .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
</style>
</head><body data-page="map">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">

  <div class="topbar reveal">
    <a class="crumb" href="map.html"><b>管网 GIS 图</b></a><span class="crumb">空间视图 · WGS84 / EPSG:4326</span>
    <div class="spacer"></div>
    <div class="search" id="mapSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:15px;height:15px;position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input" id="mapSearchInput" placeholder="搜索编号 / 名称…"></div>
    <button class="iconbtn" id="zoomFit" title="重置视野"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:16px;height:16px"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></button>
    <button class="iconbtn" id="mapSettings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:16px;height:16px"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>

  <div class="grid" style="grid-template-columns:250px 1fr;margin-top:16px;align-items:start">
    <!-- 左：图层控制面板 -->
    <div class="card reveal">
      <div class="card-head"><h3>图层控制</h3><span class="sub">point layers</span></div>
      <div class="card-body" style="display:grid;gap:8px" id="layerPanel">
        <div class="lay-row" data-lay="pipes"><span class="pill-input on" data-toggle="pipes">管线</span></div>
        <div class="lay-row" data-lay="overlay"><span class="pill-input on" data-toggle="overlay">覆盖物</span></div>

      </div>

      <div class="divider"></div>

      <div class="card-body" style="padding-top:6px" id="legendBox"></div>

      <div class="divider"></div>
      <div class="card-head" style="border-bottom:none"><h3 style="font-size:14px">关阀影响范围演示</h3></div>
      <div class="card-body" style="padding-top:6px">
        <div class="muted" style="font-size:12px;margin-bottom:10px">按 <b class="code">FM-2024-0118</b> 城南路1号阀门模拟停水，联动 <code>pipe.analysis</code> 返回受影响覆盖物。</div>
        <button class="btn btn-primary btn-sm" id="valveDemo" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:15px;height:15px"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></svg>模拟关阀：FM-2024-0118</button>
        <div style="margin-top:10px" id="valveResult"></div>
      </div>
    </div>

    <!-- 右：SVG 地图画布 -->
    <div class="card reveal" id="mapCard">
      <svg id="mapSvg" viewBox="0 0 1100 680" preserveAspectRatio="xMidYMid meet"></svg>

      <!-- 实时坐标读数 -->
      <div class="map-rt coord-box">
        <div class="lab"><span class="badge-dot" style="background:var(--primary)"></span>实时坐标读数 · WGS84</div>
        <div style="margin-top:4px">经度 <span class="num" id="readLng">—</span> &nbsp; 纬度 <span class="num" id="readLat">—</span></div>
      </div>

      <!-- hover tooltip -->
      <div class="map-tip card" id="mapTip"></div>

      <!-- bbox 信息条 -->
      <div class="card coord-box" id="bboxInfo"></div>

      <!-- 管线详情右侧栏 -->
      <aside class="detail-sheet" id="detailSheet">
        <div class="card-head" style="border-bottom:none"><h3 style="font-size:14px">管线详情</h3>
          <div class="tools"><button class="iconbtn" id="detailClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:15px;height:15px"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
        <div class="card-body" id="detailBody" style="padding-top:6px"></div>
      </aside>
    </div>
  </div>

</main>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/components.js"></script>
<script>
const S = new Shell('map');
S.mount();
const $ = s => document.querySelector(s);
const svg = $('#mapSvg');

/* ============ 投影：归一化 lat/lng -> viewBox 1100×680 ============ */
const VB_W=1100, VB_H=680, PAD=54;
let proj = null;
let pipes=[], overlays=[], alarmSet=new Set();

function computeProjection(){
  let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  pipes.forEach(p=>p.nodes.forEach(n=>{
    minLat=Math.min(minLat,n.lat);maxLat=Math.max(maxLat,n.lat);
    minLng=Math.min(minLng,n.lng);maxLng=Math.max(maxLng,n.lng);
  }));
  overlays.forEach(o=>{
    minLat=Math.min(minLat,o.lat);maxLat=Math.max(maxLat,o.lat);
    minLng=Math.min(minLng,o.lng);maxLng=Math.max(maxLng,o.lng);
  });
  const spanLng=Math.max(maxLng-minLng,0.01), spanLat=Math.max(maxLat-minLat,0.008);
  const scale=Math.min((VB_W-2*PAD)/spanLng,(VB_H-2*PAD)/spanLat);
  proj={scale, minLat, maxLat, minLng,
    offX:(VB_W-scale*spanLng)/2, offY:(VB_H-scale*spanLat)/2};
}
function Px(lat,lng){ return { x:proj.offX+(lng-proj.minLng)*proj.scale, y:proj.offY+(proj.maxLat-lat)*proj.scale }; }
function invPx(x,y){ return { lng:proj.minLng+(x-proj.offX)/proj.scale, lat:proj.maxLat-(y-proj.offY)/proj.scale }; }

/* ============ SVG 组织与样式 ============ */
const OVERLAY_STYLE = {
  valve:{color:'#2FB8C9', kind:'square', label:'阀门'},
  pressure_meter:{color:'#F59E0B', kind:'tri', label:'压力仪表'},
  flow_meter:{color:'#22C55E', kind:'circ', label:'流量仪表'},
  net_part:{color:'#8FA3BF', kind:'dot', label:'管网构件'},
  monitor_meter:{color:'#8FA3BF', kind:'dot', label:'监测仪表'},
  transmission:{color:'#8FA3BF', kind:'dot', label:'输配设备'},
  fire_fighting:{color:'#EF4444', kind:'square', label:'消防设备'},
  landmark:{color:'#5C6F92', kind:'dot', label:'地标'}
};
const DEFAULT_STYLE={color:'#8FA3BF', kind:'dot', label:'其他覆盖物'};

function shapeSvg(kind, x, y, color, fill, stroke){
  switch(kind){
    case 'square': return `<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="1.5" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
    case 'tri': return `<polygon points="${x},${y-6} ${x-6},${y+4.5} ${x+6},${y+4.5}" fill="${fill}" stroke="${stroke}" stroke-width="1.4" stroke-linejoin="round"/>`;
    case 'circ': return `<circle cx="${x}" cy="${y}" r="4.4" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>`;
    default: return `<circle cx="${x}" cy="${y}" r="3.4" fill="${color}"/>`;
  }
}

/* 构建 SVG 底图（底板 + 网格） */
function buildBase(){
  svg.innerHTML = `
    <defs>
      <pattern id="mgrid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path class="mgrid" d="M50 0H0V50" fill="none" stroke-width="1"/></pattern>
      <radialGradient id="glow" cx="35%" cy="25%" r="70%">
        <stop offset="0%" stop-color="rgba(47,184,201,.14)"/><stop offset="100%" stop-color="rgba(8,19,34,0)"/></radialGradient>
    </defs>
    <rect width="1100" height="680" fill="url(#glow)"/>
    <rect width="1100" height="680" fill="url(#mgrid)"/>
    ${buildGridCoord()}
    <g id="lay-pipes"></g>
    <g id="lay-overlay"></g>
    <g id="lay-alarm"></g>
    <rect id="bisect-rect" x="0" y="0" width="0" height="0"/>
  `;
}

function buildGridCoord(){
  let t='';
  for(let x=50;x<1100;x+=100) t+=`<text x="${x+6}" y="664" fill="rgba(143,163,191,.5)" font-size="10" font-family="var(--mfont)">${x}</text>`;
  for(let y=50;y<680;y+=100) t+=`<text x="6" y="${y-6}" fill="rgba(143,163,191,.5)" font-size="10" font-family="var(--mfont)">${y}</text>`;
  return t;
}

function renderPipes(){
  const g=$('#lay-pipes'); let h='';
  pipes.forEach(p=>{
    const pts = p.nodes.map(n=>{ const q=Px(n.lat,n.lng); return `${q.x.toFixed(1)},${q.y.toFixed(1)}`; }).join(' ');
    const standby = p.usage_state===2;
    const stroke = standby ? '#5C6F92' : '#4E9FBF';
    h+=`<g class="pipe" data-type="pipe" data-id="${p.id}" data-usage="${p.usage_state}">
      <polyline fill="none" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"
        opacity="${standby?0.55:0.95}" stroke-dasharray="${standby?'7 5':'none'}" points="${pts}"/>
      <polyline class="hit" data-id="${p.id}" fill="none" stroke="transparent" stroke-width="9" points="${pts}"/>
    </g>`;
  });
  g.innerHTML=h;
}

function renderOverlays(){
  const g=$('#lay-overlay'); let h='';
  overlays.forEach(o=>{
    const st = OVERLAY_STYLE[o.type] || DEFAULT_STYLE;
    const standby = o.usage_state===2;
    const color = standby ? '#5C6F92' : st.color;
    const fill = standby ? 'rgba(92,111,146,.15)' : 'rgba(15,22,38,.35)';
    const q = Px(o.lat,o.lng);
    const shape = shapeSvg(st.kind, q.x, q.y, color, fill, color);
    h+=`<g class="ovr" data-type="overlay" data-id="${o.id}" data-usage="${o.usage_state}">${shape}</g>`;
  });
  g.innerHTML=h;
}

function renderAlarm(){
  const g=$('#lay-alarm'); let h='';
  overlays.forEach(o=>{
    if(!alarmSet.has(o.overlay_number)) return;
    const q=Px(o.lat,o.lng);
    h+=`<circle class="alarm-pulse" data-type="alarm" data-id="${o.id}" data-overlay="${o.overlay_number}"
      cx="${q.x}" cy="${q.y}" fill="none" stroke="#EF4444" stroke-width="1.6" r="6"/>`;
  });
  g.innerHTML=h;
}

/* ============ 图层切换 ============ */
function initLayers(){
  document.querySelectorAll('[data-toggle]').forEach(pill=>{
    pill.addEventListener('click',()=>{
      pill.classList.toggle('on');
      const g=$('#lay-'+pill.dataset.toggle);
      g.style.display = pill.classList.contains('on')?'':'none';
      S.toast((pill.classList.contains('on')?'已显示':'已隐藏')+'「'+pill.textContent.trim()+'」图层','ok');
    });
  });
}

/* ============ 图例 ============ */
function renderLegend(){
  const rows = [
    ['管线（在用）','#4E9FBF','<svg width="26" height="8" viewBox="0 0 26 8"><path d="M1 4H25" stroke="#4E9FBF" stroke-width="3"/></svg>'],
    ['管线（备用）','#5C6F92','<svg width="26" height="8" viewBox="0 0 26 8"><path d="M1 4H25" stroke="#5C6F92" stroke-width="3" stroke-dasharray="6 4"/></svg>'],
    ['阀门（方块）','#2FB8C9',shapeSvg('square',13,13,'#2FB8C9','rgba(15,22,38,.35)','#2FB8C9')],
    ['压力仪表（三角）','#F59E0B',shapeSvg('tri',13,13,'#F59E0B','rgba(15,22,38,.35)','#F59E0B')],
    ['流量仪表（圆）','#22C55E',shapeSvg('circ',13,13,'#22C55E','rgba(15,22,38,.35)','#22C55E')],
    ['其他覆盖物（圆点）','#8FA3BF',shapeSvg('dot',13,13,'#8FA3BF','x','x')],
    ['告警点位（呼吸圈）','#EF4444','<circle cx="13" cy="13" r="6" fill="none" stroke="#EF4444" stroke-width="1.6"/>'],
    ['备用要素（灰虚线）','#5C6F92','<span class="tag g" style="height:auto;padding:1px 7px">备用</span>']
  ];
  $('#legendBox').innerHTML = rows.map(r=>
    `<div class="legend-row"><svg width="28" height="26" viewBox="0 0 26 26">${r[2]}</svg>
     <span>${r[0]}</span></div>`).join('');
}

/* ============ hover tooltip ============ */
const tip=$('#mapTip');
svg.addEventListener('mousemove',e=>{
  // 实时坐标
  const q=svgXY(e);
  const ll=invPx(q.x,q.y);
  $('#readLng').textContent=ll.lng.toFixed(2);
  $('#readLat').textContent=ll.lat.toFixed(2);
  // tooltip 跟随
  if(tip.style.display!=='none'){
    const rect=svg.getBoundingClientRect();
    tip.style.left=(q.x/VB_W*rect.width+12)+'px';
    tip.style.top=(q.y/VB_H*rect.height-4)+'px';
  }
});
function svgXY(e){ const r=svg.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*VB_W, y:(e.clientY-r.top)/r.height*VB_H }; }
function showTip(x,y,html){ tip.classList.add('card'); tip.style.display='block';
  tip.innerHTML=html; const r=svg.getBoundingClientRect();
  tip.style.left=(x/VB_W*r.width+12)+'px'; tip.style.top=(y/VB_H*r.height-4)+'px'; }
svg.addEventListener('mouseleave',()=>{ tip.style.display='none'; });

/* ============ 事件委托：覆盖物 hover ============ */
svg.addEventListener('mouseover',e=>{
  const t=e.target.closest('.ovr,.pipe');
  if(!t){ tip.style.display='none'; return; }
  const q=svgXY(e);
  if(t.dataset.type==='overlay'){
    const o=overlays.find(x=>x.id===+t.dataset.id);
    const st=OVERLAY_STYLE[o.type]||DEFAULT_STYLE;
    const us=o.usage_state===2?S.tag('g','备用'):S.tag('s','在用');
    showTip(q.x,q.y,`
      <div style="font-size:12px"><b class="code" style="color:var(--primary)">${o.overlay_number}</b>
      <span class="faint"> · ${S.esc(st.label)}</span></div>
      <div style="margin-top:4px;font-size:13px">${S.esc(o.name)}</div>
      <div class="faint" style="font-size:11px;margin-top:4px">类型 ${S.esc(o.type)} · ${us}</div>`);
  } else if(t.dataset.type==='pipe'){
    const p=pipes.find(x=>x.id===+t.dataset.id);
    showTip(q.x,q.y,`
      <div style="font-size:12px"><b class="code" style="color:var(--primary)">${p.pipe_number}</b>
      <span class="faint"> · ${S.esc(p.spec)}</span></div>
      <div style="margin-top:4px;font-size:13px">${S.esc(p.category)} · ${S.esc(p.laying_way)}</div>
      <div class="faint" style="font-size:11px;margin-top:4px">起 ${p.start_point_code} · 止 ${p.end_point_code}</div>`);
  }
});

/* ============ 点击：覆盖物弹窗 + 管线侧栏 ============ */
svg.addEventListener('click',e=>{
  const t=e.target.closest('.ovr,.pipe,.hit');
  if(t && t.dataset.type==='overlay'){
    const o=overlays.find(x=>x.id===+t.dataset.id);
    openOverlayModal(o);
  } else if(t && (t.dataset.type==='pipe'||t.classList.contains('hit'))){
    const pid=+(t.dataset.id||t.parentElement.dataset.id);
    openPipeDetail(pid);
  }
});
function openOverlayModal(o){
  const st=OVERLAY_STYLE[o.type]||DEFAULT_STYLE;
  S.openModal({ title:o.overlay_number+' · '+S.esc(o.name),
    bodyHtml:`
      <div style="display:flex;gap:10px;align-items:center"><span class="tag p">${S.esc(st.label)}</span>
        ${o.usage_state===2?S.tag('g','备用'):S.tag('s','在用')}
        ${alarmSet.has(o.overlay_number)?S.tag('d','含告警'):''}</div>
      <div class="detail-item"><span class="k">覆盖物编号</span><span class="v code">${S.esc(o.overlay_number)}</span></div>
      <div class="detail-item"><span class="k">设备编号</span><span class="v code">${S.esc(o.device_number||'—')}</span></div>
      <div class="detail-item"><span class="k">规格</span><span class="v">${S.esc(o.spec||'—')}</span></div>
      <div class="detail-item"><span class="k">坐标</span><span class="v code">${o.lng.toFixed(5)} , ${o.lat.toFixed(5)}</span></div>
      <div class="detail-item"><span class="k">地面高程</span><span class="v metric">${o.ground_elevation} m</span></div>
      <div class="detail-item"><span class="k">采集员</span><span class="v">${S.esc(o.collect_worker)}</span></div>
      <div class="detail-item"><span class="k">登记时间</span><span class="v code">${S.esc(o.updated_at)}</span></div>`,
    footer:false });
}
function openPipeDetail(pid){
  const p=pipes.find(x=>x.id===pid); if(!p) return;
  $('#detailBody').innerHTML=`
    <div class="detail-item"><span class="k">管线编号</span><span class="v code">${S.esc(p.pipe_number)}</span></div>
    <div style="margin-top:8px">${p.usage_state===2?S.tag('g','备用'):S.tag('s','在用')}
      <span class="tag p" style="margin-left:6px">${S.esc(p.category)}</span></div>
    <div class="divider" style="margin:12px 0"></div>
    <div class="detail-item"><span class="k">规格</span><span class="v">${S.esc(p.spec)}</span></div>
    <div class="detail-item"><span class="k">敷设方式</span><span class="v">${S.esc(p.laying_way)}</span></div>
    <div class="detail-item"><span class="k">管段长</span><span class="v metric">${p.length} m</span></div>
    <div class="detail-item"><span class="k">起端编号</span><span class="v code">${S.esc(p.start_point_code)}</span></div>
    <div class="detail-item"><span class="k">末端编号</span><span class="v code">${S.esc(p.end_point_code)}</span></div>
    <div class="detail-item"><span class="k">节点数</span><span class="v metric">${p.nodes.length}</span></div>`;
  $('#detailSheet').classList.add('open');
}
$('#detailClose').addEventListener('click',()=>$('#detailSheet').classList.remove('open'));

/* ============ 关阀影响范围演示 ============ */
$('#valveDemo').addEventListener('click',()=>{
  const btn=$('#valveDemo'); btn.disabled=true;
  api.pipe.analysis({overlay_number:'FM-2024-0118'}).then(r=>{
    const affected=r.affected_overlay_numbers||[];
    // 高亮与受影响覆盖物相连的管线
    const pts=affected.map(num=>{ const o=overlays.find(x=>x.overlay_number===num); return o?Px(o.lat,o.lng):null; }).filter(Boolean);
    const targets=new Set();
    pipes.forEach(p=>{
      p.nodes.forEach(n=>{
        const q=Px(n.lat,n.lng);
        if(pts.some(pt=>Math.abs(pt.x-q.x)<18&&Math.abs(pt.y-q.y)<18)) targets.add(p.id);
      });
    });
    document.querySelectorAll('#lay-pipes .pipe').forEach(g=>{
      g.classList.toggle('pipe-hl',targets.has(+g.dataset.id));
    });
    // 受影响覆盖物标红
    document.querySelectorAll('#lay-overlay .ovr').forEach(g=>{
      const id=+g.dataset.id;
      const o=overlays.find(x=>x.id===id);
      if(o&&affected.includes(o.overlay_number)) g.style.outline='1px solid var(--alert)';
    });
    btn.disabled=false;
    S.toast('已模拟关阀 FM-2024-0118：命中受影响覆盖物 '+affected.length+' 处','ok');
    $('#valveResult').innerHTML=`
      <div class="tag a">管网分析完成</div>
      <div style="margin-top:8px;font-size:12px" class="muted">受影响覆盖物：<br>
        ${affected.map(n=>`<span class="tag g" style="margin:3px 3px 0 0">${n}</span>`).join('')}</div>`;
  });
});

/* ============ bbox 框选（PostGIS QueryOverlayByBBox 模拟） ============ */
let dragging=false, dragStart=null;
const bboxRect=$('#bisect-rect');
const bboxInfo=$('#bboxInfo');
svg.addEventListener('mousedown',e=>{
  if(e.target.closest('.ovr,.pipe,.hit')) return;
  dragStart=svgXY(e); dragging=true;
  bboxRect.setAttribute('x',dragStart.x); bboxRect.setAttribute('y',dragStart.y);
  bboxRect.setAttribute('width',0); bboxRect.setAttribute('height',0);
  bboxRect.style.display='block';
});
svg.addEventListener('mousemove',e=>{
  if(!dragging) return;
  const q=svgXY(e);
  const x=Math.min(dragStart.x,q.x), y=Math.min(dragStart.y,q.y);
  const w=Math.abs(q.x-dragStart.x), h=Math.abs(q.y-dragStart.y);
  bboxRect.setAttribute('x',x); bboxRect.setAttribute('y',y);
  bboxRect.setAttribute('width',w); bboxRect.setAttribute('height',h);
  const ll1=invPx(x,y), ll2=invPx(x+w,y+h);
  bboxInfo.innerHTML=`
    <div class="lab" style="justify-content:space-between"><span>bbox 框选 · QueryOverlayByBBox</span>
      <button class="iconbtn" style="width:22px;height:22px" id="bboxClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:12px;height:12px"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div style="margin-top:4px"><span class="faint">经度</span> <span class="num">${ll1.lng.toFixed(4)} ~ ${ll2.lng.toFixed(4)}</span></div>
    <div><span class="faint">纬度</span> <span class="num">${ll1.lat.toFixed(4)} ~ ${ll2.lat.toFixed(4)}</span></div>
    <div style="margin-top:4px">命中 <b class="code" style="color:var(--primary)">${countHit(x,y,w,h)}</b> 处覆盖物</div>`;
  bboxInfo.classList.add('open');
});
svg.addEventListener('mouseup',()=>{ dragging=false; });
bboxCloseHint();
function countHit(x,y,w,h){
  let c=0;
  overlays.forEach(o=>{ const q=Px(o.lat,o.lng);
    if(q.x>=x-6&&q.x<=x+w+6&&q.y>=y-6&&q.y<=y+h+6)c++; });
  return c;
}
function bboxCloseHint(){
  document.addEventListener('click',e=>{
    if(e.target.closest('#bboxClose')){ bboxInfo.classList.remove('open'); bboxRect.style.display='none'; }
  });
}

/* ============ 搜索：过滤高亮 ============ */
$('#mapSearchInput').addEventListener('input',e=>{
  const kw=e.target.value.trim().toLowerCase();
  document.querySelectorAll('#lay-pipes .pipe,#lay-overlay .ovr').forEach(g=>{
    const id=+g.dataset.id;
    const o=overlays.find(x=>x.id===id), p=pipes.find(x=>x.id===id);
    const txt=(o?o.overlay_number+o.name:p?p.pipe_number+'' :'')+'';
    const hit=!kw||txt.toLowerCase().includes(kw);
    g.style.opacity=hit?'':0.16;
  });
});
$('#zoomFit').addEventListener('click',()=>{ buildBase(); renderPipes(); renderOverlays(); renderAlarm(); S.toast('视野已重置','ok'); });
$('#mapSettings').addEventListener('click',()=>S.toast('地图参数：可视域 / 注记等级可在设置页调整','info'));

/* ============ 初始化 ============ */
async function boot(){
  const [pr,nodes]=await Promise.all([api.pipe.page(),api.overlay.list()]);
  pipes=pr.list; overlays=nodes.list;
  alarmSet=new Set((await api.alarm.page({level:'all'})).list.map(a=>a.overlay_number));
  computeProjection();
  buildBase();
  renderPipes();
  renderOverlays();
  renderAlarm();
  initLayers();
  renderLegend();
}
boot();
</script>
