<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采集入库 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="collect">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>采集入库</b> / S2 采集作业与成果入库 · 生产→质检→入库闭环</div>
    <div class="spacer"></div>
    <span class="tag p"><i></i>演示数据</span><span class="tag s"><i></i>系统在线</span>
  </header>

  <div class="grid g-4 page-block reveal" id="kpis"></div>

  <div class="panel page-block reveal">
    <div class="toolbar">
      <select class="select" id="fStatus" style="width:150px">
        <option value="all">全部状态</option><option>待质检</option><option>质检中</option>
        <option>空间校验中</option><option>已入库</option></select>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="fKw" placeholder="批次号 / 来源"></div>
      <div class="grow"></div>
      <span class="faint code">闭环：导入 → 空间校验 → 拓扑质检 → 生成入库 → PostGIS 写入</span>
      <button class="btn btn-primary" id="btnImport">导入采集数据</button>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="tbl">
      <thead><tr><th>批次号</th><th>采集日期</th><th>数据来源</th><th>导入方式</th>
        <th class="num">管道数</th><th class="num">点位数</th><th class="num">质检通过率</th><th class="num">拓扑问题</th>
        <th>状态</th><th>创建时间</th><th style="width:170px">操作</th></tr></thead>
      <tbody></tbody></table></div>
    <div class="pager" id="pager"></div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('collect'); shell.mount();

const statusTag = s => shell.tag(
  s==='已入库'?'s':s==='质检中'||s==='空间校验中'?'p':s==='待质检'?'w':'g', s);

async function load(){
  const r = await api.collect.batchPage({status:fStatus.value, keyword:fKw.value.trim()});
  document.querySelector('#tbl tbody').innerHTML = r.list.length ? r.list.map(b=>`
    <tr><td class="code clickable" data-pts="${b.id}"><b>${shell.esc(b.identifier)}</b></td>
      <td>${shell.esc(b.building_date)}</td><td>${shell.esc(b.data_sources)}</td>
      <td>${shell.tag(b.import_way==='P'?'p':'g', b.import_way==='P'?'点位 Point':'管线 Line')}</td>
      <td class="num">${b.pipe_number||'—'}</td><td class="num">${b.point_number||'—'}</td>
      <td class="num">${b.check_pass?b.check_pass.toFixed(1)+'%':'—'}</td>
      <td class="num">${b.topo_issues?`<span style="color:var(--danger)">${b.topo_issues}</span>`:'0'}</td>
      <td>${statusTag(b.status)}</td><td class="code faint">${shell.esc(b.created_at)}</td>
      <td><div class="row-tools">
        <button class="btn btn-sm" data-pts="${b.id}">点位</button>
        ${b.status!=='已入库'?`<button class="btn btn-sm btn-warn" data-check="${b.id}">质检</button>`:''}
        ${b.status==='待质检'||b.status==='质检中'?`<button class="btn btn-sm btn-primary" data-gen="${b.id}">生成入库</button>`:''}
      </div></td></tr>`).join('')
    : `<tr><td colspan="11">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.getElementById('pager').innerHTML = `共 ${r.total} 个批次`;

  document.querySelectorAll('[data-pts]').forEach(el=>el.addEventListener('click',()=>openPoints(+el.dataset.pts)));
  document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('click',()=>openCheck(+el.dataset.check)));
  document.querySelectorAll('[data-gen]').forEach(el=>el.addEventListener('click',async ()=>{
    const res = await api.collect.generate({batch_id:+el.dataset.gen});
    shell.toast(`入库任务已生成：覆盖物 ${res.overlay_generated} 项 / 管段 ${res.pipe_generated} 条，写入 PostGIS`,'ok');
    load();
  }));
}
async function openPoints(batchId){
  const r = await api.collect.pointPage({batch_id:batchId});
  shell.openDrawer({title:'采集点位明细', bodyHtml:
    `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>点号</th><th>要素</th><th>规格</th>
      <th class="num">高程</th><th>坐标</th><th>质检</th></tr></thead><tbody>`+
    r.list.map(p=>`<tr><td class="code">${p.position}</td><td>${shell.esc(p.feature)}</td>
      <td>${shell.esc(p.spec)}</td><td class="num">${p.elevation.toFixed(2)}</td>
      <td class="code faint">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</td>
      <td>${p.check==='通过'?shell.tag('s','通过'):shell.tag('d',p.check)}</td></tr>`).join('')+
    `</tbody></table></div>`});
}
async function openCheck(batchId){
  const res = await api.collect.check();
  shell.openModal({title:'空间校验与拓扑质检', size:520, bodyHtml:
    `<div style="display:flex;gap:10px;margin-bottom:14px">
      <span class="tag p"><i></i>坐标系转换 WGS84</span><span class="tag p"><i></i>字段校验</span><span class="tag w"><i></i>拓扑检测</span></div>
    <div class="field" style="margin-bottom:12px"><label>质检通过率</label>
      <div style="display:flex;align-items:center;gap:10px"><div class="progress" style="flex:1"><i class="w" style="width:${res.pass}%"></i></div>
      <b class="metric">${res.pass}%</b></div></div>
    <b style="font-size:13px">拓扑问题（${res.issues.length}）</b>
    ${res.issues.map(i=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span class="tag d"><i></i>${i.type}</span><span class="code">${i.code}</span>
      <span class="faint" style="margin-left:auto;font-size:12px">将在图中标红</span></div>`).join('')}`,
    okText:'确认质检结果', onOk:()=>{ shell.toast('质检结果已记录','ok'); }});
}
/* 初始化 */
(async () => {
  const r = await api.collect.batchPage({});
  const L = r.list;
  const sum = (a) => L.reduce((x,b)=>x+(b||0),0);
  document.getElementById('kpis').innerHTML = [
    ['database','本月批次', L.length, 'RTK/CAD/全站仪'],
    ['clock','待质检', L.filter(b=>b.status==='待质检'||b.status==='质检中').length],
    ['alert-triangle','拓扑问题', sum(b=>b.topo_issues), '重合/悬挂/断点'],
    ['check-circle','已入库点位', L.filter(b=>b.status==='已入库').reduce((x,b)=>x+b.point_number,0), 'PostGIS 已写入']
  ].map(([i,l,v,sub])=>`<div class="kpi ${i==='alert-triangle'&&v>0?'warn':''}"><div class="lab">${shell.ic(i)}${l}</div>
    <div class="val">${v}</div><div class="sub">${sub||'采集→入库闭环'}</div></div>`).join('');
  load();
})();
fStatus.addEventListener('change',load);
let kwT; fKw.addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(load,300); });
btnImport.addEventListener('click',()=>shell.openModal({title:'导入采集数据', size:560, bodyHtml:
  `<div class="form-grid">
    <div class="field"><label>数据来源</label><select class="select" id="mSrc">
      <option>RTK 车载测绘</option><option>RTK 手持机</option><option>全站仪补测</option><option>CAD 图纸转换</option></select></div>
    <div class="field"><label>导入方式</label><select class="select"><option>点位 Point</option><option>管线 Line</option></select></div>
    <div class="field full"><label>数据文件</label>
      <div style="border:1px dashed var(--border-strong);border-radius:10px;padding:26px;text-align:center;color:var(--text-sub)">
        ${shell.ic('upload','width:22px;height:22px;vertical-align:middle')}<br>点击或拖拽 Excel / CSV / DXF 到此处
        <div class="faint code" style="margin-top:6px">演示原型 · 不实际上传</div></div></div>
    <div class="field full"><label>备注</label><textarea class="textarea" placeholder="采集区域、作业班组等"></textarea></div>
  </div>`, okText:'创建批次', onOk:()=>{ shell.toast('批次已创建，进入空间校验队列','ok'); }}));
</script>
</body>
</html>
