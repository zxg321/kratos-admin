<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管网一张图 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.map-layout{display:grid;grid-template-columns:250px 1fr 300px;gap:16px;margin-top:16px;min-height:calc(100vh - 140px)}
.map-stage{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.map-stage svg{display:block;cursor:grab}
.map-stage svg.dragging{cursor:grabbing}
.map-toolbar{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.map-toolbar .btn{justify-content:flex-start;background:var(--surface);opacity:.94}
.map-toolbar .btn.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.map-legend{position:absolute;bottom:12px;left:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;z-index:5;font-size:12px;color:var(--text-sub)}
.map-legend .li{display:flex;align-items:center;gap:8px;margin-top:4px}
.map-legend .li:first-child{margin-top:0}
.map-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-md);padding:8px 12px;font-size:12px;box-shadow:var(--sh-md);z-index:6;display:none;min-width:160px}
.layer-tree .lt-item{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;cursor:pointer;border-radius:6px}
.layer-tree .lt-item:hover{background:var(--surface-2)}
.layer-tree .lt-item .cnt{margin-left:auto;font-size:11px;color:var(--text-faint);font-family:var(--mfont)}
.switch{width:34px;height:18px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;flex:none;transition:.15s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-sub);transition:.15s}
.switch.on i{left:18px;background:#06151c}
</style>
</head>
<body data-page="map">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>管网一张图</b> / S1 管网数字资产底座 · 空间分析</div>
    <div class="spacer"></div>
    <span class="tag p"><i></i>WGS84 · PostGIS 下沉计算</span>
    <span class="tag s"><i></i>MapLibre 底图适配（示意）</span>
  </header>

  <div class="map-layout">
    <!-- 左：图层树 -->
    <div class="panel reveal">
      <div class="card-head"><h3>图层树</h3><span class="sub">显隐 / 顺序</span></div>
      <div class="card-body layer-tree" id="layerTree" style="padding:10px 14px"></div>
      <div class="divider" style="margin:8px 0"></div>
      <div class="card-body" style="padding:10px 14px">
        <div class="field"><label>空间查询（关键字/BBox）</label>
          <div style="display:flex;gap:8px"><input class="input" id="spQuery" placeholder="编号 / 名称">
          <button class="btn btn-primary btn-sm" id="spQueryBtn">查询</button></div></div>
        <div id="spResult" class="code faint" style="margin-top:10px;font-size:11px"></div>
      </div>
    </div>

    <!-- 中：SVG 管网 -->
    <div class="map-stage reveal">
      <div class="map-toolbar">
        <button class="btn btn-sm" data-tool="pan">视野拖动</button>
        <button class="btn btn-sm" data-tool="valve">关阀影响分析</button>
        <button class="btn btn-sm" data-tool="excav">开挖影响区</button>
        <button class="btn btn-sm" data-tool="connect">连通分析</button>
        <button class="btn btn-sm" data-tool="topo">拓扑质检</button>
      </div>
      <svg id="pipeSvg" width="100%" height="100%" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-tip" id="mapTip"></div>
      <div class="map-legend">
        <div class="li"><span class="sw" style="background:#3b82f6;width:14px;height:4px;border-radius:2px"></span>给水/配水管道</div>
        <div class="li"><span class="sw" style="background:#06b6d4;width:14px;height:5px;border-radius:2px"></span>输水干管</div>
        <div class="li"><span class="sw" style="background:var(--alert);width:8px;height:8px;border-radius:50%"></span>仪表/监测</div>
        <div class="li"><span class="sw" style="background:var(--success);width:8px;height:8px;border-radius:50%"></span>阀门/构件</div>
        <div class="li"><span class="sw" style="background:var(--danger);width:14px;height:3px;border-radius:2px"></span>分析受影响段</div>
      </div>
    </div>

    <!-- 右：分析结果 -->
    <div class="panel reveal">
      <div class="card-head"><h3>分析结果</h3><span class="sub">空间计算 &lt;2s</span></div>
      <div class="card-body" id="analysisResult">
        <div class="empty" style="padding:24px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>选择左侧工具并在地图上点击要素<br>开始空间分析</span></div>
      </div>
      <div class="divider"></div>
      <div class="card-body" style="padding-top:0">
        <div style="display:flex;gap:14px;margin-bottom:10px">
          <div><div class="faint" style="font-size:11px">管段总数</div><b class="metric" style="font-size:20px">498</b></div>
          <div><div class="faint" style="font-size:11px">管线长度</div><b class="metric" style="font-size:20px">96.8<small class="faint"> km</small></b></div>
        </div>
        <a class="btn btn-sm" style="width:100%;justify-content:center" href="overlay.html">进入覆盖物管理 →</a>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('map');
shell.mount();
const ic = n => shell.ic(n);

/* ---------- 坐标投影（WGS84 示意 → 视口） ---------- */
const BBOX = {minLat:31.2245, maxLat:31.2395, minLng:121.4635, maxLng:121.4910};
const project = (lat,lng) => [
  (lng-BBOX.minLng)/(BBOX.maxLng-BBOX.minLng)*860+20,
  560-(lat-BBOX.minLat)/(BBOX.maxLat-BBOX.minLat)*520-20
];

/* ---------- 图层开关状态 ---------- */
let layerState = {};
(async () => {
  const {tree} = await api.layer.tree();
  tree.forEach(g=>{ layerState[g.id]=true; g.children.forEach(c=>layerState[c.id]=c.on); });
  window.__tree = tree;
  renderTree();
  drawMap();
})();

function renderTree(){
  document.getElementById('layerTree').innerHTML = window.__tree.map(g=>`
    <div style="margin-bottom:6px">
      <div class="lt-item" style="font-weight:600" data-grp="${g.id}">
        <span style="width:14px;display:inline-block">${g.open?'▾':'▸'}</span>${g.name}
        <span class="switch ${layerState[g.id]?'on':''}" data-sw="${g.id}"><i></i></span></div>
      ${g.open?g.children.map(c=>`
        <div class="lt-item" style="padding-left:24px" data-ly="${c.id}">
          <span class="badge-dot" style="background:${layerState[c.id]?'var(--primary)':'var(--border-strong)'}"></span>
          ${shell.esc(c.name)}<span class="cnt">${c.count}</span>
          <span class="switch ${layerState[c.id]?'on':''}" data-sw="${c.id}"><i></i></span></div>`).join(''):''}
    </div>`).join('');
  document.querySelectorAll('[data-sw]').forEach(sw=>sw.addEventListener('click',e=>{
    e.stopPropagation();
    const id=sw.dataset.sw; layerState[id]=!layerState[id];
    const g=window.__tree.find(x=>x.id===id);
    if(g) g.children.forEach(c=>{layerState[c.id]=layerState[id]; c.on=layerState[id];});
    else window.__tree.forEach(x=>x.children.forEach(c=>{if(c.id===id)c.on=layerState[id];}));
    renderTree(); drawMap();
  }));
  document.querySelectorAll('[data-grp]').forEach(it=>it.addEventListener('click',()=>{
    const g=window.__tree.find(x=>x.id===it.dataset.grp); g.open=!g.open; renderTree();
  }));
}

/* ---------- SVG 地图 ---------- */
const PIPE_COLOR = {'给水管道':'#3b82f6','配水管道':'#3b82f6','输水管道':'#06b6d4'};
let svgEl, tip;
async function drawMap(){
  svgEl = document.getElementById('pipeSvg'); tip = document.getElementById('mapTip');
  const [pipesRes, ovlRes] = await Promise.all([api.pipe.list(), api.overlay.list()]);
  let html = '';
  /* 底图网格 */
  html += '<g opacity=".35">';
  for(let x=20;x<=880;x+=86) html+=`<line x1="${x}" y1="0" x2="${x}" y2="560" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  for(let y=0;y<=560;y+=62) html+=`<line x1="20" y1="${y}" x2="880" y2="${y}" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  html += '</g>';
  /* 管线 */
  if(layerState['L-pipe']){
    pipesRes.list.forEach(p=>{
      const pts = p.nodes.map(n=>project(n.lat,n.lng).join(',')).join(' ');
      const c = PIPE_COLOR[p.category]||'#3b82f6';
      const w = p.spec.includes('800')?6:p.spec.includes('500')?5:p.spec.includes('300')?4:3;
      html += `<polyline class="pipe" data-pipe="${p.pipe_number}" points="${pts}" fill="none" stroke="${c}"
        stroke-width="${w}" stroke-linecap="round" opacity=".9" style="cursor:pointer">
        <title>${p.pipe_number} · ${p.category} ${p.spec} · ${p.length}m · ${p.laying_way}</title></polyline>`;
      p.nodes.forEach(n=>{ const [x,y]=project(n.lat,n.lng);
        html += `<circle cx="${x}" cy="${y}" r="3" fill="var(--surface)" stroke="${c}" stroke-width="1.6"/>`; });
    });
  }
  /* 覆盖物 */
  if(layerState['L-ovl']){
    ovlRes.list.forEach(o=>{
      const [x,y]=project(o.lat,o.lng);
      const isMeter=['flow_meter','pressure_meter','monitor_meter','detection_meter'].includes(o.type);
      const color = isMeter?'var(--alert)':o.usage_state===1?'var(--success)':'var(--text-sub)';
      if(o.type==='landmark') html+=`<path d="M${x-6} ${y} l6 -10 6 10 z" fill="var(--warn)" opacity=".9"/>`;
      else html+=`<circle class="ovl" data-id="${o.id}" cx="${x}" cy="${y}" r="6" fill="${color}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`;
      html+=`<circle class="ovl-hit" data-id="${o.id}" cx="${x}" cy="${y}" r="12" fill="transparent" style="cursor:pointer"/>`;
    });
  }
  /* 告警图层（脉冲） */
  if(layerState['L-biz-alarm']){
    const alarmOvls = ovlRes.list.filter(o=>['YY-2024-0406','LL-2024-0411','FM-2024-0118'].includes(o.overlay_number));
    alarmOvls.forEach(o=>{ const [x,y]=project(o.lat,o.lng);
      html+=`<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="var(--danger)" stroke-width="2"><animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>`;});
  }
  svgEl.innerHTML = html;
  bindMapEvents();
}

function bindMapEvents(){
  svgEl.querySelectorAll('.ovl-hit').forEach(hit=>{
    hit.addEventListener('mousemove',async e=>{
      const o = (await api.overlay.get(hit.dataset.id));
      const rect = document.querySelector('.map-stage').getBoundingClientRect();
      tip.style.display='block';
      tip.style.left=(e.clientX-rect.left+14)+'px'; tip.style.top=(e.clientY-rect.top+10)+'px';
      tip.innerHTML = `<b>${shell.esc(o.name)}</b><br><span class="code faint">${o.overlay_number} · ${shell.esc(MOCK.overlayTypes[o.type])}</span><br>
        <span class="code faint">${o.spec||'-'} · ${o.usage_state===1?'在用':'停用'}</span><br>
        <span class="code faint">埋深 ${o.ground_elevation}m · ${shell.esc(o.collect_worker)} 采集</span>`;
    });
    hit.addEventListener('mouseleave',()=>tip.style.display='none');
    hit.addEventListener('click',()=>analysis.run('detail',hit.dataset.id));
  });
  svgEl.querySelectorAll('.pipe').forEach(pl=>{
    pl.addEventListener('click',()=>analysis.run('pipe',pl.dataset.pipe));
  });
}

/* ---------- 空间分析 ---------- */
const analysis = {
  tool:null,
  async run(tool, arg){
    let html='';
    if(tool==='detail'){
      const o = await api.overlay.get(arg);
      html = `<dl class="desc-list"><dt>覆盖物</dt><dd>${shell.esc(o.name)}</dd>
        <dt>编号</dt><dd class="code">${o.overlay_number}</dd><dt>类型</dt><dd>${shell.esc(MOCK.overlayTypes[o.type])}</dd>
        <dt>规格</dt><dd>${shell.esc(o.spec||'-')}</dd><dt>坐标</dt><dd class="code">${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</dd>
        <dt>状态</dt><dd>${o.usage_state===1?'在用':'停用'}</dd></dl>`;
    }
    else if(tool==='pipe'){
      const p = (await api.pipe.list()).list.find(x=>x.pipe_number===arg);
      html = `<dl class="desc-list"><dt>管段</dt><dd class="code">${p.pipe_number}</dd><dt>类别</dt><dd>${p.category}</dd>
        <dt>规格</dt><dd>${p.spec}</dd><dt>长度</dt><dd class="num">${p.length} m</dd><dt>敷设</dt><dd>${p.laying_way}</dd>
        <dt>埋深</dt><dd>${p.nodes.map(n=>n.z+'m').join(' / ')}</dd></dl>
        <button class="btn btn-sm btn-warn" style="margin-top:10px;width:100%" onclick="analysis.run('valve','${p.start_point_code}')">以该管段为对象 → 关阀影响分析</button>`;
    }
    else if(tool==='valve'){
      const r = await api.analysis.closeValve({});
      this.highlight(r.render_nodes);
      html = `<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag a"><i></i>关阀影响</span><span class="tag p"><i></i>PostGIS 1.2s</span></div>
        <dl class="desc-list"><dt>关闭阀门</dt><dd class="code">${r.valves.join(' / ')}</dd>
        <dt>影响管段</dt><dd>${r.affected_pipes.join('<br>')}</dd><dt>影响用户</dt><dd class="metric" style="font-size:18px">${r.affected_users} 户</dd>
        <dt>预计时长</dt><dd>${r.est_hours} h</dd><dt>关联覆盖物</dt><dd class="code">${r.affected_overlays.join(' / ')}</dd></dl>
        <button class="btn btn-sm btn-primary" style="margin-top:12px;width:100%" onclick="shell.toast('已生成停水通知工单','ok')">生成停水通知工单</button>`;
    }
    else if(tool==='excav'){
      const r = await api.analysis.excavation({});
      this.highlight(r.render_nodes);
      html = `<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag w"><i></i>开挖影响区</span><span class="tag p"><i></i>半径 120m</span></div>
        <dl class="desc-list"><dt>影响管段</dt><dd>${r.affected_pipes.join('<br>')}</dd>
        <dt>范围内要素</dt><dd class="code">${r.affected_overlays.join(' / ')}</dd></dl>
        <div class="faint" style="font-size:12px;margin-top:10px">已联动 S4 施工监护：开挖作业信息将推送巡检与应急域。</div>`;
    }
    else if(tool==='connect'){
      const r = await api.analysis.connectivity({});
      this.highlight(r.path);
      html = `<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag s"><i></i>连通可达</span></div>
        <dl class="desc-list"><dt>路径</dt><dd class="code">${r.path.join(' → ')}</dd><dt>跳数</dt><dd class="metric">${r.hops}</dd></dl>`;
    }
    else if(tool==='topo'){
      const r = await api.analysis.topology({});
      html = `<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag d"><i></i>发现 ${r.issues.length} 处拓扑问题</span></div>`+
        r.issues.map(i=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span class="tag d"><i></i>${i.type}</span><span class="code">${i.code}</span></div>`).join('')+
        `<div class="faint" style="font-size:12px;margin-top:10px">与 S2 拓扑质检联动，质检问题可视化标红。</div>`;
    }
    document.getElementById('analysisResult').innerHTML = html;
  },
  highlight(nodes){
    svgEl.querySelectorAll('.pipe').forEach(pl=>{
      if(!pl.dataset.base) pl.dataset.base = pl.getAttribute('stroke');
      pl.setAttribute('stroke','var(--danger)');
      pl.setAttribute('stroke-width', (+pl.getAttribute('stroke-width')||3)+1.5);
      setTimeout(()=>{ pl.setAttribute('stroke', pl.dataset.base);
        pl.setAttribute('stroke-width', +pl.getAttribute('stroke-width')-1.5); },3000);
    });
  }
};
window.analysis = analysis;

/* 工具栏 */
document.querySelectorAll('[data-tool]').forEach(btn=>{
  btn.addEventListener('click',async ()=>{
    document.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    if(btn.dataset.tool==='pan'){ shell.toast('视野拖动模式：直接拖动地图即可'); return; }
    window.__pipes = (await api.pipe.list()).list;
    analysis.run(btn.dataset.tool);
    shell.toast('分析完成，结果见右侧面板','ok');
  });
});

/* 空间查询 */
document.getElementById('spQueryBtn').addEventListener('click',async ()=>{
  const kw = document.getElementById('spQuery').value.trim();
  if(!kw) return shell.toast('请输入查询关键字','err');
  const r = await api.overlay.page({keyword:kw});
  document.getElementById('spResult').innerHTML =
    `命中 <b style="color:var(--primary)">${r.total}</b> 项：` + r.list.slice(0,4).map(o=>o.overlay_number).join(' · ');
  shell.toast(`空间查询完成，命中 ${r.total} 项`,'ok');
});
</script>
</body>
</html>
