<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>覆盖物管理 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="overlay">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>覆盖物管理</b> / S1 管网一张图 · 统一覆盖物台账</div>
    <div class="spacer"></div>
    <span class="tag p"><i></i>演示数据</span><span class="tag s"><i></i>系统在线</span>
  </header>

  <div class="grid g-4 page-block reveal" id="kpis"></div>

  <div class="panel page-block reveal">
    <div class="toolbar">
      <select class="select" id="fType" style="width:150px"><option value="all">全部类型</option></select>
      <select class="select" id="fState" style="width:120px">
        <option value="all">全部状态</option><option value="1">在用</option><option value="2">停用</option></select>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="fKw" placeholder="编号 / 名称"></div>
      <div class="grow"></div>
      <button class="btn btn-danger btn-sm" id="btnBatch" disabled>批量删除</button>
      <button class="btn btn-primary" id="btnAdd">新增覆盖物</button>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="tbl">
      <thead><tr><th style="width:34px"><input type="checkbox" id="chkAll"></th>
        <th>编号</th><th>名称</th><th>类型</th><th>关联设备</th><th>规格</th><th class="num">埋深 m</th>
        <th>坐标</th><th>状态</th><th>采集/校核</th><th>更新时间</th><th style="width:110px">操作</th></tr></thead>
      <tbody></tbody></table></div>
    <div class="pager" id="pager"></div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('overlay'); shell.mount();
let selected = new Set(), cache = [];

function stateTag(s){ return s===1 ? shell.tag('s','在用') : shell.tag('g','停用'); }
async function load(){
  const r = await api.overlay.page({type:fType.value, usage_state:fState.value, keyword:fKw.value.trim()});
  cache = r.list; selected.clear(); btnBatch.disabled = true;
  document.querySelector('#tbl tbody').innerHTML = r.list.length ? r.list.map(o=>`
    <tr><td><input type="checkbox" class="chk" data-id="${o.id}"></td>
      <td class="code">${shell.esc(o.overlay_number)}</td><td class="clickable" data-detail="${o.id}"><b>${shell.esc(o.name)}</b></td>
      <td>${shell.tag('p',MOCK.overlayTypes[o.type])}</td>
      <td class="code faint">${shell.esc(o.device_number||'—')}</td><td>${shell.esc(o.spec||'—')}</td>
      <td class="num">${o.ground_elevation.toFixed(2)}</td>
      <td class="code faint">${o.lat.toFixed(4)}, ${o.lng.toFixed(4)}</td>
      <td>${stateTag(o.usage_state)}</td>
      <td class="faint">${shell.esc(o.collect_worker)} / ${shell.esc(o.check_worker)}</td>
      <td class="code faint">${shell.esc(o.updated_at)}</td>
      <td><div class="row-tools">
        <button class="btn btn-sm" data-edit="${o.id}">编辑</button>
        <button class="btn btn-sm btn-danger" data-del="${o.id}">删除</button></div></td></tr>`).join('')
    : `<tr><td colspan="12">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.getElementById('pager').innerHTML = `共 ${r.total} 条`;
  /* 事件绑定 */
  document.querySelectorAll('.chk').forEach(c=>c.addEventListener('change',()=>{
    c.checked ? selected.add(c.dataset.id) : selected.delete(c.dataset.id);
    btnBatch.disabled = selected.size===0;
  }));
  document.querySelectorAll('[data-detail]').forEach(td=>td.addEventListener('click',()=>openDetail(+td.dataset.detail)));
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
    const o = cache.find(x=>x.id===+b.dataset.edit); openForm(o);
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const o = cache.find(x=>x.id===+b.dataset.del);
    shell.openModal({title:'删除覆盖物', size:420, bodyHtml:
      `<p>确认删除 <b class="code">${shell.esc(o.overlay_number)}</b>（${shell.esc(o.name)}）？</p>
       <p class="faint" style="font-size:12px;margin-top:8px">删除后关联要素数据不可恢复（演示）。</p>`,
      okText:'确认删除', onOk: async ()=>{ await api.overlay.delete({ids:String(o.id)}); shell.toast('已删除 1 项','ok'); load(); }});
  }));
}
async function openDetail(id){
  const o = await api.overlay.get(id);
  shell.openDrawer({title: shell.esc(o.name), bodyHtml:
    `<dl class="desc-list">
      <dt>编号</dt><dd class="code">${o.overlay_number}</dd>
      <dt>类型</dt><dd>${shell.esc(MOCK.overlayTypes[o.type])}</dd>
      <dt>关联设备</dt><dd class="code">${shell.esc(o.device_number||'—')}</dd>
      <dt>规格</dt><dd>${shell.esc(o.spec||'—')}</dd>
      <dt>坐标</dt><dd class="code">${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</dd>
      <dt>地面高程</dt><dd>${o.ground_elevation.toFixed(2)} m</dd>
      <dt>状态</dt><dd>${o.usage_state===1?'在用':'停用'}</dd>
      <dt>采集人</dt><dd>${shell.esc(o.collect_worker)}</dd>
      <dt>校核人</dt><dd>${shell.esc(o.check_worker)}</dd>
      <dt>更新时间</dt><dd class="code">${shell.esc(o.updated_at)}</dd></dl>
    <div class="divider"></div>
    <a class="btn btn-sm" style="width:100%;justify-content:center" href="map.html">在一张图中定位 →</a>`});
}
function openForm(o){
  const isEdit = !!o;
  shell.openModal({title: isEdit?'编辑覆盖物':'新增覆盖物', size:600, bodyHtml:
    `<div class="form-grid">
      <div class="field"><label>类型</label><select class="select" id="mType">${Object.entries(MOCK.overlayTypes).map(([k,v])=>
        `<option value="${k}" ${o&&o.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>覆盖物编号</label><input class="input" id="mNo" value="${o?shell.esc(o.overlay_number):''}" placeholder="FM-2026-0001"></div>
      <div class="field full"><label>名称</label><input class="input" id="mName" value="${o?shell.esc(o.name):''}" placeholder="如：城南路1号阀门"></div>
      <div class="field"><label>规格</label><input class="input" id="mSpec" value="${o?shell.esc(o.spec||''):''}" placeholder="DN400 蝶阀"></div>
      <div class="field"><label>使用状态</label><select class="select" id="mState"><option value="1">在用</option><option value="2">停用</option></select></div>
      <div class="field"><label>纬度</label><input class="input" id="mLat" value="${o?o.lat:''}" placeholder="31.23042"></div>
      <div class="field"><label>经度</label><input class="input" id="mLng" value="${o?o.lng:''}" placeholder="121.47367"></div>
      <div class="field full"><label>备注：坐标统一 WGS84(4326)，入库前经空间校验</label></div>
    </div>`,
    okText: isEdit?'保存修改':'创建', onOk: async ()=>{
      if(!document.getElementById('mName').value.trim()) { shell.toast('名称必填','err'); return false; }
      await (isEdit?api.overlay.update():api.overlay.create());
      shell.toast(isEdit?'已保存':'已创建覆盖物','ok'); load();
    }});
}
/* 初始化 */
(async () => {
  Object.entries(MOCK.overlayTypes).forEach(([k,v])=>{
    const op=document.createElement('option'); op.value=k; op.textContent=v; fType.appendChild(op); });
  const all = (await api.overlay.list()).list;
  document.getElementById('kpis').innerHTML = [
    ['map-pin','覆盖物总数', all.length],
    ['check-circle','在用', all.filter(o=>o.usage_state===1).length],
    ['info','停用', all.filter(o=>o.usage_state!==1).length],
    ['layers','类型数', new Set(all.map(o=>o.type)).size]
  ].map(([i,l,v])=>`<div class="kpi"><div class="lab">${shell.ic(i)}${l}</div><div class="val">${v}</div>
    <div class="sub">统一台账 · WGS84</div></div>`).join('');
  load();
})();
[fType,fState].forEach(el=>el.addEventListener('change',load));
let kwT; fKw.addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(load,300); });
chkAll.addEventListener('change',()=>{ document.querySelectorAll('.chk').forEach(c=>{c.checked=chkAll.checked;
  chkAll.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id);}); btnBatch.disabled=selected.size===0; });
btnBatch.addEventListener('click',()=>shell.openModal({title:'批量删除', size:420, bodyHtml:
  `<p>确认删除选中的 <b>${selected.size}</b> 项覆盖物？</p>`, okText:'确认删除',
  onOk: async ()=>{ await api.overlay.delete({ids:[...selected].join(',')}); shell.toast(`已删除 ${selected.size} 项`,'ok'); load(); }}));
btnAdd.addEventListener('click',()=>openForm(null));
</script>
</body>
</html>
