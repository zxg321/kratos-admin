<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巡检作业 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--border)}
.tabs .tab{padding:9px 16px;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tabs .tab:hover{color:var(--text)}
.tabs .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabpane{display:none}.tabpane.on{display:block;animation:reveal .35s var(--ease)}
.track-card svg{display:block;background:var(--surface-2);border-radius:var(--r-md);border:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface-2);font-size:13px;color:var(--text-sub);cursor:pointer;margin-right:8px}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body data-page="patrol">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>巡检作业</b> / S4 计划工单 · 执行 · 轨迹 · 隐患 · AI 识别</div>
    <div class="spacer"></div>
    <span class="tag p"><i></i>演示数据</span><span class="tag s"><i></i>移动端 S9 协同在线</span>
  </header>

  <div class="grid g-4 page-block reveal" id="kpis"></div>

  <div class="panel page-block reveal">
    <div class="tabs">
      <div class="tab on" data-tab="orders">计划工单</div>
      <div class="tab" data-tab="track">轨迹回放</div>
      <div class="tab" data-tab="danger">隐患上报</div>
      <div class="tab" data-tab="calib">标定与统计</div>
    </div>

    <!-- Tab1 计划工单 -->
    <div class="tabpane on" id="pane-orders">
      <div class="toolbar">
        <select class="select" id="poStatus" style="width:130px">
          <option value="all">全部状态</option><option>待领取</option><option>执行中</option><option>已完成</option></select>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="poKw" placeholder="工单号 / 名称 / 负责人"></div>
        <div class="grow"></div>
        <button class="btn btn-primary" id="btnOrder">新增巡检工单</button>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="orderTbl">
        <thead><tr><th>工单号</th><th>名称</th><th>区域</th><th>类型</th><th>负责人</th>
          <th>计划日期</th><th class="num">点位</th><th>进度</th><th>状态</th><th style="width:130px">操作</th></tr></thead>
        <tbody></tbody></table></div>
    </div>

    <!-- Tab2 轨迹回放 -->
    <div class="tabpane" id="pane-track">
      <div class="card-body grid g-2" id="trackCards"></div>
    </div>

    <!-- Tab3 隐患上报 -->
    <div class="tabpane" id="pane-danger">
      <div class="toolbar">
        <select class="select" id="dhLevel" style="width:120px">
          <option value="all">全部级别</option><option>高</option><option>中</option><option>低</option></select>
        <select class="select" id="dhStatus" style="width:130px">
          <option value="all">全部状态</option><option>待派单</option><option>待复核</option><option>处置中</option><option>已闭环</option></select>
        <div class="grow"></div>
        <button class="btn btn-primary" id="btnDanger">上报隐患</button>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="dangerTbl">
        <thead><tr><th>隐患号</th><th>位置</th><th>类型</th><th>级别</th><th>上报人</th>
          <th>时间</th><th>AI 识别</th><th>状态</th><th style="width:90px">操作</th></tr></thead>
        <tbody></tbody></table></div>
    </div>

    <!-- Tab4 标定与统计 -->
    <div class="tabpane" id="pane-calib">
      <div class="grid g-3-2" style="padding:16px">
        <div>
          <b style="font-size:13px">设备标定任务</b>
          <div class="tbl-wrap" style="margin-top:10px"><table class="tbl" id="calTbl">
            <thead><tr><th>任务号</th><th>设备</th><th>类型</th><th>计划日期</th><th>负责人</th><th>状态</th><th style="width:80px">操作</th></tr></thead>
            <tbody></tbody></table></div>
        </div>
        <div>
          <b style="font-size:13px">本月巡检统计</b>
          <div id="statBox" style="margin-top:10px"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('patrol'); shell.mount();
const stTag = s => s==='已完成'||s==='已闭环'||s==='已通过'?shell.tag('s',s):
  s==='执行中'||s==='处置中'?shell.tag('p',s,true):s==='待复核'?shell.tag('w',s):shell.tag('g',s);

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); document.getElementById('pane-'+t.dataset.tab).classList.add('on');
}));

/* Tab1 工单 */
async function loadOrders(){
  const r = await api.patrol.orderPage({status:poStatus.value, keyword:poKw.value.trim()});
  document.querySelector('#orderTbl tbody').innerHTML = r.list.length ? r.list.map(o=>`
    <tr><td class="code">${shell.esc(o.order_no)}</td><td><b>${shell.esc(o.name)}</b></td>
      <td>${shell.esc(o.region)}</td><td>${shell.tag('g',o.type)}</td>
      <td>${shell.esc(o.assignee)}</td><td>${shell.esc(o.plan_date)}</td>
      <td class="num">${o.done}/${o.points}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="width:80px"><i style="width:${o.progress}%"></i></div>
        <span class="code faint">${o.progress}%</span></div></td>
      <td>${stTag(o.status)}</td>
      <td><div class="row-tools">
        ${o.status==='待领取'?`<button class="btn btn-sm btn-primary" data-claim="${o.order_no}">领取</button>`:''}
        <button class="btn btn-sm" data-view="${o.order_no}">查看</button></div></td></tr>`).join('')
    : `<tr><td colspan="10">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',()=>{ shell.toast(`工单 ${b.dataset.claim} 已领取，同步至移动端`,'ok'); }));
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    const o = (window.__orders||[]).find(x=>x.order_no===b.dataset.view);
    shell.openDrawer({title:shell.esc(o.name), bodyHtml:
      `<dl class="desc-list"><dt>工单号</dt><dd class="code">${o.order_no}</dd><dt>区域</dt><dd>${shell.esc(o.region)}</dd>
      <dt>类型</dt><dd>${shell.esc(o.type)}</dd><dt>负责人</dt><dd>${shell.esc(o.assignee)}（${shell.esc(o.phone)}）</dd>
      <dt>计划日期</dt><dd>${shell.esc(o.plan_date)}</dd><dt>点位</dt><dd>${o.done}/${o.points} 已完成</dd>
      <dt>状态</dt><dd>${o.status}</dd></dl>
      <div class="divider"></div><div class="faint code">移动端 S9 协同：点位上报 / 单线上报 / 照相抄表</div>`});
  }));
}
btnOrder.addEventListener('click',()=>shell.openModal({title:'新增巡检工单', size:560, bodyHtml:
  `<div class="form-grid">
    <div class="field full"><label>工单名称</label><input class="input" placeholder="如：城北片区日常巡检"></div>
    <div class="field"><label>区域</label><select class="select"><option>南一区</option><option>北二区</option><option>城西供水区</option><option>厂区</option></select></div>
    <div class="field"><label>类型</label><select class="select"><option>日常巡检</option><option>专项巡检</option><option>周期巡检</option></select></div>
    <div class="field"><label>负责人</label><select class="select"><option>张峰</option><option>刘洋</option><option>周涛</option><option>陈昊</option></select></div>
    <div class="field"><label>计划日期</label><input class="input" type="date" value="2026-09-15"></div>
  </div>`, okText:'创建并派发', onOk: async ()=>{ await api.patrol.orderCreate();
    shell.toast('工单已创建并派发至移动端','ok'); loadOrders(); }}));

/* Tab2 轨迹 */
async function loadTracks(){
  const tracks = await api.patrol.track();
  document.getElementById('trackCards').innerHTML = tracks.map((t,ti)=>{
    const W=380,H=200;
    const lats=t.pts.map(p=>p[0]), lngs=t.pts.map(p=>p[1]);
    const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLn=Math.min(...lngs),mxLn=Math.max(...lngs);
    const rLa=mxLa-mnLa||1e-6, rLn=mxLn-mnLn||1e-6;
    const pts = t.pts.map(p=>`${20+(p[1]-mnLn)/rLn*(W-40)},${H-20-(p[0]-mnLa)/rLa*(H-40)}`).join(' ');
    return `<div class="track-card panel" style="padding:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <b>${shell.esc(t.staff)}</b><span class="code faint">${shell.esc(t.order)}</span>
        <span class="tag ${t.status==='进行中'?'p':'s'}" style="margin-left:auto"><i></i>${t.status}</span></div>
      <svg width="100%" viewBox="0 0 ${W} ${H}">
        <polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round">
          <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></polyline>
        <circle r="5" fill="var(--alert)"><animateMotion dur="6s" repeatCount="indefinite" path="M${pts.replace(/ /g,' L')}"/></circle>
        ${t.pts.map((p,i)=>{const x=20+(p[1]-mnLn)/rLn*(W-40), y=H-20-(p[0]-mnLa)/rLa*(H-40);
          return `<circle cx="${x}" cy="${y}" r="3.2" fill="${i===t.pts.length-1?'var(--success)':'var(--surface)'}" stroke="var(--primary)" stroke-width="1.6"/>`}).join('')}
      </svg>
      <div style="display:flex;gap:16px;margin-top:10px" class="code faint">
        <span>里程 ${t.km} km</span><span>历时 ${t.duration}</span><span>点位 ${t.points_done}/${t.points_total}</span></div>
    </div>`;}).join('');
}

/* Tab3 隐患 */
async function loadDangers(){
  const r = await api.patrol.dangerPage({status:dhStatus.value, level:dhLevel.value});
  document.querySelector('#dangerTbl tbody').innerHTML = r.list.length ? r.list.map(d=>`
    <tr><td class="code">${shell.esc(d.danger_no)}</td><td>${shell.esc(d.location)}</td>
      <td>${shell.tag('g',d.type)}</td><td>${d.level==='高'?shell.tag('d',d.level):d.level==='中'?shell.tag('w',d.level):shell.tag('g',d.level)}</td>
      <td>${shell.esc(d.reporter)}</td><td class="code faint">${shell.esc(d.report_time)}</td>
      <td>${d.ai_recognized?shell.tag('p','AI 识别'):'<span class="faint">—</span>'}</td>
      <td>${stTag(d.status)}</td>
      <td><div class="row-tools">${d.status==='待复核'?`<button class="btn btn-sm btn-primary" data-rv="${d.danger_no}">复核</button>`:''}</div></td></tr>`).join('')
    : `<tr><td colspan="9">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.querySelectorAll('[data-rv]').forEach(b=>b.addEventListener('click',async ()=>{
    await api.patrol.dangerReview(); shell.toast(`隐患 ${b.dataset.rv} 复核通过，转入处置`,'ok'); loadDangers(); }));
}
btnDanger.addEventListener('click',()=>shell.openModal({title:'上报隐患', size:560, bodyHtml:
  `<div class="form-grid">
    <div class="field full"><label>位置</label><input class="input" placeholder="如：望江路与中山路交叉口"></div>
    <div class="field"><label>类型</label><select class="select"><option>管线占压</option><option>井盖破损</option><option>积水渗漏</option><option>安防隐患</option><option>其他</option></select></div>
    <div class="field"><label>级别</label><select class="select"><option>高</option><option>中</option><option>低</option></select></div>
    <div class="field full"><label>描述（支持现场照片，AI 自动识别缺陷）</label><textarea class="textarea" placeholder="现场情况说明"></textarea></div>
  </div>`, okText:'提交上报', onOk:()=>{ shell.toast('隐患已上报，待复核','ok'); loadDangers(); }}));

/* Tab4 标定 + 统计 */
async function loadCalib(){
  const r = await api.patrol.calibrationPage();
  document.querySelector('#calTbl tbody').innerHTML = r.list.map(c=>`
    <tr><td class="code">${shell.esc(c.task_no)}</td><td>${shell.esc(c.device)}</td>
      <td>${shell.tag('g',c.type)}</td><td>${shell.esc(c.plan_date)}</td><td>${shell.esc(c.assignee)}</td>
      <td>${stTag(c.status)}</td>
      <td><div class="row-tools">${c.status==='待审核'?`<button class="btn btn-sm btn-primary" data-ok="${c.task_no}">审核</button>`:''}</div></td></tr>`).join('');
  document.querySelectorAll('[data-ok]').forEach(b=>b.addEventListener('click',()=>{ shell.toast(`标定任务 ${b.dataset.ok} 审核通过`,'ok'); }));
  const s = await api.patrol.stats();
  document.getElementById('statBox').innerHTML = `
    <div class="grid g-2" style="gap:10px">
      ${[['clipboard-list','完成工单',s.orders_done],['alert-triangle','隐患',s.dangers],
         ['wrench','开挖',s.excavation],['zap','IoT 异常',s.iot_alarm]].map(([i,l,v])=>
        `<div class="panel" style="padding:12px"><div class="faint" style="font-size:11px;display:flex;gap:6px;align-items:center">${shell.ic(i)}${l}</div>
        <b class="metric" style="font-size:22px">${v}</b></div>`).join('')}
    </div>
    <div class="divider"></div>
    <b style="font-size:13px">AI 图像识别准确率</b>
    <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
      <div class="progress" style="flex:1"><i class="s" style="width:${(s.recognition.rate*100).toFixed(1)}%"></i></div>
      <b class="metric">${(s.recognition.rate*100).toFixed(1)}%</b></div>
    <div class="faint code" style="margin-top:4px">识别 ${s.recognition.total} 张 · 正确 ${s.recognition.correct} 张 · 目标 ≥85%</div>
    <div class="divider"></div>
    <b style="font-size:13px">业绩排行</b>
    ${s.rank.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span class="metric" style="width:20px;color:${i===0?'var(--warn)':'var(--text-faint)'}">${i+1}</span>
      <span style="flex:1;font-size:13px">${shell.esc(p.name)}</span>
      <span class="code faint">完成 ${p.done}</span><b class="metric">${p.score}</b></div>`).join('')}`;
}
(async () => {
  const o = await api.patrol.orderPage({});
  window.__orders = o.list;
  document.getElementById('kpis').innerHTML = [
    ['clipboard-list','执行中工单', o.list.filter(x=>x.status==='执行中').length],
    ['check-circle','本月完成', 186, '台账全量线上化'],
    ['alert-triangle','隐患未闭环', (await api.patrol.dangerPage({})).list.filter(d=>d.status!=='已闭环').length],
    ['cpu','AI 识别准确率', '90.3%', '目标 ≥85%']
  ].map(([i,l,v,sub])=>`<div class="kpi ${i==='alert-triangle'&&v>0?'warn':''}"><div class="lab">${shell.ic(i)}${l}</div>
    <div class="val">${v}</div><div class="sub">${sub||'巡检全闭环'}</div></div>`).join('');
  loadOrders(); loadTracks(); loadDangers(); loadCalib();
})();
poStatus.addEventListener('change',loadOrders);
let kwT; poKw.addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(loadOrders,300); });
dhLevel.addEventListener('change',loadDangers); dhStatus.addEventListener('change',loadDangers);
</script>
</body>
</html>
