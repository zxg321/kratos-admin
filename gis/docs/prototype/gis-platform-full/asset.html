<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产生命周期 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--border)}
.tabs .tab{padding:9px 16px;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tabs .tab:hover{color:var(--text)}
.tabs .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabpane{display:none}.tabpane.on{display:block;animation:reveal .35s var(--ease)}
.life{display:flex;align-items:center;gap:6px;margin-top:14px}
.life .node{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--text-faint)}
.life .node i{width:12px;height:12px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border-strong)}
.life .node.on i{background:var(--primary);border-color:var(--primary);box-shadow:0 0 8px var(--primary-soft)}
.life .node.on{color:var(--text)}
.life .line{height:2px;flex:1;background:var(--border-strong);margin-bottom:16px}
</style>
</head>
<body data-page="asset">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>资产生命周期</b> / S6 台账 · 调拨 · 改装 · 报废 · 变卖 · BPM 审批</div>
    <div class="spacer"></div>
    <span class="tag p"><i></i>演示数据</span><span class="tag s"><i></i>BPM 对接在线</span>
  </header>

  <div class="grid g-4 page-block reveal" id="kpis"></div>

  <div class="panel page-block reveal">
    <div class="tabs">
      <div class="tab on" data-tab="ledger">资产台账</div>
      <div class="tab" data-tab="bpm">BPM 审批流</div>
    </div>

    <!-- Tab1 台账 -->
    <div class="tabpane on" id="pane-ledger">
      <div class="toolbar">
        <select class="select" id="fCat" style="width:140px">
          <option value="all">全部类别</option><option>机泵设备</option><option>计量仪表</option>
          <option>自控设备</option><option>输配管道</option></select>
        <select class="select" id="fStatus" style="width:140px">
          <option value="all">全部状态</option><option>在用</option><option>待检修</option><option>报废审批中</option><option>已变卖</option></select>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="fKw" placeholder="资产编号 / 名称"></div>
        <div class="grow"></div>
        <button class="btn btn-primary" id="btnTransfer">发起调拨申请</button>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="tbl">
        <thead><tr><th>资产编号</th><th>名称</th><th>类别</th><th>区域</th><th>状态</th>
          <th>安装日期</th><th>保修到期</th><th>最近履历</th><th>BPM</th><th style="width:80px">操作</th></tr></thead>
        <tbody></tbody></table></div>
      <div class="pager" id="pager"></div>
    </div>

    <!-- Tab2 BPM -->
    <div class="tabpane" id="pane-bpm">
      <div class="toolbar">
        <select class="select" id="bType" style="width:150px">
          <option value="all">全部流程类型</option><option>设备调拨</option><option>改装改造</option><option>设备报废</option><option>设备变卖</option></select>
        <div class="grow"></div>
        <span class="faint code">对接端点：process-instance/createNew · task/approve · task/reject · task/return</span>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="bpmTbl">
        <thead><tr><th>流程号</th><th>类型</th><th>标题</th><th>申请人</th><th>申请时间</th><th>当前节点</th><th>状态</th><th style="width:130px">操作</th></tr></thead>
        <tbody></tbody></table></div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('asset'); shell.mount();
const stTag = s => s==='在用'?shell.tag('s',s):s==='待检修'?shell.tag('w',s,true):
  s.includes('审批')?shell.tag('a',s):s==='已变卖'?shell.tag('g',s):shell.tag('g',s);

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); document.getElementById('pane-'+t.dataset.tab).classList.add('on');
}));

async function load(){
  const r = await api.asset.page({category:fCat.value, status:fStatus.value, keyword:fKw.value.trim()});
  document.querySelector('#tbl tbody').innerHTML = r.list.length ? r.list.map(a=>`
    <tr><td class="code clickable" data-id="${a.id}"><b>${shell.esc(a.asset_no)}</b></td>
      <td>${shell.esc(a.name)}</td><td>${shell.tag('g',a.category)}</td><td>${shell.esc(a.area)}</td>
      <td>${stTag(a.status)}</td><td>${shell.esc(a.install_date)}</td>
      <td class="code faint">${shell.esc(a.warranty_end||'—')}</td>
      <td class="faint" style="max-width:180px">${shell.esc(a.last_case)}</td>
      <td>${a.bpm&&a.bpm!=='-'?shell.tag('p',a.bpm):'<span class="faint">—</span>'}</td>
      <td><div class="row-tools"><button class="btn btn-sm" data-id="${a.id}">详情</button></div></td></tr>`).join('')
    : `<tr><td colspan="10">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.getElementById('pager').innerHTML = `共 ${r.total} 项资产`;
  document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openDetail(+el.dataset.id)));
}
const LIFE_NODES = ['入库','安装','在用','维保','调拨/改装','报废/变卖','归档'];
function openDetail(id){
  api.asset.page({}).then(r=>{
    const a = r.list.find(x=>x.id===id);
    const lifeIdx = a.status==='在用'?2:a.status==='待检修'?3:a.status.includes('报废')||a.status==='已变卖'?5:4;
    shell.openDrawer({title:shell.esc(a.name), bodyHtml:
      `<dl class="desc-list">
        <dt>资产编号</dt><dd class="code">${shell.esc(a.asset_no)}</dd>
        <dt>类别</dt><dd>${shell.esc(a.category)}</dd><dt>所属区域</dt><dd>${shell.esc(a.area)}</dd>
        <dt>状态</dt><dd>${shell.esc(a.status)}</dd>
        <dt>安装日期</dt><dd>${shell.esc(a.install_date)}</dd>
        <dt>保修到期</dt><dd>${shell.esc(a.warranty_end||'—')}</dd>
        <dt>最近履历</dt><dd>${shell.esc(a.last_case)}</dd>
        <dt>BPM 流程</dt><dd class="code">${shell.esc(a.bpm)}</dd></dl>
      <div class="life">${LIFE_NODES.map((n,i)=>
        `${i>0?'<span class="line"></span>':''}<div class="node ${i<=lifeIdx?'on':''}"><i></i>${n}</div>`).join('')}</div>
      <div class="divider"></div>
      <div class="faint code">状态变更全程留痕（S6-PR07 资产审计）</div>`});
  });
}
async function loadBpm(){
  const r = await api.asset.bpmPage({type:bType.value});
  document.querySelector('#bpmTbl tbody').innerHTML = r.list.length ? r.list.map(f=>`
    <tr><td class="code">${shell.esc(f.bpm_no)}</td><td>${shell.tag('g',f.type)}</td>
      <td><b>${shell.esc(f.title)}</b></td><td>${shell.esc(f.applyer)}</td>
      <td class="code faint">${shell.esc(f.apply_time)}</td><td>${shell.esc(f.node)}</td>
      <td>${f.status==='已完成'?shell.tag('s',f.status):shell.tag('a',f.status,true)}</td>
      <td><div class="row-tools">${f.status==='审批中'?`
        <button class="btn btn-sm btn-primary" data-ap="${f.bpm_no}">通过</button>
        <button class="btn btn-sm btn-danger" data-rj="${f.bpm_no}">驳回</button>`:''}</div></td></tr>`).join('')
    : `<tr><td colspan="8">${shell.emptyHtml('无流程')}</td></tr>`;
  document.querySelectorAll('[data-ap]').forEach(b=>b.addEventListener('click',async ()=>{
    const r = await api.asset.bpmApprove(); shell.toast(`${b.dataset.ap} 已通过，${r.node}`,'ok'); loadBpm(); }));
  document.querySelectorAll('[data-rj]').forEach(b=>b.addEventListener('click',()=>{
    shell.openModal({title:'驳回确认', size:420, bodyHtml:
      `<p>确认驳回 <b class="code">${b.dataset.rj}</b>？</p>
       <div class="field" style="margin-top:10px"><label>驳回意见</label><textarea class="textarea" placeholder="退回修改说明"></textarea></div>`,
      okText:'确认驳回', onOk: async ()=>{ await api.asset.bpmReject(); shell.toast('已驳回到申请人','ok'); loadBpm(); }});}));
}
btnTransfer.addEventListener('click',()=>shell.openModal({title:'发起设备调拨申请', size:560, bodyHtml:
  `<div class="form-grid">
    <div class="field full"><label>资产</label><select class="select"><option>DT-2020-0012 出厂区流量计</option><option>ZB-2018-0007 城南泵站 2# 离心泵</option></select></div>
    <div class="field"><label>调出区域</label><select class="select"><option>出厂区</option><option>城南加压区</option></select></div>
    <div class="field"><label>调入区域</label><select class="select"><option>城西供水区</option><option>北二区</option></select></div>
    <div class="field full"><label>调拨原因</label><textarea class="textarea" placeholder="业务调整说明"></textarea></div>
  </div>`, okText:'提交 BPM 审批', onOk: async ()=>{ const r=await api.asset.transfer();
    shell.toast(`调拨申请已提交 BPM：${r.bpm_no}`,'ok'); loadBpm(); }}));
(async () => {
  const all = (await api.asset.page({})).list;
  document.getElementById('kpis').innerHTML = [
    ['package','资产总数', all.length],
    ['check-circle','在用', all.filter(a=>a.status==='在用').length],
    ['clock','审批中', all.filter(a=>a.bpm&&a.bpm!=='-'&&a.bpm!=='BPM-已归档').length],
    ['wrench','待检修', all.filter(a=>a.status==='待检修').length]
  ].map(([i,l,v])=>`<div class="kpi"><div class="lab">${shell.ic(i)}${l}</div><div class="val">${v}</div>
    <div class="sub">全生命周期线上化</div></div>`).join('');
  load(); loadBpm();
})();
[fCat,fStatus].forEach(el=>el.addEventListener('change',load));
let kwT; fKw.addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(load,300); });
bType.addEventListener('change',loadBpm);
</script>
</body>
</html>
