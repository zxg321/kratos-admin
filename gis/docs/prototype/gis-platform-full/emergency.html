<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应急指挥 · 管网智能运维一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--border)}
.tabs .tab{padding:9px 16px;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tabs .tab:hover{color:var(--text)}
.tabs .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabpane{display:none}.tabpane.on{display:block;animation:reveal .35s var(--ease)}
.chat-bubble{max-width:92%;padding:10px 14px;border-radius:12px;font-size:13px}
.chat-ai{background:var(--primary-soft);border:1px solid rgba(47,184,201,.3);border-top-left-radius:4px}
.chat-me{background:var(--surface-3);margin-left:auto;border-top-right-radius:4px}
</style>
</head>
<body data-page="emergency">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>应急指挥</b> / S5 接报→研判→派单→处置→物资→报告→值班→预案→演练</div>
    <div class="spacer"></div>
    <span class="tag d pulse"><i></i>进行中事故 2</span>
    <span class="tag s"><i></i>值班在岗 3 人</span>
  </header>

  <div class="grid g-4 page-block reveal" id="kpis"></div>

  <div class="panel page-block reveal">
    <div class="tabs">
      <div class="tab on" data-tab="acc">事故接报与派单</div>
      <div class="tab" data-tab="res">资源与值班</div>
      <div class="tab" data-tab="plan">预案·演练·AI 问答</div>
    </div>

    <!-- Tab1 事故与派单 -->
    <div class="tabpane on" id="pane-acc">
      <div class="toolbar">
        <select class="select" id="aLevel" style="width:120px">
          <option value="all">全部等级</option><option>Ⅰ级</option><option>Ⅱ级</option><option>Ⅲ级</option></select>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="aKw" placeholder="事故号 / 标题"></div>
        <div class="grow"></div>
        <button class="btn btn-primary" id="btnAcc">事故接报</button>
      </div>
      <div class="tbl-wrap"><table class="tbl" id="accTbl">
        <thead><tr><th>事故号</th><th>标题</th><th>等级</th><th>来源</th><th>接报时间</th>
          <th>位置</th><th>状态</th><th>闭环链路</th><th style="width:90px">操作</th></tr></thead>
        <tbody></tbody></table></div>
    </div>

    <!-- Tab2 资源与值班 -->
    <div class="tabpane" id="pane-res">
      <div class="grid g-2" style="padding:16px">
        <div>
          <div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px">应急物资</b>
            <span class="code faint" style="margin-left:auto">安全库存预警</span></div>
          <div class="tbl-wrap" style="margin-top:10px"><table class="tbl" id="matTbl">
            <thead><tr><th>编号</th><th>名称</th><th>规格</th><th>仓库</th><th class="num">库存</th><th>状态</th><th style="width:70px">操作</th></tr></thead>
            <tbody></tbody></table></div>
        </div>
        <div>
          <b style="font-size:13px">值班排班</b>
          <div class="tbl-wrap" style="margin-top:10px"><table class="tbl" id="dutyTbl">
            <thead><tr><th>日期</th><th>班次</th><th>带班</th><th>成员</th><th>状态</th></tr></thead>
            <tbody></tbody></table></div>
          <div class="divider"></div>
          <b style="font-size:13px">协调单位</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <span class="tag g">市政 110 联动</span><span class="tag g">120 急救</span>
            <span class="tag g">交警支队</span><span class="tag g">消防支队</span></div>
        </div>
      </div>
    </div>

    <!-- Tab3 预案演练 + AI -->
    <div class="tabpane" id="pane-plan">
      <div class="grid g-2-1" style="padding:16px">
        <div>
          <b style="font-size:13px">应急预案库</b>
          <div class="grid g-3" style="margin-top:10px" id="planCards"></div>
          <div class="divider"></div>
          <b style="font-size:13px">演练管理</b>
          <div class="tbl-wrap" style="margin-top:10px"><table class="tbl" id="drillTbl">
            <thead><tr><th>演练号</th><th>关联预案</th><th>名称</th><th>日期</th><th>组织</th><th>状态</th><th class="num">评分</th></tr></thead>
            <tbody></tbody></table></div>
        </div>
        <div class="panel ai-panel">
          <div class="card-head"><h3>预案 RAG 智能问答</h3><span class="sub">数字预案 · 一线速查</span></div>
          <div class="card-body" id="ragBox" style="min-height:260px;display:flex;flex-direction:column;gap:10px">
            <div class="chat-bubble chat-ai">您好，我是预案知识助手。可询问如「DN300 爆管怎么处置」「燃气泄漏预案要点」。</div>
          </div>
          <div style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)">
            <input class="input" id="ragQ" placeholder="输入问题…">
            <button class="btn btn-primary" id="ragBtn">提问</button></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('emergency'); shell.mount();
const lvTag = l => l==='Ⅰ级'?shell.tag('d',l,true):l==='Ⅱ级'?shell.tag('a',l):shell.tag('w',l);
const stTag = s => s==='已完成'?shell.tag('s',s):s.includes('派单')||s.includes('筹备')?shell.tag('a',s,true):shell.tag('p',s);

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); document.getElementById('pane-'+t.dataset.tab).classList.add('on');
}));

async function loadAcc(){
  const r = await api.emergency.accidentPage({level:aLevel.value, keyword:aKw.value.trim()});
  document.querySelector('#accTbl tbody').innerHTML = r.list.length ? r.list.map(a=>`
    <tr><td class="code clickable" data-no="${shell.esc(a.accident_no)}"><b>${shell.esc(a.accident_no)}</b></td>
      <td>${shell.esc(a.title)}</td><td>${lvTag(a.level)}</td><td>${shell.tag('g',a.source)}</td>
      <td class="code faint">${shell.esc(a.report_time)}</td><td class="faint">${shell.esc(a.location)}</td>
      <td>${stTag(a.status)}</td><td class="code faint">${shell.esc(a.closed_loop)}</td>
      <td><div class="row-tools"><button class="btn btn-sm btn-primary" data-dp="${shell.esc(a.accident_no)}">派单</button></div></td></tr>`).join('')
    : `<tr><td colspan="9">${shell.emptyHtml('未命中筛选条件')}</td></tr>`;
  document.querySelectorAll('[data-dp]').forEach(b=>b.addEventListener('click',()=>openDispatch(b.dataset.dp)));
  document.querySelectorAll('[data-no]').forEach(b=>b.addEventListener('click',()=>openDispatch(b.dataset.no)));
}
async function openDispatch(accidentNo){
  const r = await api.emergency.rescuePage({accident:accidentNo});
  const d = shell.openDrawer({title:`指挥派单 · ${accidentNo}`, bodyHtml:
    `<b style="font-size:13px">抢险工单（${r.list.length}）</b>`+
    (r.list.length?r.list.map(o=>`
      <div class="panel" style="padding:12px;margin-top:10px">
        <div style="display:flex;align-items:center;gap:8px"><b class="code">${shell.esc(o.order_no)}</b>
          <span class="tag ${o.status==='已领取'||o.status==='处置中'?'p':'w'}" style="margin-left:auto"><i></i>${o.status}</span></div>
        <dl class="desc-list" style="margin-top:8px"><dt>队伍</dt><dd>${shell.esc(o.team)} / ${shell.esc(o.leader)}</dd>
          <dt>车辆</dt><dd>${shell.esc(o.vehicle)}</dd><dt>派单</dt><dd class="code">${shell.esc(o.assign_time)}</dd>
          <dt>ETA</dt><dd class="code">${shell.esc(o.eta)}</dd></dl>
        ${o.status==='待领取'?`<button class="btn btn-sm btn-primary" style="margin-top:8px" data-take="${o.order_no}">催办/领取</button>`:''}
      </div>`).join(''):'<div class="empty" style="padding:24px">暂无抢险工单</div>')+
    `<div class="faint code" style="margin-top:10px">智能派单依据：位置就近 + 队伍负荷 + 车辆状态</div>`,
    footerHtml:`<button class="btn btn-sm btn-primary" data-add>新增派单</button>`});
  d.querySelectorAll('[data-take]').forEach(b=>b.addEventListener('click',()=>shell.toast(`已通知队伍领取 ${b.dataset.take}`,'ok')));
  d.querySelector('[data-add]').addEventListener('click',()=>{
    shell.openModal({title:'新增抢险派单 · '+accidentNo, size:520, bodyHtml:
      `<div class="form-grid">
        <div class="field"><label>抢险队伍</label><select class="select"><option>抢修1班</option><option>抢修2班</option><option>应急供水组</option><option>通风组</option></select></div>
        <div class="field"><label>车辆</label><select class="select"><option>应急抢险车-01</option><option>应急供水车-02</option><option>工程车-03</option></select></div>
      </div>`, okText:'派发', onOk: async ()=>{ await api.emergency.rescueCreate();
        shell.toast('抢险工单已派发，同步移动端','ok'); openDispatch(accidentNo); loadAcc(); }})});
}
btnAcc.addEventListener('click',()=>shell.openModal({title:'事故接报登记', size:560, bodyHtml:
  `<div class="form-grid">
    <div class="field full"><label>事故标题</label><input class="input" placeholder="如：城西供水区疑似爆管"></div>
    <div class="field"><label>级别研判</label><select class="select"><option>Ⅰ级（重大）</option><option>Ⅱ级（较大）</option><option>Ⅲ级（一般）</option></select></div>
    <div class="field"><label>来源</label><select class="select"><option>移动端上报</option><option>值守巡检</option><option>监测告警联动</option><option>外部来电</option></select></div>
    <div class="field full"><label>位置</label><input class="input" placeholder="道路 / 桩号"></div>
    <div class="field full"><label>初报描述</label><textarea class="textarea" placeholder="现场情况、影响范围、已采取措施"></textarea></div>
  </div>`, okText:'接报并进入研判', onOk: async ()=>{ await api.emergency.accidentCreate();
    shell.toast('接报登记完成，进入研判','ok'); loadAcc(); }}));

async function loadRes(){
  const m = await api.emergency.materialPage();
  document.querySelector('#matTbl tbody').innerHTML = m.list.map(x=>`
    <tr><td class="code">${shell.esc(x.mat_no)}</td><td>${shell.esc(x.name)}</td><td>${shell.esc(x.spec)}</td>
      <td>${shell.esc(x.store)}</td><td class="num"><b class="metric">${x.stock}</b><small class="faint"> ${x.unit}</small></td>
      <td>${x.state==='正常'?shell.tag('s','正常'):shell.tag('d','低于安全库存')}</td>
      <td><div class="row-tools"><button class="btn btn-sm" data-rc="${shell.esc(x.mat_no)}">领用</button></div></td></tr>`).join('');
  document.querySelectorAll('[data-rc]').forEach(b=>b.addEventListener('click',()=>{
    shell.openModal({title:'物资领用 · '+b.dataset.rc, size:440, bodyHtml:
      `<div class="field"><label>领用数量</label><input class="input" type="number" value="1"></div>
       <div class="field" style="margin-top:10px"><label>关联工单</label><input class="input" value="QX-2026-0033"></div>`,
      okText:'确认领用', onOk: async ()=>{ await api.emergency.materialReceive(); shell.toast('物资领用登记完成','ok'); }});}) );
  const du = await api.emergency.dutyPage();
  document.querySelector('#dutyTbl tbody').innerHTML = du.list.map(x=>`
    <tr><td>${shell.esc(x.date)}</td><td>${shell.esc(x.shift)}</td><td>${shell.esc(x.leader)}</td>
      <td class="faint">${shell.esc(x.members)}</td><td>${x.status==='在岗'?shell.tag('s','在岗',true):shell.tag('g','待值班')}</td></tr>`).join('');
}
async function loadPlans(){
  const p = await api.emergency.planPage();
  document.getElementById('planCards').innerHTML = p.list.map(x=>`
    <div class="panel" style="padding:14px">
      <b style="font-size:13px;display:block">${shell.esc(x.name)}</b>
      <div class="code faint" style="margin:6px 0">${shell.esc(x.plan_no)} · ${shell.esc(x.version)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${lvTag(x.level)}${shell.tag('s',x.status)}
        <span class="tag g">演练 ${x.drill_count} 次</span></div>
    </div>`).join('');
  const dr = await api.emergency.drillPage();
  document.querySelector('#drillTbl tbody').innerHTML = dr.list.map(x=>`
    <tr><td class="code">${shell.esc(x.drill_no)}</td><td class="code faint">${shell.esc(x.plan)}</td>
      <td>${shell.esc(x.name)}</td><td>${shell.esc(x.date)}</td><td class="faint">${shell.esc(x.org)}</td>
      <td>${stTag(x.status)}</td><td class="num">${x.score?`<b class="metric">${x.score}</b>`:'—'}</td></tr>`).join('');
}
ragBtn.addEventListener('click',async ()=>{
  const q = ragQ.value.trim(); if(!q) return;
  document.getElementById('ragBox').insertAdjacentHTML('beforeend',`<div class="chat-bubble chat-me">${shell.esc(q)}</div>`);
  ragQ.value=''; ragBtn.disabled=true;
  const r = await api.emergency.planRag();
  document.getElementById('ragBox').insertAdjacentHTML('beforeend',
    `<div class="chat-bubble chat-ai">${shell.esc(r.answer)}<div class="code faint" style="margin-top:6px">引用：${r.refs.map(shell.esc).join(' · ')}</div></div>`);
  ragBtn.disabled=false;
  document.getElementById('ragBox').scrollTop = 1e6;
});
(async () => {
  const acc = (await api.emergency.accidentPage({})).list;
  const mat = (await api.emergency.materialPage()).list;
  document.getElementById('kpis').innerHTML = [
    ['siren','进行中事故', acc.filter(a=>a.status!=='已完成').length],
    ['truck','执行中抢险单', 3, 'ETA 最快 22:15'],
    ['package','物资告急', mat.filter(x=>x.state!=='正常').length, '低于安全库存'],
    ['shield','响应达标率', '98.6%', '目标 ≥95%']
  ].map(([i,l,v,sub])=>`<div class="kpi ${i==='siren'&&v>0?'danger':i==='package'&&v>0?'warn':''}">
    <div class="lab">${shell.ic(i)}${l}</div><div class="val">${v}</div><div class="sub">${sub||'应急全生命周期'}</div></div>`).join('');
  loadAcc(); loadRes(); loadPlans();
})();
aLevel.addEventListener('change',loadAcc);
let kwT; aKw.addEventListener('input',()=>{ clearTimeout(kwT); kwT=setTimeout(loadAcc,300); });
</script>
</body>
</html>
