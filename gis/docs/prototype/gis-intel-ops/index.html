<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管网智能运维一体化平台 · 产品原型</title>
<style>
:root{
  --bg:#0b0f1a; --bg2:#0e1524; --surface:#141c30; --surface2:#1a2438;
  --border:#233150; --border2:#2e3f66; --text:#e8edf6; --text-sub:#9aa7c3; --text-faint:#5d6b8a;
  --primary:#3b82f6; --primary-d:#2563eb; --success:#22c55e; --warn:#f59e0b; --alert:#ef4444; --info:#06b6d4;
  --r-xs:6px; --r-md:10px; --r-lg:14px; --sh-sm:0 2px 8px rgba(0,0,0,.28); --sh-lg:0 12px 40px rgba(0,0,0,.45);
  --mono:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--mono);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
/* ---- Sidebar ---- */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0 14px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:18px 6px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--info));display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;box-shadow:var(--sh-sm)}
.brand .t b{display:block;font-size:15px;letter-spacing:.5px}
.brand .t span{font-size:11px;color:var(--text-faint)}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px}
.nav .grp{font-size:11px;color:var(--text-faint);padding:14px 10px 6px;letter-spacing:1px}
.nav .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text-sub);transition:.15s;border:1px solid transparent}
.nav .item:hover{background:var(--surface);color:var(--text)}
.nav .item.active{background:linear-gradient(90deg,rgba(59,130,246,.18),transparent);color:#fff;border-color:var(--border2)}
.nav .item .ic{width:16px;height:16px;flex:none}
.nav .item .b{flex:1}
.nav .badge{font-size:11px;background:var(--alert);color:#fff;border-radius:20px;padding:1px 7px;font-weight:700}
.nav .item .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.side-foot{margin-top:10px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.side-foot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:grid;place-items:center;font-size:12px;font-weight:700}
.side-foot .m b{display:block;font-size:12px}
.side-foot .m span{font-size:11px;color:var(--text-faint)}
/* ---- Main ---- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(20,28,48,.4);backdrop-filter:blur(6px);flex:none}
.topbar .crumb{font-weight:700;font-size:15px;white-space:nowrap}
.topbar .crumb span{color:var(--text-sub);font-weight:400;margin-left:6px;font-size:12px}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.search input{background:none;border:none;outline:none;color:var(--text);flex:1;font-size:13px}
.search svg{width:15px;height:15px;color:var(--text-faint)}
.topbar .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--text-sub);cursor:pointer}
.pill .st{width:8px;height:8px;border-radius:50%;background:var(--success)}
.pill .st.warn{background:var(--warn)}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:hover{color:var(--text);border-color:var(--border2)}
.iconbtn svg{width:16px;height:16px}
.content{flex:1;overflow-y:auto;padding:20px 22px 40px}
.section{display:none}
.section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---- Cards & grid ---- */
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.cols-4{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(2,1fr)}.cols-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:14px;font-weight:700}
.card-head .sub{font-size:12px;color:var(--text-faint)}
.card-body{padding:18px}
/* KPI */
.kpi{display:flex;align-items:center;gap:14px;padding:18px}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .v b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.kpi .v span{font-size:12px;color:var(--text-sub)}
.kpi .trend{font-size:11px;margin-top:4px;display:flex;gap:6px;align-items:center}
.up{color:var(--success)}.down{color:var(--alert)}
/* Table */
.tbl-wrap{overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 14px;color:var(--text-faint);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface2)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.tag.b{background:rgba(59,130,246,.15);color:#60a5fa}
.tag.g{background:rgba(34,197,94,.14);color:#4ade80}
.tag.o{background:rgba(245,158,11,.15);color:#fbbf24}
.tag.r{background:rgba(239,68,68,.15);color:#f87171}
.tag.c{background:rgba(6,182,212,.14);color:#22d3ee}
.tag.pu{background:rgba(139,92,246,.15);color:#a78bfa}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;background:var(--surface2);color:var(--text);border:1px solid var(--border2);transition:.15s}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-d)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.3)}
.btn svg{width:14px;height:14px}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.input,.select{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-size:13px;outline:none}
.input:focus,.select:focus{border-color:var(--primary)}
.select option{background:var(--surface)}
.spacer{flex:1}
.divider{height:1px;background:var(--border);margin:14px 0}
.muted{color:var(--text-sub)} .faint{color:var(--text-faint)} .small{font-size:12px}
/* status bar / legend */
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12px;color:var(--text-sub)}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
/* SVG map */
.map-box{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border)}
.map-box svg{display:block;width:100%;height:auto;background:#0a1020}
.map-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px}
.map-tag{position:absolute;top:12px;left:12px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--sh-sm)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text-sub)}
.chip.on{background:rgba(59,130,246,.16);color:#60a5fa;border-color:rgba(59,130,246,.4)}
/* timeline / flow */
.flow{display:flex;align-items:center;gap:0}
.flow .st{flex:1;text-align:center;position:relative}
.flow .st .ci{width:30px;height:30px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--border2);font-weight:700;font-size:12px}
.flow .st.done .ci{background:rgba(34,197,94,.16);border-color:var(--success);color:#4ade80}
.flow .st.now .ci{background:var(--primary);border-color:var(--primary-d);color:#fff}
.flow .st .cl{font-size:11px;margin-top:6px;color:var(--text-sub)}
.flow .ln{height:2px;flex:none;width:36px;background:var(--border2)}
.flow .ln.done{background:var(--success)}
/* mini bar chart */
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bcol .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--primary),rgba(59,130,246,.35));transition:.3s}
.bcol span{font-size:11px;color:var(--text-faint)}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0}
.hbar .l{width:90px;font-size:12px;color:var(--text-sub)}
.hbar .track{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;border-radius:5px}
.hbar .v{width:44px;font-size:12px;font-weight:600;text-align:right}
/* toggle theme */
body[data-theme="light"]{--bg:#eef2f8;--bg2:#e7edf6;--surface:#fff;--surface2:#f4f7fc;--border:#d9e2ef;--border2:#c6d3e6;--text:#17233f;--text-sub:#5b6b8c;--text-faint:#8b98b5}
/* generic */
.row{display:flex;gap:16px;align-items:center}
.fs12{font-size:12px}.fs11{font-size:11px}.fs16{font-size:16px}.fs22{font-size:22px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}
.p8{padding:8px}.p12{padding:12px}
.alert-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.alert-row:last-child{border-bottom:none}
.alert-row .lvl{width:6px;height:6px;border-radius:50%;flex:none}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">网</div>
      <div class="t"><b>管网智能运维平台</b><span>Infrastructure Intel Ops</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">运营中枢</div>
      <div class="item active" data-sec="overview"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><b class="b">态势总览</b><span class="dot"></span></div>
      <div class="item" data-sec="gis"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3l-6 9 6 9M15 3l6 9-6 9M12 3l-3 9 3 9"/></svg><b class="b">管网一张图</b></div>
      <div class="item" data-sec="monitor"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20V10M12 6V4M4 12h2M18 12h2M6 6l1.5 1.5M18 6l-1.5 1.5"/><circle cx="12" cy="12" r="3.5"/></svg><b class="b">智能监测告警</b><span class="badge">8</span></div>
      <div class="item" data-sec="collect"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M12 14v3M3 12h3M14 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/><circle cx="12" cy="12" r="3"/></svg><b class="b">采集作业与成果</b></div>
      <div class="grp">作业协同</div>
      <div class="item" data-sec="patrol"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M7 6V4M17 6V4M5 10h4v4H5zM15 10h4v4h-4z"/><path d="M5 18h14M5 14v4M19 14v4"/></svg><b class="b">巡检作业</b></div>
      <div class="item" data-sec="dispatch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3L4 7v6c0 4.4 3.4 7.5 8 8 4.6-.5 8-3.6 8-8V7l-8-4z"/><path d="M9 12l2 2 4-4"/></svg><b class="b">应急指挥调度</b></div>
      <div class="item" data-sec="asset"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="6" rx="1"/><path d="M4 10v6h4v4h8v-4h4v-6"/><path d="M12 8v3"/></svg><b class="b">设备资产全生命周期</b></div>
      <div class="grp">支撑</div>
      <div class="item" data-sec="system"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.6 2h-3.4L10 6.1a7 7 0 00-1.7 1L6 6l-2 3.4 2 1.5A7 7 0 005 12l.2 1-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1L11.2 22h3.4L16 17.9a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.6 0-.9z"/></svg><b class="b">系统与数据管理</b></div>
    </nav>
    <div class="side-foot">
      <div class="av">张</div>
      <div class="m"><b>张运维</b><span>荣昌区燃气 · 管理员</span></div>
      <div class="spacer"></div>
      <button class="iconbtn spin" title="实时连接" id="connDot" style="background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#4ade80">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9l5 5 5-5"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="crumb">管网智能运维一体化平台 <span id="crumbSub">态势总览</span></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="搜索覆盖物 / 设备 / 工单 / 档案 ..." oninput="searchNav(this.value)"></div>
      <div class="tools">
        <div class="pill"><span class="st warn"></span>MQTT 在线 · 3 Broker</div>
        <button class="iconbtn" title="通知" onclick="toast('暂无新通知')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg></button>
        <button class="iconbtn" title="切换主题" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </header>

    <div class="content" id="content">
      <!-- ================= 态势总览 ================= -->
      <section class="section active" id="sec-overview"></section>
      <!-- ================= 管网一张图 ================= -->
      <section class="section" id="sec-gis"></section>
      <!-- ================= 智能监测告警 ================= -->
      <section class="section" id="sec-monitor"></section>
      <!-- ================= 采集作业 ================= -->
      <section class="section" id="sec-collect"></section>
      <!-- ================= 巡检作业 ================= -->
      <section class="section" id="sec-patrol"></section>
      <!-- ================= 应急指挥调度 ================= -->
      <section class="section" id="sec-dispatch"></section>
      <!-- ================= 设备资产 ================= -->
      <section class="section" id="sec-asset"></section>
      <!-- ================= 系统管理 ================= -->
      <section class="section" id="sec-system"></section>
    </div>
  </main>
</div>

<script>
const IC = {
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/>',
  warn:'<path d="M10.3 3.9 1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  flow:'<path d="M3 6h18"/><path d="M7 3v6"/><circle cx="21" cy="6" r="2"/>',
  grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  gauge:'<circle cx="12" cy="13" r="7"/><path d="M12 13l4-3M12 6V4"/>',
  tools:'<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.8-3.8a4 4 0 01-5.3 5.3l-7.9 7.9a2 2 0 01-2.8-2.8l7.9-7.9a4 4 0 015.3-5.3l-3.8 3.8z"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M12 3l9 18H3L12 3z"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  car:'<rect x="3" y="11" width="18" height="6" rx="2"/><path d="M5 13h14l-1.5-5h-11L5 13z"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/>',
  doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6M9 15h6M9 11h6"/>',
  camera:'<path d="M3 7h3l2-2h8l2 2h3v12H3V7z"/><circle cx="12" cy="13" r="3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const icon = n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${IC[n]||''}</svg>`;

let active='overview';
const crumb = {'overview':'态势总览','gis':'管网一张图','monitor':'智能监测告警','collect':'采集作业与成果','patrol':'巡检作业','dispatch':'应急指挥调度','asset':'设备资产全生命周期','system':'系统与数据管理'};

function buildSections(){
  document.getElementById('sec-overview').innerHTML = overviewHTML();
  document.getElementById('sec-gis').innerHTML = gisHTML();
  document.getElementById('sec-monitor').innerHTML = monitorHTML();
  document.getElementById('sec-collect').innerHTML = collectHTML();
  document.getElementById('sec-patrol').innerHTML = patrolHTML();
  document.getElementById('sec-dispatch').innerHTML = dispatchHTML();
  document.getElementById('sec-asset').innerHTML = assetHTML();
  document.getElementById('sec-system').innerHTML = systemHTML();
}

/* ================= 数据 ================= */
const meters = [
  {id:'L-2026-0331',name:'中干道压力计',type:'压力仪表',zone:'回填区 · 中干道',val:'0.42MPa',st:'正常',tag:'g'},
  {id:'F-2026-0118',name:'酒苑路流量计',type:'流量仪表',zone:'城区 · 酒苑路',val:'218.5 m³/h',st:'正常',tag:'g'},
  {id:'P-2026-0007',name:'滨江大道压力计',type:'压力仪表',zone:'滨江 · 大道',val:'1.86MPa',st:'超压',tag:'r'},
  {id:'L-2026-0092',name:'监测井 LEL',type:'甲烷监测',zone:'学校片区 · 井2',val:'8.2%LEL',st:'预警',tag:'o'},
  {id:'M-2026-0045',name:'泵站流量计',type:'流量仪表',zone:'城北泵站',val:'—',st:'离线',tag:'c'}

/* ================= 交互 ================= */
document.querySelectorAll('#nav .item').forEach(el=>{
  el.addEventListener('click',()=>go(el.dataset.sec));
});
function go(sec){
  document.querySelectorAll('#nav .item').forEach(n=>n.classList.toggle('active',n.dataset.sec===sec));
  document.querySelectorAll('#content .section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+sec));
  active=sec; document.getElementById('crumbSub').textContent=crumb[sec];
}
function searchNav(q){
  const items=[...document.querySelectorAll('#nav .item')];
  if(!q){items.forEach(i=>i.style.display='');return;}
  items.forEach(i=>{ i.style.display=i.textContent.includes(q)?'':'none'; });
}
function toggleTheme(){const b=document.body.dataset.theme;document.body.dataset.theme=b==='dark'?'light':'dark';}
let tl;
function toast(msg){const o=document.getElementById('toast');if(!o){const d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#141c30;border:1px solid #2e3f66;padding:11px 18px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:999;font-size:13px';document.body.appendChild(d);tl=document.getElementById('toast');}tl.textContent='✓ '+msg;tl.style.transition='opacity .3s';tl.style.opacity='1';clearTimeout(tl._t);tl._t=setTimeout(()=>tl.style.opacity='0',1800);}
