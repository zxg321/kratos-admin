<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMA 计量漏损 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.dma-tabs .tabs{margin-bottom:0}
.tab-pane{display:none}.tab-pane.on{display:block}
.rank-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank-bar .rb-name{width:120px;font-size:12px;color:var(--text-sub);text-align:right}
.rank-bar .rb-track{flex:1;height:18px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.rank-bar .rb-fill{height:100%;border-radius:6px;background:var(--primary)}
.rank-bar .rb-val{width:56px;font-family:var(--sfont);font-size:13px}
.step-result{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-top:14px}
.mnf-cmp{display:flex;gap:14px;margin:14px 0}
.mnf-cmp .mc{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center}
.mnf-cmp .mc b{font-family:var(--sfont);font-size:26px;display:block}
.mnf-cmp .mc span{font-size:12px;color:var(--text-sub)}
</style>
</head>
<body data-page="dma">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>DMA 计量漏损</b> / GIS 域 · 分区计量与漏损控制<div class="fid">覆盖 F-M01~M06</div></div>
    <div class="spacer"></div>
    <span id="mediaSlot"></span>
    <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
    <span class="tag p"><i></i>演示数据</span>
    <span class="tag s"><i></i>系统在线</span>
  </header>

  <div class="grid g-4" style="margin-top:16px">
    <div class="kpi media"><div class="lab">分区数</div><div class="val metric">34</div><div class="sub">一级 / 二级</div></div>
    <div class="kpi danger"><div class="lab">综合漏损率</div><div class="val metric">8.62<small>%</small></div><div class="sub down">基线 9%</div></div>
    <div class="kpi"><div class="lab">夜最小流量</div><div class="val metric">32.6<small>m³/h</small></div><div class="sub">MNF</div></div>
    <div class="kpi media"><div class="lab">日节水量预估</div><div class="val metric" id="kpiSave">344<small>m³/日</small></div><div class="sub">模拟分析</div></div>
  </div>

  <div class="panel dma-tabs reveal" style="margin-top:16px">
    <div class="tabs">
      <button class="on" data-tab="zone">分区管理</button>
      <button data-tab="six">六步法向导</button>
      <button data-tab="diag">输差诊断</button>
      <button data-tab="sim">模拟分析</button>
    </div>

    <!-- 分区管理 -->
    <div class="tab-pane on" data-pane="zone">
      <div class="toolbar">
        <select class="select" id="zLevel" style="width:140px"><option value="all">全部级别</option><option value="一级">一级</option><option value="二级">二级</option></select>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="zKw" placeholder="分区名称"></div>
        <div class="grow"></div>
        <button class="btn btn-sm btn-primary" id="zPdf">生成分区报告</button>
      </div>
      <div class="grid g-2" style="padding:16px">
        <div class="tbl-wrap"><table class="tbl" id="zTable"><thead><tr>
          <th>分区</th><th>父分区</th><th class="num">供应量</th><th class="num">销售量</th><th class="num">漏损率</th><th class="num">表计</th>
        </tr></thead><tbody></tbody></table></div>
        <div><div class="card-head" style="border:0;padding:0 0 8px"><h3 style="font-size:14px">漏损率排名</h3></div><div id="zRank"></div></div>
      </div>
    </div>

    <!-- 六步法向导 -->
    <div class="tab-pane" data-pane="six">
      <div class="card-body">
        <div class="step-tabs" id="sixTabs"></div>
        <div class="step-result" id="sixResult"><span class="faint">点击上方步骤查看该步结果与下一步操作。</span></div>
      </div>
    </div>

    <!-- 输差诊断 -->
    <div class="tab-pane" data-pane="diag">
      <div class="toolbar">
        <div class="grow"></div>
        <button class="btn btn-primary btn-sm" id="diagRun">运行输差诊断</button>
      </div>
      <div class="card-body" id="diagResult">
        <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>点击「运行输差诊断」<br>基于双判据评估产销差</span></div>
      </div>
    </div>

    <!-- 模拟分析 -->
    <div class="tab-pane" data-pane="sim">
      <div class="card-body" id="simResult">
        <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>加载模拟分析…</span></div>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('dma');
shell.mount();
shell.mountMediaSwitch();

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('[data-pane]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); document.querySelector(`[data-pane="${b.dataset.tab}"]`).classList.add('on');
  if(b.dataset.tab==='six') renderSix();
  if(b.dataset.tab==='sim') renderSim();
}));

/* ===== 分区管理 ===== */
async function renderZones(){
  const level=document.getElementById('zLevel').value, keyword=document.getElementById('zKw').value;
  const {list}=await api.dma.zonePage({level,keyword});
  document.querySelector('#zTable tbody').innerHTML = list.map(z=>`
    <tr>
      <td>${shell.esc(z.name)}</td>
      <td class="faint">${z.parent}</td>
      <td class="num">${z.supply.toLocaleString()}</td>
      <td class="num">${z.sale.toLocaleString()}</td>
      <td class="num">${z.loss>9?shell.tag('d',z.loss+'%'):`<span class="metric">${z.loss}%</span>`}</td>
      <td class="num">${z.meters}</td>
    </tr>`).join('') || `<tr><td colspan="6">${shell.emptyHtml('无匹配分区')}</td></tr>`;
  const max=Math.max(...list.map(z=>z.loss),10);
  document.getElementById('zRank').innerHTML = list.map(z=>`
    <div class="rank-bar"><div class="rb-name">${shell.esc(z.name)}</div>
      <div class="rb-track"><div class="rb-fill" style="width:${(z.loss/max*100).toFixed(0)}%;background:${z.loss>9?'var(--danger)':'var(--primary)'}"></div></div>
      <div class="rb-val" style="color:${z.loss>9?'var(--danger)':'var(--text)'}">${z.loss}%</div></div>`).join('');
}
['zLevel','zKw'].forEach(id=>document.getElementById(id).addEventListener('input',renderZones));
document.getElementById('zKw').addEventListener('keydown',e=>{if(e.key==='Enter')renderZones();});
renderZones();
document.getElementById('zPdf').addEventListener('click',async()=>{ const r=await api.dma.report({}); shell.toast('已生成 '+r.file,'ok'); });

/* ===== 六步法向导 ===== */
let sixSteps=[];
async function renderSix(){
  if(!sixSteps.length) sixSteps = (await api.dma.sixStep()).list || (await api.dma.sixStep());
  const st = sixSteps.list || sixSteps;
  document.getElementById('sixTabs').innerHTML = st.map((s,i)=>`
    <div class="st ${s.status==='done'?'done':s.status==='current'?'on':''}" data-step="${s.step}">
      <span class="no">${s.step}</span><span>${s.name}</span></div>${i<st.length-1?'<span class="ln"></span>':''}`).join('');
  document.querySelectorAll('#sixTabs .st').forEach(el=>el.addEventListener('click',()=>{
    const s=st.find(x=>x.step==el.dataset.step);
    const cls=s.status==='done'?'done':s.status==='current'?'on':'todo';
    document.getElementById('sixResult').innerHTML =
      `<div style="display:flex;align-items:center;gap:10px"><span class="tag ${cls==='done'?'s':cls==='on'?'p':'g'}"><i></i>步骤 ${s.step} · ${s.name}</span><span class="tag ${cls==='done'?'s':cls==='on'?'a':'g'}"><i></i>${s.status==='done'?'已完成':s.status==='current'?'进行中':'待执行'}</span></div>
       <p style="margin:12px 0;font-size:13px">${shell.esc(s.result)}</p>
       ${(+s.step<st.length)?`<button class="btn btn-sm btn-primary" id="sixNext" data-next="${+s.step+1}">下一步 →</button>`:`<span class="tag s"><i></i>已是最后一步</span>`}`;
    document.getElementById('sixNext')?.addEventListener('click',()=>{
      document.querySelector(`#sixTabs .st[data-step="${document.getElementById('sixNext').dataset.next}"]`)?.click();
    });
  }));
  document.querySelector('#sixTabs .st')?.click();
}

/* ===== 输差诊断 ===== */
document.getElementById('diagRun').addEventListener('click',async()=>{
  const r=await api.dma.diagnose({});
  document.getElementById('diagResult').innerHTML =
    `<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag d"><i></i>${r.verdict}</span><span class="tag p"><i></i>${r.zone}</span></div>
     <dl class="desc-list"><dt>输差</dt><dd class="metric" style="font-size:18px;color:var(--danger)">${r.diff}</dd></dl>
     <div class="divider"></div><div class="faint" style="font-size:12px;margin-bottom:6px">双判据</div>
     <div class="timeline">
       <div class="tl warn"><b>阈值判据</b><br>${shell.esc(r.judge[0])}</div>
       <div class="tl warn"><b>趋势判据</b><br>${shell.esc(r.judge[1])}</div>
       <div class="tl done"><b>处置建议</b><br>${shell.esc(r.advice)}</div>
     </div>`;
  shell.toast('输差诊断完成：'+r.verdict,'ok');
});

/* ===== 模拟分析 ===== */
async function renderSim(){
  const r=await api.dma.simulate({});
  document.getElementById('kpiSave').innerHTML = `${r.save_daily.replace(/ .*/,'')}<small>m³/日</small>`;
  const max=Math.max(r.mnf,r.forecast);
  document.getElementById('simResult').innerHTML =
    `<div class="mnf-cmp">
      <div class="mc"><b class="metric" style="color:var(--alert)">${r.mnf}</b><span>现状 MNF (m³/h)</span>
        <div class="progress" style="margin-top:8px"><i class="w" style="width:${(r.mnf/max*100).toFixed(0)}%"></i></div></div>
      <div class="mc"><b class="metric" style="color:var(--success)">${r.forecast}</b><span>预测 MNF (m³/h)</span>
        <div class="progress" style="margin-top:8px"><i class="s" style="width:${(r.forecast/max*100).toFixed(0)}%"></i></div></div>
    </div>
    <div class="grid g-2">
      <div class="kpi media"><div class="lab">日节水量</div><div class="val metric">${r.save_daily}</div></div>
      <div class="kpi"><div class="lab">年节水收益</div><div class="val metric">${r.save_year}</div></div>
    </div>
    <button class="btn btn-sm btn-primary" style="margin-top:14px" id="simPdf">生成 PDF 报告</button>`;
  document.getElementById('simPdf').addEventListener('click',async()=>{ const p=await api.dma.report({}); shell.toast('已生成 '+p.file,'ok'); });
}
renderSim();
</script>
</body>
</html>
