<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开放平台 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.sso-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.sso-card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface-2);padding:18px}
.sso-card .sc-t{font-weight:600;font-size:15px}
.sso-card .sc-type{font-family:var(--mfont);font-size:12px;color:var(--primary);margin:4px 0}
.sso-card .sc-note{font-size:12px;color:var(--text-sub);margin-top:8px}
.key-box{font-family:var(--mfont);font-size:13px;background:var(--surface-2);border:1px dashed var(--border-strong);
  border-radius:var(--r-md);padding:10px 12px;color:var(--primary);word-break:break-all}
</style>
</head>
<body data-page="openapi">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
<header class="topbar">
  <div class="crumb"><b>开放平台</b> / 第三方集成<span class="fid">覆盖 F-S18 / S19</span></div>
  <div class="spacer"></div>
  <span id="mediaSlot"></span>
  <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
  <span class="tag p"><i></i>演示数据</span>
  <span class="tag s"><i></i>系统在线</span>
</header>

<div class="grid g-4 page-block" id="kpiRow"></div>

<section class="panel page-block">
  <div class="tabs" id="tabs">
    <button class="on" data-tab="app">开放应用</button>
    <button data-tab="log">调用日志</button>
    <button data-tab="sso">SSO 适配</button>
  </div>
  <div id="tabBody"></div>
</section>
</main>

<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('openapi'); shell.mount(); shell.mountMediaSwitch();
const nfmt = n => Number(n).toLocaleString('en-US');
const tabs=document.getElementById('tabs'), body=document.getElementById('tabBody');
let APPS=[];

api('open.appPage').then(d=>{ APPS=d.list;
  document.getElementById('kpiRow').innerHTML=[
    {lab:'接入应用',ic:'link',val:APPS.length,unit:'个',cls:'media'},
    {lab:'今日调用',ic:'activity',val:'1,204',unit:'次'},
    {lab:'拒绝率',ic:'alert-triangle',val:'0.8',unit:'%',cls:'warn'},
    {lab:'SSO 适配器',ic:'key',val:'2',unit:'个'}
  ].map(x=>`<div class="kpi ${x.cls||''}"><div class="lab">${shell.ic(x.ic)} ${x.lab}</div>
    <div class="val metric">${x.val}<small>${x.unit}</small></div></div>`).join('');
  renderApp();
});

tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  ({app:renderApp,log:renderLog,sso:renderSso})[b.dataset.tab]();});

/* ---------- 开放应用 ---------- */
function renderApp(){
  const scopeOpts=['push_zy','push_zy.pipe_bim','workorder.create','workorder.callback','device.readonly','device.list','alarm.subscribe'];
  const scopeTags=s=>s.split('/').map(x=>`<span class="tag g"><i></i>${x.trim()}</span>`).join(' ');
  body.innerHTML=`<div class="tab-note">${shell.ic('shield')} 签名鉴权：请求头 <span class="code">X-SNOP-Sign = HMAC-SHA256(secret, timestamp+nonce)</span> + <b>时间戳防重放</b>（±5min）。</div>
    <div class="toolbar"><div class="search"><span data-ic></span><input class="input" id="aKw" placeholder="应用名 / AppID" style="padding-left:32px;width:220px"></div>
      <div class="grow"></div><button class="btn btn-primary" id="aNew">${shell.ic('plus')}新建应用</button></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>AppID</th><th>名称</th><th>scope（operation 白名单）</th><th>IP 白名单</th><th>状态</th><th>创建时间</th><th></th></tr></thead>
    <tbody id="aBody"></tbody></table></div>`;
  document.querySelector('[data-ic]').innerHTML=shell.ic('search');
  const load=()=>{const kw=document.getElementById('aKw').value.trim();
    const list=APPS.filter(x=>!kw||(x.app+x.name).includes(kw));
    document.getElementById('aBody').innerHTML=list.map(x=>`
      <tr><td class="code">${x.app}</td><td><b>${x.name}</b></td><td>${scopeTags(x.scope)}</td>
      <td class="code muted">${x.ips}</td><td>${x.status==='启用'?'<span class="tag s"><i></i>启用</span>':'<span class="tag d"><i></i>停用</span>'}</td>
      <td class="code muted">${x.created}</td>
      <td><div class="row-tools"><button class="btn btn-sm" data-act="key" data-a="${x.app}">重置密钥</button><button class="btn btn-sm btn-danger" data-act="off" data-a="${x.name}">停用</button></div></td></tr>`).join('')||`<tr><td colspan="7">${shell.emptyHtml('无匹配应用')}</td></tr>`;};
  document.getElementById('aKw').oninput=load;
  body.querySelector('#aBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.act==='key') resetKey(b.dataset.a);
    else shell.toast('应用已停用：'+b.dataset.a,'err');};
  document.getElementById('aNew').onclick=()=>shell.openModal({title:'新建开放应用',size:560,bodyHtml:`
    <div class="form-grid">
      <div class="field full"><label>应用名称</label><input class="input" id="naN" placeholder="如：市智慧城管对接"></div>
      <div class="field full"><label>scope（operation 白名单）</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${scopeOpts.map(o=>`<label class="checkbox"><input type="checkbox" value="${o}"> <span class="code">${o}</span></label>`).join('')}</div></div>
      <div class="field full"><label>IP 白名单段</label><input class="input" id="naIp" placeholder="如：10.20.1.0/24，多个逗号分隔"></div>
    </div>`,okText:'创建并签发密钥',onOk:()=>{
      const name=document.getElementById('naN').value.trim();
      api('open.appCreate',{}).then(r=>shell.toast('应用已创建：'+r.app_id+'（'+name+'）','ok'));
    }});
  load();
}
function resetKey(app){
  api('open.regenerateKey',{}).then(r=>{
    shell.openModal({title:'重置应用密钥 · '+app,size:480,bodyHtml:`
      <p class="muted" style="font-size:12px">请妥善保存，密钥仅展示一次：</p>
      <div class="key-box" id="kB">${r.secret}</div>`,okText:'复制并关闭',footer:false,
      onOk:()=>{ try{navigator.clipboard&&navigator.clipboard.writeText(r.secret);}catch(e){}
        shell.toast('新密钥已复制：'+r.secret.slice(0,12)+'…','ok');}});
  });
}

/* ---------- 调用日志 ---------- */
function renderLog(){
  const appOpt='<option value="all">全部应用</option>'+APPS.map(a=>`<option>${a.app}</option>`).join('');
  body.innerHTML=`<div class="toolbar"><select class="select" id="lApp" style="width:180px">${appOpt}</select>
    <div class="search"><span data-ic></span><input class="input" id="lKw" placeholder="op / IP" style="padding-left:32px;width:220px"></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>应用</th><th>operation</th><th>IP</th><th>耗时</th><th>状态码</th><th>时间</th></tr></thead>
    <tbody id="lBody"></tbody></table></div>`;
  document.querySelector('[data-ic]').innerHTML=shell.ic('search');
  const load=()=>api('open.logPage',{app:document.getElementById('lApp').value}).then(d=>{
    const kw=document.getElementById('lKw').value.trim();
    const list=d.list.filter(x=>!kw||(x.op+x.ip).includes(kw));
    document.getElementById('lBody').innerHTML=list.map(x=>`
      <tr><td class="code">${x.app}</td><td class="code">${x.op}</td><td class="code muted">${x.ip}</td>
      <td class="num">${x.ms}<small> ms</small></td>
      <td>${x.code===200?'<span class="tag s"><i></i>200</span>':'<span class="tag d"><i></i>401</span>'}</td>
      <td class="code muted">${x.ts}</td></tr>`).join('')||`<tr><td colspan="6">${shell.emptyHtml('无调用日志')}</td></tr>`;
  });
  document.getElementById('lApp').onchange=load; document.getElementById('lKw').oninput=load; load();
}

/* ---------- SSO 适配 ---------- */
function renderSso(){
  body.innerHTML=`<div class="tab-note">${shell.ic('git-merge')} 协议适配器化：CAS / OAuth2 等以<b>适配器</b>形式挂载，新增协议只需实现统一 Adaptor 接口，不影响业务登录链路。</div>
    <div class="sso-cards" id="sBox"></div>`;
  api('open.ssoPage').then(d=>{ document.getElementById('sBox').innerHTML=d.list.map(x=>`
    <div class="sso-card"><div class="sc-t">${x.name}</div><div class="sc-type">${x.type}</div>
      <div>${x.state==='已配置'?'<span class="tag s"><i></i>已配置</span>':x.state==='适配器就绪'?'<span class="tag p"><i></i>适配器就绪</span>':'<span class="tag g"><i></i>'+x.state+'</span>'}</div>
      <div class="sc-note">${x.note}</div></div>`).join('');
  });
}
</script>
</body>
</html>
