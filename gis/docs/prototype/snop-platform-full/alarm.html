<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报警管理 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="alarm">
  <aside class="app-nav" id="app-nav"></aside>
  <main class="app-content">
    <header class="topbar">
      <div class="crumb"><b>报警管理</b> / 感知域<span class="fid">覆盖 F-L01~L06</span></div>
      <div class="spacer"></div>
      <span id="mediaSlot"></span>
      <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
      <span class="tag p"><i></i>演示数据</span>
      <span class="tag s"><i></i>系统在线</span>
    </header>

    <section class="grid g-4" style="margin-top:16px">
      <div class="kpi danger reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg> 未处理</div>
        <div class="val metric">27</div>
        <div class="sub down">待认领 / 处理中</div>
      </div>
      <div class="kpi danger reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> I 级告警</div>
        <div class="val metric">2</div>
        <div class="sub">需立即处置</div>
      </div>
      <div class="kpi warn reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> 今日新增</div>
        <div class="val metric">8</div>
        <div class="sub">较昨日 -2</div>
      </div>
      <div class="kpi reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 平均响应</div>
        <div class="val metric">12<small>min</small></div>
        <div class="sub up">↑ SLA 达标</div>
      </div>
    </section>

    <div class="panel page-block">
      <div class="tabs" id="tabs">
        <button class="on" data-tab="live">实时告警</button>
        <button data-tab="rule">规则引擎</button>
        <button data-tab="analyze">多维分析</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </main>

  <script src="assets/icons.js"></script>
  <script src="assets/components.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script>
  const shell = new Shell('alarm'); shell.mount(); shell.mountMediaSwitch();
  (function(){
    const tabBody=document.getElementById('tabBody');
    let tab='live';
    const st={ level:'all', status:'all', media:shell.media(), keyword:'' };

    function spark(pts,w=260,h=44,c='var(--primary)'){
      const min=Math.min(...pts),max=Math.max(...pts),rg=(max-min)||1,step=w/(pts.length-1);
      const p=pts.map((v,i)=>(i*step).toFixed(1)+','+(h-((v-min)/rg)*h).toFixed(1)).join(' ');
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${p}"/></svg>`;
    }
    function barChart(data,color='var(--primary)'){
      const W=600,H=220,pad=30,n=data.length,pw=(W-pad*2)/n,max=Math.max(...data.map(d=>d[1]))||1;
      const bars=data.map((d,i)=>{const bh=(d[1]/max)*(H-pad*2),x=pad+i*pw+6,y=H-pad-bh;
        return `<rect x="${x}" y="${y}" width="${Math.max(pw-12,2)}" height="${bh}" rx="3" fill="${color}"/><text x="${x+(pw-12)/2}" y="${y-6}" fill="var(--text-sub)" font-size="12" text-anchor="middle" font-family="var(--mfont)">${d[1]}</text><text x="${x+(pw-12)/2}" y="${H-8}" fill="var(--text-sub)" font-size="12" text-anchor="middle">${d[0]}</text>`;}).join('');
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--surface-2);border-radius:10px">${bars}</svg>`;
    }
    function donut(data){
      const entries=Object.entries(data),total=entries.reduce((a,[,v])=>a+v,0);
      const cx=90,cy=90,r=64,sw=24;let ang=-90;
      const colors=['var(--danger)','var(--alert)','var(--warn)'];
      const arc=(a0,a1)=>{const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const[x0,y0]=p(a0),[x1,y1]=p(a1);const large=(a1-a0)>180?1:0;return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
      const arcs=entries.map(([,v],i)=>{const a2=ang+(v/total)*360,path=arc(ang,a2);ang=a2;return `<path d="${path}" fill="none" stroke="${colors[i]}" stroke-width="${sw}"/>`;}).join('');
      const legend=entries.map(([k,v],i)=>`<span class="li"><span class="sw" style="background:${colors[i]}"></span>${k} 级 ${v}</span>`).join('');
      return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="180" height="180">${arcs}<text x="90" y="86" text-anchor="middle" fill="var(--text)" font-size="22" font-family="var(--sfont)">${total}</text><text x="90" y="106" text-anchor="middle" fill="var(--text-sub)" font-size="11">告警合计</text></svg><div class="legend" style="flex-direction:column;align-items:flex-start">${legend}</div></div>`;
    }
    function levelTag(l){return l==='I'?`<span class="tag d"><i></i>I 级</span>`:l==='II'?`<span class="tag a"><i></i>II 级</span>`:`<span class="tag w"><i></i>III 级</span>`;}
    function aStatusTag(s){const m={unhandled:['d','未处理'],claimed:['w','已认领'],processing:['a','处理中'],closed:['s','已关闭']};return `<span class="tag ${m[s][0]}"><i></i>${m[s][1]}</span>`;}

    /* 实时告警 */
    function liveTpl(){
      return `<div class="toolbar">
        <select class="select filter" data-f="level" style="width:110px">
          <option value="all">全部级别</option><option value="I">I 级</option><option value="II">II 级</option><option value="III">III 级</option></select>
        <select class="select filter" data-f="status" style="width:120px">
          <option value="all">全部状态</option><option value="unhandled">未处理</option><option value="claimed">已认领</option>
          <option value="processing">处理中</option><option value="closed">已关闭</option></select>
        <select class="select filter" data-f="media" style="width:110px">
          <option value="water">供水（本租户）</option></select>
        <div class="grow"></div>
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" data-f="keyword" placeholder="编号 / 设备搜索"></div>
        <span class="tag p pulse"><i></i>实时聚合</span>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>级别</th><th>编号</th><th>设备</th><th>指标</th><th class="num">实测值</th><th>阈值</th><th>状态</th><th>时间</th><th>操作</th>
      </tr></thead><tbody id="alarmRows"></tbody></table></div>`;
    }
    async function renderLive(){
      const d=await api('alarm.page',{level:st.level,status:st.status,media:st.media,keyword:st.keyword});
      const msel=document.querySelector('.filter[data-f="media"]');   /* D7 单租户口径 */
      if(msel){ st.media = shell.media(); shell.tenantMediaSelect(msel); }
      const tb=document.getElementById('alarmRows'); if(!tb) return;
      if(!d.list.length){ tb.innerHTML=`<tr><td colspan="9">${shell.emptyHtml('暂无告警')}</td></tr>`; return; }
      window.__alarms=d.list;
      tb.innerHTML=d.list.map(x=>`<tr>
        <td>${levelTag(x.level)}</td><td class="code">${x.code}</td><td class="code">${x.device}</td><td>${x.metric}</td>
        <td class="num metric">${x.value}</td><td>${x.threshold}</td><td>${aStatusTag(x.status)}</td><td class="code">${x.ts}</td>
        <td><div class="row-tools">
          <button class="btn btn-sm" data-adetail="${x.id}">${shell.ic('eye')} 详情</button>
          <button class="btn btn-sm btn-warn" data-claim="${x.id}">${shell.ic('check')} 认领</button>
          <button class="btn btn-sm btn-primary" data-handle="${x.id}">${shell.ic('send')} 转工单</button>
          <button class="btn btn-sm btn-danger" data-closea="${x.id}">${shell.ic('x')} 关闭</button>
        </div></td></tr>`).join('');
    }
    async function openAlarm(id){
      const x=await api('alarm.get',{id});
      const tl=`<div class="timeline">
        <div class="tl danger"><b>告警触发</b><span class="code">${x.ts}</span><div>${x.metric} ${x.value} 越过阈值 ${x.threshold}</div></div>
        <div class="tl"><b>规则引擎聚合</b><span class="code">F-L02</span><div>匹配规则 ${x.type}，定级 ${x.level} 级</div></div>
        <div class="tl warn"><b>SSE 推送</b><span class="code">${x.ts}</span><div>已推送值班台 / 大屏 / 移动端</div></div>
        <div class="tl ${x.status==='closed'?'done':''}"><b>处置中</b><span class="code">待办</span><div>${x.status==='closed'?'已闭环':'等待认领与处理'}</div></div></div>`;
      shell.openDrawer({title:'告警详情 · '+x.code,
        bodyHtml:`<dl class="desc-list">
          <dt>设备</dt><dd class="code">${x.device}</dd><dt>指标</dt><dd>${x.metric}</dd>
          <dt>实测值</dt><dd class="metric">${x.value}</dd><dt>阈值</dt><dd>${x.threshold}</dd>
          <dt>级别</dt><dd>${levelTag(x.level)}</dd><dt>状态</dt><dd>${aStatusTag(x.status)}</dd>
          <dt>介质</dt><dd>${x.media}</dd><dt>时间</dt><dd class="code">${x.ts}</dd></dl>
          <h3 style="font-size:14px;margin:14px 0 8px">处置时间线 ${shell.ic('history')}</h3>${tl}`});
    }

    /* 规则引擎 */
    function ruleTpl(){
      return `<div class="toolbar"><div class="grow"></div>
        <button class="btn btn-primary" data-newrule>${shell.ic('plus')} 新建规则</button></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr>
          <th>指标</th><th>条件</th><th>阈值</th><th>持续时长</th><th>介质</th><th>启用</th>
        </tr></thead><tbody id="ruleRows"></tbody></table></div>`;
    }
    async function renderRule(){
      const d=await api('alarm.rulePage'); const tb=document.getElementById('ruleRows'); if(!tb) return;
      window.__rules=d.list;
      tb.innerHTML=d.list.map(x=>`<tr>
        <td>${x.metric}</td><td>${x.op}</td><td class="metric">${x.threshold}</td><td>${x.duration}</td><td>${x.media}</td>
        <td><label class="checkbox"><input type="checkbox" ${x.enabled?'checked':''} data-ruleon="${x.id}"><span></span></label></td></tr>`).join('');
    }

    /* 多维分析 */
    async function renderAnalyze(){
      const d=await api('alarm.stats');
      const byType=Object.entries(d.byType).map(([k,v])=>[k,v]);
      const trend=d.trend||[14,11,17,9,12,15,8];
      tabBody.innerHTML=`<div class="card-body">
        <div class="grid g-2">
          <div class="panel" style="border:1px solid var(--border)"><div class="card-head"><h3>按类型分布 ${shell.ic('bar-chart')}</h3></div>
            <div class="card-body flush" style="padding:14px">${barChart(byType,'var(--primary)')}</div></div>
          <div class="panel" style="border:1px solid var(--border)"><div class="card-head"><h3>按等级分布 ${shell.ic('pie-chart')}</h3></div>
            <div class="card-body flush" style="padding:14px">${donut(d.byLevel)}</div></div>
        </div>
        <div class="panel" style="border:1px solid var(--border);margin-top:16px"><div class="card-head"><h3>7 日告警趋势 ${shell.ic('trending-up')}</h3></div>
          <div class="card-body flush" style="padding:14px">${spark(trend,1080,70,'var(--alert)')}</div></div>
        <div class="card-body flush" style="background:var(--surface-2);border-radius:10px;padding:16px;margin-top:16px">
          <h3 style="font-size:14px;margin:0 0 8px">视频告警分析 ${shell.ic('video')} <span class="tag g">F-L06 · P2 预留</span></h3>
          <p style="margin:0;color:var(--text-sub);font-size:13px;line-height:1.8">
            AI 视频识别通道（爆管/冒汽/施工占道）告警经视频中台接入，与设备告警在规则引擎中联合研判。
            当前为 P2 预留能力位，待视频中台对接后开放「视频取证回放 / 帧级标注 / 误报自学习」。</p>
        </div>
      </div>`;
    }

    async function render(){
      if(tab==='live'){ tabBody.innerHTML=liveTpl(); await renderLive(); }
      else if(tab==='rule'){ tabBody.innerHTML=ruleTpl(); await renderRule(); }
      else if(tab==='analyze'){ await renderAnalyze(); }
    }

    document.getElementById('tabs').addEventListener('click',e=>{
      const b=e.target.closest('[data-tab]'); if(!b) return;
      tab=b.dataset.tab; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); render();
    });
    tabBody.addEventListener('click',async e=>{
      const ad=e.target.closest('[data-adetail]'); if(ad){ openAlarm(+ad.dataset.adetail); return; }
      const cl=e.target.closest('[data-claim]'); if(cl){ const r=await api('alarm.claim',{id:+cl.dataset.claim}); shell.toast('告警已认领，进入处理中','ok'); renderLive(); return; }
      const hd=e.target.closest('[data-handle]'); if(hd){
        shell.openModal({title:'处理并转工单 · #'+hd.dataset.handle,size:520,
          bodyHtml:`<div class="form-grid">
            <div class="field full"><label>处置说明</label><textarea class="textarea" placeholder="描述现场处置措施…"></textarea></div>
            <div class="field"><label>指派处置人</label><select class="select"><option>赵抢险</option><option>陈巡检</option><option>周安检</option></select></div>
            <div class="field"><label>工单类型</label><select class="select"><option>抢险工单</option><option>巡检工单</option><option>维修工单</option></select></div></div>`,
          onOk:()=>{ api('alarm.handle',{id:+hd.dataset.handle}).then(r=>shell.toast('已生成工单 '+r.order_no+'（演示）','ok')); renderLive(); }});
        return;
      }
      const ca=e.target.closest('[data-closea]'); if(ca){ const r=await api('alarm.close',{id:+ca.dataset.closea}); shell.toast('告警已关闭并归档','ok'); renderLive(); return; }
      const nr=e.target.closest('[data-newrule]'); if(nr){
        shell.openModal({title:'新建告警规则',size:520,
          bodyHtml:`<div class="form-grid">
            <div class="field"><label>指标</label><select class="select" data-rf="metric"><option>管道压力</option><option>瞬时流量</option><option>甲烷浓度</option><option>供水温度</option></select></div>
            <div class="field"><label>运算符</label><select class="select" data-rf="op"><option>低于</option><option>高于</option><option>等于</option></select></div>
            <div class="field"><label>阈值</label><input class="input" data-rf="thr" placeholder="如 0.15 MPa"></div>
            <div class="field"><label>持续时长</label><select class="select" data-rf="dur"><option>≥1 min</option><option>≥3 min</option><option>≥5 min</option></select></div>
            <div class="field full"><label>介质</label><select class="select" data-rf="media"><option value="water">供水</option><option value="gas">燃气</option><option value="heat">热力</option></select></div></div>`,
          onOk:(m)=>{ const g=sel=>m.querySelector('[data-rf='+sel+']').value; api('alarm.ruleSave',{metric:g('metric'),op:g('op'),threshold:g('thr'),duration:g('dur'),media:g('media')}).then(()=>{ shell.toast('规则已保存并启用（演示）','ok'); renderRule(); }); }});
        return;
      }
      const on=e.target.closest('[data-ruleon]'); if(on){ shell.toast('规则 '+(on.checked?'已启用':'已停用')+'（演示）','ok'); return; }
    });
    tabBody.addEventListener('input',e=>{
      const s=e.target.closest('.filter'); if(s){ st[s.dataset.f]=e.target.value; if(tab==='live') renderLive(); }
    });
    document.addEventListener('mediachange',e=>{ st.media=(e && e.detail) || shell.media(); render(); });
    render();
  })();
  </script>
</body>
</html>
