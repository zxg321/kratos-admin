<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营工作台 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface-2);transition:.15s var(--ease);text-decoration:none;color:var(--text);position:relative;overflow:hidden}
.mod:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px)}
.mod-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.mod-ic svg{width:18px;height:18px}
.mod-name{font-size:14px;font-weight:600}
.mod-desc{font-size:12px;color:var(--text-sub)}
.mod-cnt{position:absolute;top:12px;right:14px;font-size:18px;color:var(--primary)}
.media-cards{display:grid;grid-template-columns:1fr;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-2);border-left:3px solid var(--mc);transition:.15s var(--ease)}
.mcard.on{background:color-mix(in srgb,var(--mc) 12%,var(--surface));box-shadow:0 0 0 1px var(--mc)}
.mcard .mc-name{font-weight:600;color:var(--mc)}
.mcard .mc-stats{margin-left:auto;display:flex;gap:16px;text-align:right}
.mcard .mc-stats b{font-family:var(--sfont);font-size:16px;display:block}
.mcard .mc-stats span{font-size:11px;color:var(--text-sub)}
.avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--sfont);font-size:20px;
  color:#06151c;background:linear-gradient(135deg,var(--primary),#19a0b4);flex:none}
.welcome{display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:linear-gradient(135deg,var(--primary-soft),transparent);border:1px solid var(--border);border-radius:var(--r-lg)}
.todo-row{cursor:pointer}
</style>
</head>
<body data-page="dashboard">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
<header class="topbar">
  <div class="crumb"><b>运营工作台</b> / Portal 工作台<span class="fid">覆盖 F-V03/V04</span></div>
  <div class="spacer"></div>
  <span id="mediaSlot"></span>
  <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
  <span class="tag p"><i></i>演示数据</span>
  <span class="tag s"><i></i>系统在线</span>
</header>

<!-- 欢迎条 -->
<div class="welcome page-block">
  <div class="avatar">张</div>
  <div>
    <div style="font-size:15px">下午好，<b>张监测</b></div>
    <div class="muted" style="font-size:12px"><span id="welcomeTenant">江南水司</span> · 运营值班 · client_type = <span class="code">portal</span> · 登录角色 <span class="tag p" style="height:18px;padding:0 7px"><i></i>监测值班员</span></div>
  </div>
  <div class="spacer" style="flex:1"></div>
  <div class="muted code" id="welcomeDate"></div>
  <span class="tag s"><i></i>班次 夜班 20:00-08:00</span>
</div>

<!-- KPI 行 -->
<div class="grid g-4 page-block" id="kpiRow"></div>

<!-- 三栏 -->
<div class="grid page-block" style="grid-template-columns:360px 1fr 360px;align-items:start">
  <!-- 左 -->
  <div class="col-left" style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <div class="card-head"><h3>7 日告警趋势</h3><span class="sub" id="trendSub"></span></div>
      <div class="card-body" id="trendBox"></div>
    </section>
    <section class="panel">
      <div class="card-head"><h3>本租户介质</h3><span class="sub">D7 介质=租户类别标识 · 单租户口径</span></div>
      <div class="card-body"><div class="media-cards" id="mediaCards"></div></div>
    </section>
  </div>
  <!-- 中 -->
  <div class="col-mid">
    <section class="panel">
      <div class="card-head">
        <h3>业务模块宫格</h3><span class="sub">点击进入对应子系统</span>
        <div class="tools">
          <div class="search"><span id="modSearchIc"></span><input class="input" id="modSearch" placeholder="搜索模块…" style="padding-left:32px;width:160px"></div>
          <button class="btn btn-sm" id="blockCfg">积木配置</button>
        </div>
      </div>
      <div class="card-body"><div class="mod-grid" id="modGrid"></div></div>
    </section>
  </div>
  <!-- 右 -->
  <div class="col-right" style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <div class="card-head"><h3>待办中心</h3><span class="sub" id="todoSub"></span></div>
      <div class="tbl-wrap"><table class="tbl" id="todoTbl"><thead>
        <tr><th>标题</th><th>来源</th><th>级别</th><th>时间</th><th></th></tr></thead>
        <tbody id="todoBody"></tbody></table></div>
    </section>
    <section class="panel">
      <div class="card-head"><h3>事件闭环</h3><span class="sub">SSE 实时推送</span></div>
      <div class="card-body"><div class="timeline" id="eventLoop"></div></div>
    </section>
  </div>
</div>
</main>

<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('dashboard'); shell.mount(); shell.mountMediaSwitch();
/* D7：介质 = 租户类别标识，欢迎条租户名跟随当前演示租户 */
(function(){ const el = document.getElementById('welcomeTenant');
  if(el) el.textContent = shell.tenantName(); })();
const MOD_IC = {map:'map',analysis:'crosshair',dma:'target',device:'gauge',iot:'radio',alarm:'bell',patrol:'clipboard-list',cnd:'siren',eam:'package'};
const MEDIA_META = {gas:{label:'燃气',color:'#F59E0B'},water:{label:'供水',color:'#2FB8C9'},heat:{label:'热力',color:'#FB923C'}};
const nfmt = n => Number(n).toLocaleString('en-US');
const LV_TAG = {d:['d','紧急'],w:['w','警告'],a:['a','动作'],p:['p','建议'],s:['s','完成'],'':['g','普通']};

(function init(){
  document.getElementById('modSearchIc').innerHTML = shell.ic('search');
  let SUMMARY = null;
  api('dashboard.summary').then(d=>{
    SUMMARY = d;
    document.getElementById('welcomeDate').textContent = (d.date||'')+' · 数据截至 22:05';
    MODULES = d.modules; renderModules('');
    renderTrend(d.alarmTrend7d);
    renderAll();
    document.getElementById('todoSub').textContent = '共 '+d.todos.length+' 项';
    document.getElementById('todoBody').innerHTML = d.todos.map(t=>{
      const lv = LV_TAG[t.level]||LV_TAG[''];
      return `<tr class="todo-row" data-id="${t.id}" data-title="${shell.esc(t.title)}">
        <td>${shell.esc(t.title)}</td><td class="muted">${shell.esc(t.src)}</td>
        <td>${t.level?`<span class="tag ${lv[0]}"><i></i>${lv[1]}</span>`:'<span class="tag g"><i></i>普通</span>'}</td>
        <td class="code muted">${t.time}</td>
        <td><div class="row-tools"><button class="btn btn-sm btn-primary" data-act="handle">处理</button></div></td>
      </tr>`;}).join('');
    document.getElementById('eventLoop').innerHTML = d.eventLoop.map(e=>{
      const lv = LV_TAG[e.lv]||LV_TAG[''];
      return `<div class="tl ${lv[0]==='d'?'danger':lv[0]==='w'?'warn':(lv[0]==='s'||lv[0]==='p')?'done':''}">
        <b>${e.txt}</b><span class="code">${e.t}</span></div>`;}).join('');
  });

  /* D7 单租户口径：KPI / 介质卡均取当前租户介质，绝不跨介质合计 */
  function renderAll(){
    if(!SUMMARY) return;
    const key = shell.media(), mi = MEDIA_META[key];
    const k = (SUMMARY.mediaKpis && SUMMARY.mediaKpis[key]) || SUMMARY.kpis;
    document.getElementById('kpiRow').innerHTML = [
      {lab:'管线总长',ic:'map-pin',val:k.pipe_km,unit:'km',cls:'media'},
      {lab:'设备总数',ic:'cpu',val:nfmt(k.devices),unit:'台'},
      {lab:'未处理告警',ic:'bell',val:k.alarms_open,unit:'条',cls:'danger'},
      {lab:'今日巡检',ic:'clipboard-list',val:k.patrol_done+'/'+k.patrol_today,unit:'项'},
      {lab:'DMA 漏损率',ic:'target',val:k.dma_loss,unit:'%',cls:'warn'},
      {lab:'设备在线率',ic:'wifi',val:(k.online_rate*100).toFixed(1),unit:'%',sub:'↑ 较昨日 +0.3%'},
      {lab:'未结工单',ic:'file-text',val:k.workorder_open,unit:'单'},
      {lab:'IoT 速率',ic:'activity',val:k.iot_qps,unit:'msg/s',cls:'media'}
    ].map(x=>`
      <div class="kpi ${x.cls||''}">
        <div class="lab">${shell.ic(x.ic)} ${x.lab}</div>
        <div class="val metric">${x.val}<small>${x.unit}</small></div>
        ${x.sub?`<div class="sub up">${x.sub}</div>`:''}
      </div>`).join('');
    document.getElementById('mediaCards').innerHTML = `
      <div class="mcard on" style="--mc:${mi.color}">
        <span class="mc-name">${mi.label}（${shell.tenantName()}）</span>
        <div class="mc-stats">
          <div><b class="metric">${k.pipe_km}</b><span>管线 km</span></div>
          <div><b class="metric">${nfmt(k.devices)}</b><span>设备</span></div>
          <div><b class="metric">${k.alarms_open}</b><span>告警</span></div>
        </div>
      </div>
      <p class="muted" style="font-size:11.5px;margin:10px 0 0;line-height:1.6">
        D7 介质 = 租户类别标识：本租户仅呈现 <b style="color:var(--media)">${mi.label}</b> 口径数据，跨介质数据不做合计。</p>`;
    document.getElementById('welcomeTenant').textContent = shell.tenantName();
  }

  /* 租户切换 → 全量重渲染（KPI / 介质卡 / 租户名） */
  document.addEventListener('mediachange', renderAll);

  function renderTrend(data){
    const w=320,h=96,pad=10, max=Math.max(...data),min=Math.min(...data),rng=(max-min)||1;
    const step=(w-pad*2)/(data.length-1);
    const xy=data.map((v,i)=>[pad+i*step, h-pad-((v-min)/rng)*(h-pad*2)]);
    const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=line+` L${w-pad} ${h-pad} L${pad} ${h-pad} Z`;
    document.getElementById('trendBox').innerHTML =
      `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--media)" stop-opacity=".35"/>
          <stop offset="1" stop-color="var(--media)" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#lg)"/>
        <path d="${line}" fill="none" stroke="var(--media)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--media)"/>`).join('')}
      </svg>
      <div class="legend" style="margin-top:8px"><span class="li">峰值 <b class="metric">${max}</b></span><span class="li">均值 <b class="metric">${(data.reduce((a,b)=>a+b,0)/data.length).toFixed(1)}</b></span><span class="li">近 7 日告警</span></div>`;
    document.getElementById('trendSub').textContent = '单位：条';
  }

  function renderMediaCards(mb){ /* 已废弃：D7 单租户口径，介质卡改由 renderAll() 渲染当前租户单一介质 */
    void mb;
  }

  let MODULES=[];
  function renderModules(kw){
    const list = MODULES.filter(m=>!kw || (m.name+m.desc).includes(kw));
    document.getElementById('modGrid').innerHTML = list.length? list.map(m=>`
      <a class="mod" href="${m.key}.html" title="进入 ${shell.esc(m.name)}">
        <span class="mod-ic">${shell.ic(MOD_IC[m.key]||'box')}</span>
        <span class="mod-name">${shell.esc(m.name)}</span>
        <span class="mod-desc">${shell.esc(m.desc)}</span>
        <span class="mod-cnt metric">${shell.esc(m.cnt)}</span>
      </a>`).join('') : shell.emptyHtml('无匹配模块');
  }
  document.getElementById('modSearch').addEventListener('input', e=>renderModules(e.target.value.trim()));

  // 积木配置（F-V04）
  document.getElementById('blockCfg').addEventListener('click', ()=>{
    const widgets=[['kpi','KPI 驾驶舱','已启用'],['trend','7 日告警趋势','已启用'],['media','本租户介质卡','已启用'],
      ['todo','待办中心','已启用'],['loop','事件闭环','已启用'],['mod','模块宫格','已启用'],['weather','气象联动','停用'],['news','行业资讯','停用']];
    const body = `<div class="desc-list" style="grid-template-columns:1fr auto;align-items:center">
      ${widgets.map(w=>`<div style="display:flex;gap:8px;align-items:center">${shell.ic('layout-dashboard')}<span>${w[0]==='mod'?'模块宫格':w[1]}</span></div>
        <label class="checkbox"><input type="checkbox" ${w[2]==='已启用'?'checked':''}> ${w[2]}</label>`).join('')}
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px">组件市场式开关：portal 工作台卡片可逐块显隐与排序，配置按租户 <span class="code">${shell.tenantName()}</span> 持久化。</p>`;
    shell.openModal({title:'工作台积木配置 · F-V04',size:520,bodyHtml:body,okText:'保存配置',onOk:()=>{
      shell.toast('工作台积木配置已保存（按租户持久化）','ok');
    }});
  });

  // 待办交互
  document.getElementById('todoBody').addEventListener('click', e=>{
    const tr=e.target.closest('tr'); if(!tr) return;
    if(e.target.dataset.act==='handle'){ shell.toast('已派发处理工单：'+tr.dataset.title,'ok'); return; }
    shell.toast('待办详情：'+tr.dataset.title,'info');
  });

  // 租户类别（介质）切换联动高亮：介质 = 租户类别标识（D7）
  document.addEventListener('mediachange', e=>{
    document.querySelectorAll('.mcard').forEach(c=>c.classList.toggle('on', c.dataset.media===e.detail));
  });
})();
</script>
</body>
</html>
