<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巡检作业 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="patrol">
  <aside class="app-nav" id="app-nav"></aside>
  <main class="app-content">
    <header class="topbar">
      <div class="crumb"><b>巡检作业</b> / 作业域 <span class="fid">覆盖 F-P01~P12</span></div><div class="spacer"></div>
      <span id="mediaSlot"></span>
      <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
      <span class="tag p"><i></i>演示数据</span>
      <span class="tag s"><i></i>系统在线</span>
    </header>

    <!-- KPI -->
    <div class="grid g-5 page-block" id="kpiRow"></div>

    <!-- Tabs -->
    <div class="panel page-block">
      <div class="tabs" id="tabs">
        <button class="on" data-tab="plan">巡检计划</button>
        <button data-tab="order">工单</button>
        <button data-tab="danger">隐患闭环</button>
        <button data-tab="track">轨迹回放</button>
        <button data-tab="calib">标定审核</button>
        <button data-tab="excav">开挖监测</button>
        <button data-tab="stats">统计绩效</button>
      </div>
      <div id="tabBody" class="card-body"></div>
    </div>
  </main>
  <script src="assets/icons.js"></script>
  <script src="assets/components.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script>
const shell = new Shell('patrol'); shell.mount(); shell.mountMediaSwitch();

/* ---------- 通用工具 ---------- */
const esc = s => shell.esc(s);
const E = (id) => document.getElementById(id);
function otag(s){
  return ({executing:['p','执行中'],pending:['g','待领取'],paused:['w','暂停'],done:['s','完结']})[s] || ['g',s];
}
function dtag(level){
  return ({'重大':['d','重大'],'一般':['w','一般']})[level] || ['g',level];
}
function dstatusTag(st){
  return ({'整改中':['w','整改中'],'待定级':['g','待定级'],'已闭环':['s','已闭环']})[st] || ['g',st];
}
function kpiCard(lab, val, sub, cls, ic){
  return `<div class="kpi ${cls||''} reveal"><div class="lab">${ic?shell.ic(ic):''}<span>${lab}</span></div>
    <div class="val metric">${val}</div><div class="sub">${sub||''}</div></div>`;
}

/* ---------- KPI（D7：KPI 取本租户介质口径，不跨介质合计） ---------- */
let _sum = null;
async function renderKpi(){
  if(!_sum) _sum = await api('dashboard.summary');
  const k = (_sum.mediaKpis && _sum.mediaKpis[shell.media()]) || _sum.kpis;
  const media = (window.SNOP_MEDIAS||{})[shell.media()] || {label:'', tenant:''};
  const rate = (k.patrol_today ? (k.patrol_done/k.patrol_today*100).toFixed(1) : '0.0');
  E('kpiRow').innerHTML =
    kpiCard('今日工单（'+media.tenant+'）','<span class="metric">'+k.patrol_done+'</span><small>/'+k.patrol_today+'</small>','完成率 '+rate+'%','', 'clipboard-list') +
    kpiCard('在控隐患','<span class="metric">31</span>','本租户 · '+media.label+'口径','warn','alert-triangle') +
    kpiCard('AI 识别准确率','<span class="metric">90.3%</span>','误报下降 2.1pt','media','scan') +
    kpiCard('本月工时','<span class="metric">1284</span><small>h</small>','人均 98h','', 'clock') +
    kpiCard('巡检覆盖率','<span class="metric">98.6%</span>','计划节点 9/9','', 'map-pin');
}

/* ---------- Tab: 巡检计划 ---------- */
function renderPlan(){
  api('patrol.planPage').then(r=>{
    const cards = r.list.map(p=>`
      <div class="panel" style="padding:0">
        <div class="card-body">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <b>${esc(p.name)}</b>${shell.tag('p',p.cycle)}
          </div>
          <div class="desc-list" style="margin:12px 0">
            <dt>区域</dt><dd>${esc(p.area)}</dd>
            <dt>周期</dt><dd>${esc(p.days)}</dd>
            <dt>负责人</dt><dd>${esc(p.owner)}</dd>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="progress" style="flex:1"><i class="${p.progress>=0.9?'s':p.progress>=0.6?'':'w'}" style="width:${(p.progress*100).toFixed(0)}%"></i></div>
            <span class="metric" style="font-size:13px">${(p.progress*100).toFixed(0)}%</span>
          </div>
        </div>
      </div>`).join('');
    E('tabBody').innerHTML = `<div class="grid g-3">${cards}</div>
      <div class="legend" style="margin-top:14px"><span class="li"><span class="sw" style="background:var(--primary)"></span>计划进度</span>
        <span class="li"><span class="sw" style="background:var(--warn)"></span>滞后</span><span class="li"><span class="sw" style="background:var(--success)"></span>达标</span></div>`;
  });
}

/* ---------- Tab: 工单 ---------- */
const orderF = {status:'all',type:'all',keyword:''};
function renderOrder(){
  const toolbar = `<div class="toolbar">
    <span class="search">${shell.ic('search')}<input class="input" id="ofKw" placeholder="工单号/名称/执行人" value="${esc(orderF.keyword)}"></span>
    <select class="select" id="ofStatus" style="width:auto">
      <option value="all">全部状态</option><option value="executing">执行中</option>
      <option value="pending">待领取</option><option value="paused">暂停</option><option value="done">完结</option>
    </select>
    <select class="select" id="ofType" style="width:auto">
      <option value="all">全部类型</option><option value="计划巡检">计划巡检</option>
      <option value="专项巡检">专项巡检</option><option value="处置工单">处置工单</option><option value="抢险配合">抢险配合</option>
    </select>
    <span class="grow"></span>
    <button class="btn btn-primary" id="oNew">${shell.ic('plus')}<span>新增工单</span></button>
  </div>`;
  E('tabBody').innerHTML = toolbar + `<div class="tbl-wrap"><table class="tbl" id="oTbl"></table></div>`;
  E('ofStatus').value = orderF.status; E('ofType').value = orderF.type;
  const reload = ()=>{ orderF.status=E('ofStatus').value; orderF.type=E('ofType').value; orderF.keyword=E('ofKw').value;
    api('patrol.orderPage',orderF).then(r=>{
      E('oTbl').innerHTML = `<thead><tr><th>工单号</th><th>名称</th><th>类型</th><th>执行人</th><th>计划时间</th><th>点位进度</th><th>状态</th><th></th></tr></thead><tbody>`+
        r.list.map(o=>{const [c,t]=otag(o.status);const pct=(o.done/o.points*100).toFixed(0);
          return `<tr><td class="code">${esc(o.order_no)}</td><td>${esc(o.name)}</td>
          <td>${shell.tag('g',o.type)}</td><td>${esc(o.assignee)}</td>
          <td class="code">${esc(o.plan)}</td>
          <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="flex:1"><i class="${pct>=100?'s':pct>=50?'':'w'}" style="width:${pct}%"></i></div><span class="metric" style="font-size:12px">${o.done}/${o.points}</span></div></td>
          <td>${shell.tag(c,t)}</td>
          <td><div class="row-tools"><button class="btn btn-sm" data-detail="${o.id}">${shell.ic('eye')}<span>详情</span></button></div></td></tr>`;}).join('')+`</tbody>`;
      E('oTbl').querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>orderDetail(b.dataset.detail)));
    });};
  ['ofStatus','ofType'].forEach(id=>E(id).addEventListener('change',reload));
  E('ofKw').addEventListener('input',reload);
  E('oNew').addEventListener('click',openOrderModal);
  reload();
}
function orderDetail(id){
  api('patrol.orderPage',{}).then(r=>{const o=r.list.find(x=>x.id==id); if(!o)return;
    const [c,t]=otag(o.status);const pct=(o.done/o.points*100).toFixed(0);
    shell.openDrawer({title:'工单详情 '+o.order_no, bodyHtml:
      `<div class="desc-list">${[['工单名称',o.name],['类型',o.type],['执行人',o.assignee],['计划时间',o.plan],['点位进度',o.done+' / '+o.points],['状态',t]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</div>
       <div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);margin-bottom:6px"><span>点位完成度</span><span class="metric">${pct}%</span></div>
       <div class="progress"><i class="${pct>=100?'s':pct>=50?'':'w'}" style="width:${pct}%"></i></div></div>`});
  });
}
function openOrderModal(){
  shell.openModal({title:'新增巡检工单', size:520, okText:'创建工单', bodyHtml:
    `<div class="form-grid">
      <div class="field full"><label>工单名称</label><input class="input" id="nmName" placeholder="如：江北片区例行巡检"></div>
      <div class="field"><label>类型</label><select class="select" id="nmType"><option>计划巡检</option><option>专项巡检</option><option>处置工单</option><option>抢险配合</option></select></div>
      <div class="field"><label>区域</label><input class="input" id="nmArea" placeholder="如：江北片区"></div>
      <div class="field"><label>执行人</label><input class="input" id="nmAsg" placeholder="如：陈巡检"></div>
      <div class="field"><label>计划日期</label><input class="input" id="nmDate" placeholder="2026-09-16 09:00"></div>
    </div>`,
    onOk:()=>{ const name=E('nmName').value.trim(); if(!name){shell.toast('请填写工单名称','err');return false;}
      api('patrol.orderCreate',{name}).then(res=>{ shell.toast('已创建工单 '+res.order_no,'ok'); renderOrder(); }); }});
}

/* ---------- Tab: 隐患闭环 ---------- */
const dangerF = {level:'all',status:'all'};
function renderDanger(){
  const toolbar = `<div class="toolbar">
    <select class="select" id="dfLevel" style="width:auto"><option value="all">全部等级</option><option value="重大">重大</option><option value="一般">一般</option></select>
    <select class="select" id="dfStatus" style="width:auto"><option value="all">全部状态</option><option value="整改中">整改中</option><option value="待定级">待定级</option><option value="已闭环">已闭环</option></select>
    <span class="grow"></span><span class="muted" style="font-size:12px">定级/复查闭环留痕</span>
  </div>`;
  E('tabBody').innerHTML = toolbar + `<div class="tbl-wrap"><table class="tbl" id="dTbl"></table></div>`;
  const reload = ()=>{ dangerF.level=E('dfLevel').value; dangerF.status=E('dfStatus').value;
    api('patrol.dangerPage',dangerF).then(r=>{
      E('dTbl').innerHTML = `<thead><tr><th>隐患编号</th><th>位置</th><th>等级</th><th>状态</th><th>上报人</th><th>描述</th><th></th></tr></thead><tbody>`+
        r.list.map(d=>{const [c,t]=dtag(d.level);const [sc,st]=dstatusTag(d.status);
        return `<tr><td class="code">${esc(d.code)}</td><td>${esc(d.loc)}</td>
          <td>${shell.tag(c,t)}</td><td>${shell.tag(sc,st)}</td>
          <td>${esc(d.reporter)}</td><td style="max-width:240px;color:var(--text-sub)">${esc(d.desc)}</td>
          <td><div class="row-tools"><button class="btn btn-sm" data-review="${d.id}">${shell.ic('shield')}<span>定级/复查</span></button></div></td></tr>`;}).join('')+`</tbody>`;
      E('dTbl').querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>openReviewModal(b.dataset.review)));
    });};
  E('dfLevel').addEventListener('change',reload); E('dfStatus').addEventListener('change',reload); reload();
}
function openReviewModal(id){
  api('patrol.dangerPage',{}).then(r=>{const d=r.list.find(x=>x.id==id); if(!d)return;
    shell.openModal({title:'隐患定级 / 复查 · '+d.code, size:520, okText:'提交', bodyHtml:
      `<div class="desc-list" style="margin-bottom:14px">${[['位置',d.loc],['当前等级',d.level],['状态',d.status]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</div>
       <div class="form-grid">
        <div class="field"><label>定级</label><select class="select" id="rvLevel"><option>重大</option><option>一般</option></select></div>
        <div class="field"><label>复核结论</label><select class="select" id="rvVerdict"><option>维持整改</option><option>升级整改</option><option>同意闭环</option></select></div>
        <div class="field full"><label>复核说明</label><textarea class="textarea" id="rvNote" placeholder="现场核查结论与整改要求…"></textarea></div>
       </div>`,
      onOk:()=>{ api('patrol.dangerReview',{id, level:E('rvLevel').value, verdict:E('rvVerdict').value}).then(()=>{ shell.toast('隐患 '+d.code+' 复核已提交','ok'); renderDanger(); }); }});
  });
}

/* ---------- Tab: 轨迹回放 ---------- */
let trackSpeed = 1;
function renderTrack(){
  api('patrol.track').then(tr=>{
    const W=680,H=300,pad=36;
    const lats=tr.pts.map(p=>p[0]),lngs=tr.pts.map(p=>p[1]);
    const mnLat=Math.min(...lats),mxLat=Math.max(...lats),mnLng=Math.min(...lngs),mxLng=Math.max(...lngs);
    const sx=l=>pad+((mxLng===mnLng?0.5:(l-mnLng)/(mxLng-mnLng))*(W-pad*2));
    const sy=a=>pad+(1-(mxLat===mnLat?0.5:(a-mnLat)/(mxLat-mnLat)))*(H-pad*2);
    const cs=tr.pts.map(p=>[sx(p[1]),sy(p[0])]);
    const poly=cs.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const dot=(c,fill)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="5" fill="${fill}" stroke="#0B1220" stroke-width="2"/>`;
    const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px">
      <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB8C9"/><stop offset="1" stop-color="#19a0b4"/></linearGradient></defs>
      <polyline points="${poly}" fill="none" stroke="url(#tg)" stroke-width="2.5" stroke-dasharray="${trackSpeed>1?6:0}" stroke-linecap="round" stroke-linejoin="round"/>
      ${cs.slice(1,-1).map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="#5c6f92"/>`).join('')}
      ${dot(cs[0],'#22C55E')}${dot(cs[cs.length-1],'#EF4444')}
      <text x="${cs[0][0]}" y="${cs[0][1]-12}" fill="#22C55E" font-size="11" font-family="JetBrains Mono">起点</text>
      <text x="${cs[cs.length-1][0]}" y="${cs[cs.length-1][1]-12}" fill="#EF4444" font-size="11" font-family="JetBrains Mono">终点</text>
    </svg>`;
    const speeds=[1,2,4,8];
    E('tabBody').innerHTML = `<div class="grid g-4" style="margin-bottom:14px">
      ${kpiCard('巡检人员','<span class="metric" style="font-size:18px">'+esc(tr.staff)+'</span>','日期 '+tr.date,'', 'user')}
      ${kpiCard('巡查里程','<span class="metric">'+tr.km+'</span><small>km</small>','时段 '+tr.span,'media','route')}
      ${kpiCard('打卡点位','<span class="metric">'+tr.points+'</span>','覆盖管线节点','', 'map-pin')}
      ${kpiCard('轨迹点','<span class="metric">'+tr.pts.length+'</span>','GPS 采样','', 'activity')}
    </div>
    ${svg}
    <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
      <span class="muted" style="font-size:12px">回放倍速</span>
      <div class="media-switch" id="spd">${speeds.map(s=>`<button class="${s===trackSpeed?'on':''}" data-spd="${s}">${s}×</button>`).join('')}</div>
      <span class="grow"></span>
      <div class="legend"><span class="li"><span class="sw" style="background:#22C55E"></span>起点</span><span class="li"><span class="sw" style="background:#EF4444"></span>终点</span></div>
    </div>`;
    E('spd').querySelectorAll('[data-spd]').forEach(b=>b.addEventListener('click',()=>{ trackSpeed=+b.dataset.spd;
      E('spd').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderTrack(); }));
  });
}

/* ---------- Tab: 标定审核 ---------- */
function renderCalib(){
  E('tabBody').innerHTML = `<div class="tbl-wrap"><table class="tbl" id="cTbl"></table></div>`;
  api('patrol.calibrationPage').then(r=>{
    E('cTbl').innerHTML = `<thead><tr><th>标定编号</th><th>设备</th><th>类型</th><th>申请日期</th><th>审核人</th><th>状态</th><th></th></tr></thead><tbody>`+
      r.list.map(c=>{const pend=c.status==='待审核';
      return `<tr><td class="code">${esc(c.code)}</td><td class="code">${esc(c.device)}</td><td>${esc(c.type)}</td>
        <td class="code">${esc(c.apply)}</td><td>${esc(c.reviewer)}</td>
        <td>${shell.tag(pend?'w':'s',c.status)}</td>
        <td><div class="row-tools">${pend?`<button class="btn btn-sm" data-audit="${c.id}">${shell.ic('check-circle')}<span>审核</span></button>`:`<span class="faint" style="font-size:12px">已归档</span>`}</div></td></tr>`;}).join('')+`</tbody>`;
    E('cTbl').querySelectorAll('[data-audit]').forEach(b=>b.addEventListener('click',()=>openAuditModal(b.dataset.audit)));
  });
}
function openAuditModal(id){
  api('patrol.calibrationPage').then(r=>{const c=r.list.find(x=>x.id==id); if(!c)return;
    shell.openModal({title:'标定审核 · '+c.code, size:480, okText:'确认', bodyHtml:
      `<div class="desc-list" style="margin-bottom:14px">${[['设备',c.device],['标定类型',c.type],['申请日期',c.apply]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</div>
       <div class="field"><label>审核结论</label><select class="select" id="auDec"><option value="pass">通过</option><option value="back">退回</option></select></div>`,
      onOk:()=>{ api('patrol.calibrationPage',{}); shell.toast('标定 '+c.code+' 审核：'+(E('auDec').value==='pass'?'通过':'退回'),'ok'); renderCalib(); }});
  });
}

      r.list.map(e=>`<tr><td class="code">${esc(e.code)}</td><td>${esc(e.loc)}</td><td>${esc(e.company)}</td>
        <td class="code">${esc(e.near)}</td><td class="code">${esc(e.start)}</td>
        <td>${shell.tag(e.status==='监护中'?'w':'s',e.status)}</td></tr>`).join('')+`</tbody>`;

/* ---------- Tab: 统计绩效 ---------- */
function renderStats(){
  api('patrol.stats').then(s=>{
    const rc=s.recognition, pct=(rc.rate*100).toFixed(1);
    const R=52, C=2*Math.PI*R, off=C*(1-rc.rate);
    const ring=`<svg viewBox="0 0 140 140" width="140" height="140">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="14"/>
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--media)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>
      <text x="70" y="66" text-anchor="middle" fill="var(--text)" font-size="22" font-family="DIN Alternate" font-weight="600">${pct}%</text>
      <text x="70" y="86" text-anchor="middle" fill="var(--text-sub)" font-size="11">AI 识别准确率</text></svg>`;
    const medals=['🥇','🥈','🥉','④'];
    const rank=s.rank.slice(0,4).map((x,i)=>`<div class="panel" style="padding:14px;display:flex;align-items:center;gap:12px">
      <div style="font-size:22px">${i===0?shell.ic('award'):medals[i]}</div>
      <div style="flex:1"><b>${esc(x.name)}</b><div class="muted" style="font-size:12px">完成工单 ${x.orders}</div></div>
      <span class="metric" style="font-size:18px;color:var(--media)">${x.score}</span></div>`).join('');
    E('tabBody').innerHTML = `<div class="grid g-4" style="margin-bottom:16px">
      ${kpiCard('本月完成工单','<span class="metric">'+s.orders_done+'</span>','环比 +6.2%','', 'clipboard-list')}
      ${kpiCard('隐患处置','<span class="metric">'+s.dangers+'</span>','闭环率 94%','warn','alert-triangle')}
      ${kpiCard('开挖监护','<span class="metric">'+s.excavation+'</span>','联动分析','', 'hard-hat')}
      ${kpiCard('IoT 联动告警','<span class="metric">'+s.iot_alarm+'</span>','自动派单','media','radio')}
    </div>
    <div class="grid g-2-1">
      <div class="panel"><div class="card-head"><h3>绩效排行榜</h3><span class="sub">Top 4 · 本月</span></div><div class="card-body" style="display:flex;flex-direction:column;gap:10px">${rank}</div></div>
      <div class="panel"><div class="card-head"><h3>AI 识别</h3><span class="sub">${s.month}</span></div><div class="card-body" style="display:flex;flex-direction:column;align-items:center;gap:10px">
        ${ring}<div class="desc-list" style="width:100%">${[['识别总数',rc.total],['正确识别',rc.correct],['识别准确率',pct+'%']].map(([k,v])=>`<dt>${k}</dt><dd class="metric">${v}</dd>`).join('')}</div></div></div>
    </div>`;
  });
}

/* ---------- Tab 路由 ---------- */
const tabs = {plan:renderPlan,order:renderOrder,danger:renderDanger,track:renderTrack,calib:renderCalib,excav:renderExcav,stats:renderStats};
E('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  E('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  tabs[b.dataset.tab]();
}));
renderKpi(); renderPlan();
/* D7 单租户口径：切换租户 → 重新渲染 KPI 与当前标签页（数据按本租户介质重取） */
document.addEventListener('mediachange',()=>{
  renderKpi();
  const on = E('tabs').querySelector('button.on');
  if(on && tabs[on.dataset.tab]) tabs[on.dataset.tab]();
});

  </script>
</body>
</html>
