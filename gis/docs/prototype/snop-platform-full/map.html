<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管网一张图 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.map-layout{display:grid;grid-template-columns:248px 1fr 304px;gap:16px;margin-top:16px;min-height:calc(100vh - 150px)}
.map-stage{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.map-stage svg{display:block;width:100%;height:100%}
.map-toolbar{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.map-toolbar .btn{justify-content:flex-start;background:color-mix(in srgb,var(--surface) 92%,transparent);opacity:.96}
.map-toolbar .btn.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.map-zoom{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.zoom-bar{display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);border-radius:var(--r-md);padding:3px}
.zoom-bar button{border:0;background:transparent;color:var(--text-sub);font:12px var(--mfont);padding:4px 9px;border-radius:6px;cursor:pointer}
.zoom-bar button.on{background:var(--media-soft);color:var(--media);font-weight:700}
.zoom-note{font-size:11px;color:var(--text-sub);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.map-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:8px 12px;font-size:12px;box-shadow:var(--sh-md);z-index:6;display:none;min-width:160px}
.map-legend{position:absolute;bottom:12px;left:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;z-index:5;font-size:12px;color:var(--text-sub);max-width:60%}
.map-legend .li{display:flex;align-items:center;gap:8px;margin-top:5px}
.map-legend .li:first-child{margin-top:0}
.layer-tree .lt-item{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;cursor:default;border-radius:6px}
.layer-tree .lt-item:hover{background:var(--surface-2)}
.layer-tree .lt-item .cnt{margin-left:auto;font-size:11px;color:var(--text-faint);font-family:var(--mfont)}
.layer-tree .dot{width:9px;height:9px;border-radius:3px;flex:none}
.ft-detail dl{margin:0}
.kpi-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.kpi-row .k{display:flex;flex-direction:column}
.kpi-row .k b{font-family:var(--sfont);font-size:22px;letter-spacing:.4px}
.kpi-row .k span{font-size:11px;color:var(--text-sub)}
.tool-result{border-top:1px solid var(--border);padding-top:12px;margin-top:6px}
</style>
</head>
<body data-page="map">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>管网一张图</b> / GIS 域 · 管网数字资产底座<div class="fid">覆盖 F-G01/G05/G06/G07/G08/G09/G10</div></div>
    <div class="spacer"></div>
    <span id="mediaSlot"></span>
    <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
    <span class="tag p"><i></i>演示数据</span>
    <span class="tag s"><i></i>系统在线</span>
  </header>

  <div class="map-layout">
    <!-- 左：图层树 -->
    <div class="panel reveal">
      <div class="card-head"><h3>图层树</h3><span class="sub">显隐 / 排序</span></div>
      <div class="card-body layer-tree" id="layerTree" style="padding:10px 14px"></div>
      <div class="divider" style="margin:8px 0"></div>
      <div class="card-body" style="padding:10px 14px">
        <div class="field"><label>空间查询（关键字 / BBox）</label>
          <div style="display:flex;gap:8px"><input class="input" id="spQuery" placeholder="编号 / 名称 关键字">
          <button class="btn btn-primary btn-sm" id="spQueryBtn">查询</button></div></div>
        <div id="spResult" class="code faint" style="margin-top:10px;font-size:11px;min-height:16px"></div>
      </div>
    </div>

    <!-- 中：SVG 管网示意 -->
    <div class="map-stage reveal">
      <div class="map-toolbar">
        <button class="btn btn-sm" data-tool="line">绘制管线</button>
        <button class="btn btn-sm" data-tool="poly">绘制面</button>
        <button class="btn btn-sm" data-tool="measure">量算</button>
        <button class="btn btn-sm" data-tool="snap">吸附开关</button>
        <button class="btn btn-sm" data-tool="query">空间查询</button>
      </div>
      <div class="map-zoom">
        <div class="zoom-bar" id="zoomBar">
          <button data-z="18">Z18</button><button data-z="19" class="on">Z19</button><button data-z="20">Z20</button>
        </div>
        <div class="zoom-note" id="zoomNote">矢量分级加载：Z19 管点/建筑清晰</div>
      </div>
      <svg id="pipeSvg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-tip" id="mapTip"></div>
      <div class="map-legend" id="mapLegend"></div>
    </div>

    <!-- 右：属性 / 工具面板 -->
    <div class="panel reveal">
      <div class="card-head"><h3>属性与工具</h3><span class="sub" id="mediaTag">供水</span></div>
      <div class="card-body" id="ftDetail">
        <div class="empty" style="padding:24px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>点击地图要素查看属性<br>或使用左侧工具开始分析</span></div>
      </div>
      <div class="divider"></div>
      <div class="card-body" style="padding-top:0">
        <div class="kpi-row" id="kpiRow"></div>
        <a class="btn btn-sm" style="width:100%;justify-content:center" href="layer.html">进入图层与要素管理 →</a>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('map');
shell.mount();
shell.mountMediaSwitch();

/* ===== 介质编码 ===== */
const MEDIA_COLOR = { gas:'#F59E0B', water:'#2FB8C9', heat:'#FB923C' };
const MEDIA_LABEL = { gas:'燃气', water:'供水', heat:'热力' };
const clsName = c => ({pipe:'管线',valve:'阀门',meter:'计量',facility:'设施',mark:'标注',landmark:'地标'}[c]||c);

/* ===== 网络节点坐标（示意） ===== */
const NODES = {
  P001:[110,120], P015:[270,150], P030:[430,110], P052:[600,150], P380:[360,260],
  P460:[560,300], P500:[720,210], P600:[200,310], P700:[700,400], P800:[350,430]
};
const PIPES = [
  {code:'GS-2024-0001',media:'water',dn:'DN800',path:['P001','P015','P030','P052']},
  {code:'GS-2024-0006',media:'water',dn:'DN300',path:['P030','P380','P460']},
  {code:'RQ-2025-0102',media:'gas',dn:'DN200',path:['P600','P800','P700']},
  {code:'RL-2025-0031',media:'heat',dn:'DN600',path:['P500','P700','P460']}
];

/* ===== 图层状态 ===== */
let layerState = {};
let layers = [];
let allFeatures = [];

(async () => {
  const { list } = await api.layer.tree();
  layers = list;
  list.forEach(l => layerState[l.id] = l.visible);
  const { list: fl } = await api.feature.page({});
  allFeatures = fl;
  const cur = shell.media();          /* D7 单租户口径 */
  renderTree();
  drawMap();
  renderKpi(cur);
  renderLegend(cur);
  const mt = document.getElementById('mediaTag'); if(mt) mt.textContent = MEDIA_LABEL[cur];
})();

/* ===== 图层树：D7 单租户口径，仅显示本租户介质的图层 ===== */
function renderTree(){
  const cur = shell.media();
  const sorted = layers.filter(l=>l.media===cur).sort((a,b)=>a.order-b.order);
  document.getElementById('layerTree').innerHTML = sorted.map(l=>{
    const mc = MEDIA_COLOR[l.media];
    return `<div class="lt-item">
      <label class="checkbox" style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" data-ly="${l.id}" ${layerState[l.id]?'checked':''}>
        <span class="dot" style="background:${mc}"></span>
        <span>${shell.esc(l.name)}</span>
      </label>
      <span class="cnt">${l.cnt}</span>
    </div>`;
  }).join('') || shell.emptyHtml('本租户暂无图层');
  document.querySelectorAll('[data-ly]').forEach(cb=>cb.addEventListener('change',()=>{
    layerState[+cb.dataset.ly] = cb.checked;
    const g = document.querySelector(`g[data-layer="${cb.dataset.ly}"]`);
    if(g) g.style.display = cb.checked ? '' : 'none';
  }));
}

/* ===== SVG 地图 ===== */
const svgEl = document.getElementById('pipeSvg');
const tip = document.getElementById('mapTip');
let ftPositions = {}; // code -> [x,y]

function drawMap(){
  const cur = shell.media();   /* D7 单租户口径：只绘制本租户介质的管网与要素 */
  let html = '<g opacity=".35">';
  for(let x=20;x<=880;x+=86) html+=`<line x1="${x}" y1="0" x2="${x}" y2="560" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  for(let y=0;y<=560;y+=62) html+=`<line x1="20" y1="${y}" x2="880" y2="${y}" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  html += '</g>';
  // 按图层分组（仅本租户介质图层）
  layers.filter(l=>l.media===cur).forEach(l=>{ html += `<g class="lyr" data-layer="${l.id}" style="display:${layerState[l.id]?'':'none'}"></g>`; });
  svgEl.innerHTML = html;

  // 管线
  PIPES.filter(p=>p.media===cur).forEach(p=>{
    const layer = layers.find(l=>l.cls==='pipe'&&l.media===p.media);
    const g = layer ? svgEl.querySelector(`g[data-layer="${layer.id}"]`) : null;
    if(!g) return;
    const pts = p.path.map(n=>NODES[n].join(',')).join(' ');
    const c = MEDIA_COLOR[p.media];
    const w = p.dn.includes('800')?7:p.dn.includes('600')?6:p.dn.includes('300')?5:4;
    const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points',pts); pl.setAttribute('fill','none');
    pl.setAttribute('stroke',c); pl.setAttribute('stroke-width',w);
    pl.setAttribute('stroke-linecap','round'); pl.setAttribute('opacity','.9'); pl.style.cursor='pointer';
    pl.innerHTML = `<title>${p.code} · ${MEDIA_LABEL[p.media]} ${p.dn}</title>`;
    pl.addEventListener('click',()=>openFeatureByCode(p.code));
    g.appendChild(pl);
  });

  // 设备（来自 api.feature.page，按 cls+media 归属图层；仅本租户介质）
  allFeatures.filter(f=>f.media===cur).forEach(f=>{
    const layer = layerOf(f);
    const g = svgEl.querySelector(`g[data-layer="${layer}"]`);
    if(!g) return;
    const pos = fpos(f);
    ftPositions[f.code] = pos;
    g.appendChild(makeFeature(f,pos));
  });
}

function layerOf(f){
  if(f.cls==='pipe') return (layers.find(l=>l.cls==='pipe'&&l.media===f.media)||{}).id;
  if(f.cls==='valve') return (layers.find(l=>l.cls==='valve')||{}).id;
  if(f.cls==='meter') return (layers.find(l=>l.cls==='meter'&&l.media===f.media)||{}).id;
  if(f.cls==='facility') return (layers.find(l=>l.cls==='facility'&&l.media===f.media)||{}).id;
  if(f.cls==='mark') return (layers.find(l=>l.cls==='mark')||{}).id;
  if(f.cls==='landmark') return (layers.find(l=>l.cls==='landmark')||{}).id;
  return layers[0].id;
}
function fpos(f){
  if(f.cls==='pipe'){ const p=PIPES.find(x=>x.code===f.code); return NODES[p.path[Math.floor(p.path.length/2)]]; }
  const map = { 'FM-2024-0118':NODES.P030,'FM-2024-0119':NODES.P380,'FL-2026-0042':NODES.P052,
    'PR-2026-0311':NODES.P800,'XF-2024-0158':NODES.P015,'TY-2026-009':NODES.P700,
    'BJ-2026-077':NODES.P460,'DB-2025-012':NODES.P001 };
  return map[f.code] || [400,300];
}
function makeFeature(f,[x,y]){
  const c = MEDIA_COLOR[f.media];
  const wrap = document.createElementNS('http://www.w3.org/2000/svg','g');
  wrap.style.cursor='pointer';
  let shape;
  if(f.cls==='valve'){ shape=`<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`; }
  else if(f.cls==='meter'){ shape=`<rect x="${x-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`; }
  else if(f.cls==='facility'){ shape=`<circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`; }
  else if(f.cls==='mark'){ shape=`<path d="M${x} ${y-9} l7 12 -14 0 z" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`; }
  else if(f.cls==='landmark'){ shape=`<path d="M${x-7} ${y+7} l7 -12 7 12 z" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`; }
  else { shape=`<circle cx="${x}" cy="${y}" r="5" fill="${c}"/>`; }
  wrap.innerHTML = shape + `<circle cx="${x}" cy="${y}" r="12" fill="transparent"/>`;
  wrap.addEventListener('mousemove',e=>{
    const r = document.querySelector('.map-stage').getBoundingClientRect();
    tip.style.display='block'; tip.style.left=(e.clientX-r.left+14)+'px'; tip.style.top=(e.clientY-r.top+10)+'px';
    tip.innerHTML = `<b>${shell.esc(f.name)}</b><br><span class="code faint">${f.code} · ${MEDIA_LABEL[f.media]} ${clsName(f.cls)}</span><br><span class="code faint">${f.dn} · ${f.material} · ${f.status}</span>`;
  });
  wrap.addEventListener('mouseleave',()=>tip.style.display='none');
  wrap.addEventListener('click',()=>openFeatureByCode(f.code));
  return wrap;
}

async function openFeatureByCode(code){
  const pipe = PIPES.find(x=>x.code===code);
  let detail, isFeature = !pipe;
  if(isFeature){
    const f = allFeatures.find(x=>x.code===code);
    if(!f) return;
    detail = await api.feature.get(f.id);
  } else {
    detail = { id:null, code:pipe.code, name:pipe.code, media:pipe.media, cls:'pipe', dn:pipe.dn, material:'—', length_m:0, depth:0, status:'在用' };
  }
  const d = shell.openDrawer({ title:'要素详情 · '+detail.code, bodyHtml:featureHtml(detail) });
  if(isFeature){
    d.querySelector('[data-hist]')?.addEventListener('click', async ()=>{
      const h = await api.feature.history({id:detail.id});
      shell.openDrawer({ title:'变更历史 · '+detail.code, bodyHtml:
        '<div class="timeline">' + h.list.map(x=>`<div class="tl"><b>v${x.ver} · ${shell.esc(x.by)}</b><span class="code">${x.ts}</span><br>${shell.esc(x.note)}</div>`).join('') + '</div>' });
    });
  } else {
    const hb = d.querySelector('[data-hist]'); if(hb) hb.style.display='none';
  }
  d.querySelector('[data-measure]')?.addEventListener('click', async ()=>{
    const r = await api.analysis.measure({});
    shell.toast('量算结果：'+r.distance_m+' m','ok');
  });
  document.getElementById('ftDetail').innerHTML =
    `<div class="ft-detail"><dl class="desc-list">`+
    Object.entries({名称:detail.name,编号:detail.code,介质:MEDIA_LABEL[detail.media],类别:clsName(detail.cls),规格:detail.dn,材质:detail.material,埋深:(detail.depth||0)+' m',状态:detail.status})
      .map(([k,v])=>`<dt>${k}</dt><dd>${shell.esc(v)}</dd>`).join('')+
    `</dl></div><div class="tool-result faint" style="font-size:12px">点击其他要素或左侧工具继续操作。</div>`;
}
function featureHtml(g){
  const histBtn = (g.cls==='pipe' && !g.id) ? '' :
    `<button class="btn btn-sm btn-warn" data-hist style="flex:1;justify-content:center">查看变更历史</button>`;
  return `<dl class="desc-list">`+
    Object.entries({名称:g.name,编号:g.code,介质:MEDIA_LABEL[g.media],要素类:clsName(g.cls),公称口径:g.dn,材质:g.material,长度:(g.length_m||0)+' m',埋深:(g.depth||0)+' m',状态:g.status})
      .map(([k,v])=>`<dt>${k}</dt><dd>${shell.esc(v)}</dd>`).join('')+
    `</dl><div style="display:flex;gap:8px;margin-top:12px">
      ${histBtn}
      <button class="btn btn-sm" data-measure style="flex:1;justify-content:center">量算距离</button></div>`;
}

/* ===== 工具条 ===== */
let snapOn = false;
document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',async ()=>{
  const t = btn.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('on'));
  if(t==='snap'){ snapOn=!snapOn; btn.classList.toggle('on',snapOn); return shell.toast(snapOn?'吸附已开启：端点自动捕捉':'吸附已关闭','ok'); }
  btn.classList.add('on');
  if(t==='line') return shell.toast('绘制管线模式：依次点击地图起点/转折点/终点','ok');
  if(t==='poly') return shell.toast('绘制面模式：框选闭合区域','ok');
  if(t==='measure'){
    const r = await api.analysis.measure({});
    document.getElementById('ftDetail').querySelector('.tool-result')?.remove();
    addToolResult(`量算结果 <b class="metric">${r.distance_m} m</b>`);
    return shell.toast('量算完成：'+r.distance_m+' m','ok');
  }
  if(t==='query'){ document.getElementById('spQuery').focus(); return; }
}));
function addToolResult(html){
  const box = document.getElementById('ftDetail');
  let tr = box.querySelector('.tool-result');
  if(!tr){ tr=document.createElement('div'); tr.className='tool-result'; box.appendChild(tr); }
  tr.innerHTML = html;
}

/* 空间查询 */
document.getElementById('spQueryBtn').addEventListener('click',async ()=>{
  const kw = document.getElementById('spQuery').value.trim();
  if(!kw) return shell.toast('请输入查询关键字','err');
  const r = await api.feature.page({ keyword:kw });
  document.getElementById('spResult').innerHTML = `命中 <b style="color:var(--primary)">${r.total}</b> 项：`+
    r.list.slice(0,5).map(o=>o.code).join(' · ');
  // 高亮命中节点
  clearHighlight();
  r.list.forEach(o=>{ const pos=ftPositions[o.code]; if(pos) ring(pos); });
  shell.toast(`空间查询完成，命中 ${r.total} 项`,'ok');
});
function ring([x,y]){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','14');
  c.setAttribute('fill','none');c.setAttribute('stroke','var(--alert)');c.setAttribute('stroke-width','2');
  c.setAttribute('class','hl-ring');svgEl.appendChild(c);
}
function clearHighlight(){ svgEl.querySelectorAll('.hl-ring').forEach(e=>e.remove()); }

/* ===== 缩放级指示器 ===== */
const ZNOTE = {18:'矢量分级加载：路网/分区底图（Z18 起清晰）',19:'矢量分级加载：管点/建筑清晰（Z19 默认）',20:'矢量分级加载：标注/设备符号高清（Z20 最优）'};
document.querySelectorAll('#zoomBar button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#zoomBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('zoomNote').textContent = ZNOTE[b.dataset.z];
  shell.toast('已切换至 '+b.dataset.z+' · 矢量分级加载','ok');
}));

/* ===== 介质联动 ===== */
function renderKpi(media){
  const fs = allFeatures.filter(f=>f.media===media);
  const km = fs.filter(f=>f.cls==='pipe').reduce((s,p)=>s+(p.length_m||0),0)/1000;
  const valves = fs.filter(f=>f.cls==='valve').length;
  const devices = fs.filter(f=>['meter','facility'].includes(f.cls)).length;
  document.getElementById('kpiRow').innerHTML =
    `<div class="k"><b class="metric">${km.toFixed(1)}</b><span>管线 (km)</span></div>
     <div class="k"><b class="metric">${valves}</b><span>阀门</span></div>
     <div class="k"><b class="metric">${devices}</b><span>设备</span></div>`;
}
function renderLegend(media){
  const c = MEDIA_COLOR[media];
  document.getElementById('mapLegend').innerHTML =
    `<b style="color:${c}">${MEDIA_LABEL[media]}管网图例</b>
     <div class="li"><span class="sw" style="background:${c};width:16px;height:4px;border-radius:2px"></span>管线</div>
     <div class="li"><span class="sw" style="background:${c};width:10px;height:10px"></span>阀门 / 计量</div>
     <div class="li"><span class="sw" style="background:${c};width:10px;height:10px;border-radius:50%"></span>设施 / 标注</div>`;
}
document.addEventListener('mediachange',e=>{
  const m = e.detail;
  renderTree(); renderKpi(m); renderLegend(m); drawMap();
  document.getElementById('mediaTag').textContent = MEDIA_LABEL[m];
  clearHighlight();
  shell.toast('已切换到 '+((SNOP_MEDIAS[m]||{}).tenant||'')+'（'+MEDIA_LABEL[m]+'），图层树/图例/KPI 已按本租户重载','ok');
});
