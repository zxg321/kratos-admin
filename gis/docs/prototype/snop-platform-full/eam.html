<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAM 资产 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="eam">
  <aside class="app-nav" id="app-nav"></aside>
  <main class="app-content">
    <header class="topbar">
      <div class="crumb"><b>EAM 资产</b> / 经营域 <span class="fid">覆盖 F-E01~E06</span></div><div class="spacer"></div>
      <span id="mediaSlot"></span>
      <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
      <span class="tag p"><i></i>演示数据</span>
      <span class="tag s"><i></i>系统在线</span>
    </header>

    <div class="grid g-4 page-block" id="kpiRow"></div>

    <div class="panel page-block">
      <div class="tabs" id="tabs">
        <button class="on" data-tab="asset">资产台账</button>
        <button data-tab="maint">维保管理</button>
        <button data-tab="disposal">处置流程（BPM）</button>
        <button data-tab="purchase">采购入库</button>
        <button data-tab="brand">品牌供应商</button>
      </div>
      <div id="tabBody" class="card-body"></div>
    </div>
  </main>
  <script src="assets/icons.js"></script>
  <script src="assets/components.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script>
const shell = new Shell('eam'); shell.mount(); shell.mountMediaSwitch();

const esc = s => shell.esc(s);
const E = (id) => document.getElementById(id);
function aStatusTag(st){ return ({'在用':['s','在用'],'待报废':['w','待报废'],'停用':['d','停用'],'闲置':['g','闲置']})[st] || ['g',st]; }
function bTypeTag(t){ return ({'调拨':['p','调拨'],'改装':['p','改装'],'报废':['d','报废'],'变卖':['a','变卖']})[t] || ['g',t]; }
function bStatusTag(st){ return ({'审批中':['w','审批中'],'已完成':['s','已完成'],'已驳回':['d','已驳回']})[st] || ['g',st]; }
function kpiCard(lab,val,sub,cls,ic){
  return `<div class="kpi ${cls||''} reveal"><div class="lab">${ic?shell.ic(ic):''}<span>${lab}</span></div><div class="val metric">${val}</div><div class="sub">${sub||''}</div></div>`;
}

/* D7 单租户口径：资产 KPI 由本租户介质的台账/处置/维保数据实时统计 */
async function renderKpi(){
  const media = (window.SNOP_MEDIAS||{})[shell.media()] || {label:'',tenant:''};
  const a = await api('eam.assetPage',{});
  const d = await api('eam.disposalPage',{});
  const m = await api('eam.maintPage',{});
  const inUse = a.list.filter(x=>x.status==='在用').length;
  const doing = d.list.filter(x=>x.status==='审批中').length;
  const soon  = m.list.filter(x=>x.status==='待执行').length;
  const val = a.list.reduce((s2,x)=>s2+(x.value||0),0);
  E('kpiRow').innerHTML =
    kpiCard('资产总量','<span class="metric">'+a.total+'</span>','台套 · 原值 '+(val/10000).toFixed(1)+' 万','', 'package') +
    kpiCard('在用资产','<span class="metric">'+inUse+'</span>','本租户 · '+media.tenant,'s','check-circle') +
    kpiCard('审批中','<span class="metric">'+doing+'</span>','BPM 流转','warn','git-merge') +
    kpiCard('维保待执行','<span class="metric">'+soon+'</span>','需关注','media','wrench');
}

/* ---------- 资产台账 ---------- */
const assetF = {category:'all',status:'all',keyword:''};
function renderAsset(){
  const toolbar = `<div class="toolbar">
    <span class="search">${shell.ic('search')}<input class="input" id="asKw" placeholder="资产编号/名称" value="${esc(assetF.keyword)}"></span>
    <select class="select" id="asCat" style="width:auto"><option value="all">全部类别</option><option value="计量设备">计量设备</option><option value="管阀配件">管阀配件</option><option value="自控设备">自控设备</option></select>
    <select class="select" id="asSt" style="width:auto"><option value="all">全部状态</option><option value="在用">在用</option><option value="待报废">待报废</option><option value="停用">停用</option></select>
    <span class="grow"></span>
    <button class="btn btn-primary" id="asNew">${shell.ic('plus')}<span>新增资产</span></button>
  </div>`;
  E('tabBody').innerHTML = toolbar + `<div class="tbl-wrap"><table class="tbl" id="aTbl"></table></div>`;
  const reload = ()=>{ assetF.category=E('asCat').value; assetF.status=E('asSt').value; assetF.keyword=E('asKw').value;
    api('eam.assetPage',assetF).then(r=>{
      E('aTbl').innerHTML = `<thead><tr><th>资产编号</th><th>名称</th><th>类别</th><th>状态</th><th>所属组织</th><th>关联 GIS 设备</th><th>购置日期</th><th>原值</th><th></th></tr></thead><tbody>`+
        r.list.map(a=>{const [c,t]=aStatusTag(a.status);
        return `<tr><td class="code">${esc(a.asset_no)}</td><td>${esc(a.name)}</td><td>${shell.tag('g',a.category)}</td>
          <td>${shell.tag(c,t)}</td><td>${esc(a.org)}</td><td class="code">${esc(a.gis)}</td>
          <td class="code">${esc(a.buy)}</td><td class="metric">¥${a.value.toLocaleString()}</td>
          <td><div class="row-tools"><button class="btn btn-sm" data-d="${a.id}">${shell.ic('eye')}<span>详情</span></button></div></td></tr>`;}).join('')+`</tbody>`;
      E('aTbl').querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>assetDetail(b.dataset.d)));
    });};
  E('asCat').addEventListener('change',reload); E('asSt').addEventListener('change',reload); E('asKw').addEventListener('input',reload);
  E('asNew').addEventListener('click',openAssetModal); reload();
}
function assetDetail(id){
  api('eam.assetPage',{}).then(r=>{const a=r.list.find(x=>x.id==id); if(!a)return;const [c,t]=aStatusTag(a.status);
    shell.openDrawer({title:'资产详情 '+a.asset_no, bodyHtml:
      `<div class="desc-list">${[['名称',a.name],['类别',a.category],['状态',t],['所属组织',a.org],['关联 GIS 设备',a.gis],['购置日期',a.buy],['资产原值','¥'+a.value.toLocaleString()]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</div>`});
  });
}
function openAssetModal(){
  shell.openModal({title:'新增资产', size:520, okText:'登记入库', bodyHtml:
    `<div class="form-grid">
      <div class="field full"><label>资产名称</label><input class="input" id="amName" placeholder="如：电磁流量计 EMF-400"></div>
      <div class="field"><label>类别</label><select class="select" id="amCat"><option>计量设备</option><option>管阀配件</option><option>自控设备</option></select></div>
      <div class="field"><label>所属组织</label><input class="input" id="amOrg" placeholder="如：江南水司"></div>
      <div class="field"><label>关联 GIS 设备</label><input class="input" id="amGis" placeholder="设备编码，可空"></div>
      <div class="field"><label>资产原值（元）</label><input class="input" id="amVal" type="number" placeholder="48000"></div>
    </div>`,
    onOk:()=>{ const n=E('amName').value.trim(); if(!n){shell.toast('请填写资产名称','err');return false;}
      shell.toast('资产「'+n+'」已登记入库','ok'); renderAsset(); }});
}

/* ---------- 维保管理 ---------- */
function renderMaint(){
  E('tabBody').innerHTML = `<div class="tbl-wrap"><table class="tbl" id="mtTbl"></table></div>`;
  api('eam.maintPage').then(r=>{
    E('mtTbl').innerHTML = `<thead><tr><th>资产</th><th>维保计划</th><th>下次执行</th><th>上次执行</th><th>状态</th></tr></thead><tbody>`+
      r.list.map(m=>{const near=m.next!=='-'&&new Date(m.next)<new Date('2026-10-01');
      return `<tr><td class="code">${esc(m.asset)}</td><td>${esc(m.plan)}</td><td class="code">${esc(m.next)}</td>
        <td class="code">${esc(m.last)}</td><td>${m.status==='待执行'?shell.tag(near?'w':'g','待执行'+(near?' · 临期':'')):shell.tag('s',m.status)}</td></tr>`;}).join('')+`</tbody>`;
  });
}

/* ---------- 处置流程（BPM） ---------- */
const dispF = {type:'all'};
function renderDisposal(){
  const toolbar = `<div class="toolbar">
    <select class="select" id="dpType" style="width:auto"><option value="all">全部类型</option><option value="调拨">调拨</option><option value="改装">改装</option><option value="报废">报废</option><option value="变卖">变卖</option></select>
    <span class="grow"></span>
    <button class="btn btn-primary" id="dpNew">${shell.ic('git-branch')}<span>发起处置</span></button>
    <span class="media-chip" style="margin-left:4px"><i></i>对接第三方 BPM 适配器</span>
  </div>`;
  E('tabBody').innerHTML = toolbar + `<div class="tbl-wrap"><table class="tbl" id="dpTbl"></table></div>
    <div class="panel" style="margin-top:14px"><div class="card-head"><h3>BPM 流程说明</h3><span class="sub">第三方 BPM 适配器驱动</span></div>
    <div class="card-body"><div class="timeline">
      ${[['发起申请','资产负责人提交处置单'],['归口初审','资产管理部门合规审查'],['分管审批','分管领导/资产委员会'],['执行处置','调拨出库/报废处置/变卖'],['归档闭环','BPM 回写，台账同步']].map((s,i)=>`<div class="tl"><b>${i+1}. ${s[0]}</b><span class="code">${s[1]}</span></div>`).join('')}
    </div></div></div>`;
  const reload = ()=>{ dispF.type=E('dpType').value;
    api('eam.disposalPage',dispF).then(r=>{
      E('dpTbl').innerHTML = `<thead><tr><th>BPM 编号</th><th>类型</th><th>资产</th><th>调出→调入</th><th>状态</th><th>当前节点</th><th></th></tr></thead><tbody>`+
        r.list.map(d=>{const [tc,tt]=bTypeTag(d.type);const [sc,st]=bStatusTag(d.status);
        return `<tr><td class="code">${esc(d.bpm_no)}</td><td>${shell.tag(tc,tt)}</td><td class="code">${esc(d.asset)}</td>
          <td class="code">${esc(d.from)} → ${esc(d.to==='-'?'—':d.to)}</td>
          <td>${shell.tag(sc,st)}</td><td class="code">${esc(d.node)}</td>
          <td><div class="row-tools">
            ${d.status==='审批中'?`<button class="btn btn-sm btn-primary" data-pass="${d.id}">${shell.ic('check')}<span>通过</span></button>
            <button class="btn btn-sm btn-danger" data-rej="${d.id}">${shell.ic('x')}<span>驳回</span></button>`:`<span class="faint" style="font-size:12px">已结束</span>`}
          </div></td></tr>`;}).join('')+`</tbody>`;
      E('dpTbl').querySelectorAll('[data-pass]').forEach(b=>b.addEventListener('click',()=>bpmPass(b.dataset.pass)));
      E('dpTbl').querySelectorAll('[data-rej]').forEach(b=>b.addEventListener('click',()=>bpmReject(b.dataset.rej)));
    });};
  E('dpType').addEventListener('change',reload); E('dpNew').addEventListener('click',openDisposalModal); reload();
}
function bpmPass(id){
  api('eam.bpmApprove',{id}).then(res=>{ shell.toast('BPM 已通过，'+res.node,'ok'); renderDisposal(); });
}
function bpmReject(id){
  api('eam.bpmReject',{id}).then(()=>{ shell.toast('BPM 已驳回','ok'); renderDisposal(); });
}
function openDisposalModal(){
  shell.openModal({title:'发起资产处置（BPM）', size:520, okText:'提交审批', bodyHtml:
    `<div class="form-grid">
      <div class="field"><label>处置类型</label><select class="select" id="dmType"><option>调拨</option><option>改装</option><option>报废</option><option>变卖</option></select></div>
      <div class="field"><label>关联资产</label><input class="input" id="dmAsset" placeholder="资产编号 ZC-"></div>
      <div class="field full"><label>处置说明</label><textarea class="textarea" id="dmNote" placeholder="处置原因、去向、合规依据…"></textarea></div>
    </div>`,
    onOk:()=>{ const a=E('dmAsset').value.trim(); if(!a){shell.toast('请填写关联资产','err');return false;}
      api('eam.disposalCreate',{type:E('dmType').value,asset:a,note:E('dmNote').value}).then(res=>{ shell.toast('已发起处置，BPM 号 '+res.bpm_no,'ok'); renderDisposal(); }); }});
}

/* ---------- 采购入库 ---------- */
function renderPurchase(){
  E('tabBody').innerHTML = `<div class="tbl-wrap"><table class="tbl" id="puTbl"></table></div>`;
  api('eam.purchasePage').then(r=>{
    E('puTbl').innerHTML = `<thead><tr><th>PO 号</th><th>供应商</th><th>采购内容</th><th>金额</th><th>状态</th><th>验收</th></tr></thead><tbody>`+
      r.list.map(p=>{const [c,t]=(p.status==='已入库')?['s','已入库']:['w','验收中'];
      return `<tr><td class="code">${esc(p.po_no)}</td><td>${esc(p.supplier)}</td><td>${esc(p.items)}</td>
        <td class="metric">¥${p.amount.toLocaleString()}</td><td>${shell.tag(c,t)}</td>
        <td>${esc(p.check)}</td></tr>`;}).join('')+`</tbody>`;
  });
}

/* ---------- 品牌供应商 ---------- */
function renderBrand(){
  E('tabBody').innerHTML = `<div class="grid g-3" id="bGrid"></div>`;
  api('eam.brandPage').then(r=>{
    E('bGrid').innerHTML = r.list.map(b=>{const [c,t]=(b.level==='战略')?['p','战略']:['s','优选'];
      return `<div class="panel"><div class="card-head"><h3>${esc(b.name)}</h3>${shell.tag(c,t)}</div>
        <div class="card-body"><div class="desc-list">
          <dt>供应品类</dt><dd>${esc(b.type)}</dd><dt>联系方式</dt><dd class="code">${esc(b.contact)}</dd></div></div></div>`;}).join('');
  });
}

/* ---------- 路由 ---------- */
const tabs = {asset:renderAsset,maint:renderMaint,disposal:renderDisposal,purchase:renderPurchase,brand:renderBrand};
E('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  E('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); tabs[b.dataset.tab]();
}));
renderKpi(); renderAsset();
/* D7 单租户口径：切换租户 → 重新渲染 KPI 与当前标签页（数据按本租户介质重取） */
document.addEventListener('mediachange',()=>{
  renderKpi();
  const on = E('tabs').querySelector('button.on');
  if(on && tabs[on.dataset.tab]) tabs[on.dataset.tab]();
});

  </script>
</body>
</html>
