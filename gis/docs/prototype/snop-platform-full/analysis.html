<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空间分析 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.an-layout{display:grid;grid-template-columns:210px 1fr 1fr;gap:16px;margin-top:16px;min-height:calc(100vh - 200px)}
.an-list .an-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r-md);cursor:pointer;color:var(--text-sub);border:1px solid transparent;transition:.15s}
.an-list .an-item:hover{background:var(--surface-2);color:var(--text)}
.an-list .an-item.on{background:var(--primary-soft);color:var(--primary);border-color:rgba(47,184,201,.3)}
.an-list .an-item svg{width:17px;height:17px}
.an-stage{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.an-stage svg{display:block;width:100%;height:100%}
.an-param{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.an-param .input{width:120px}
</style>
</head>
<body data-page="analysis">
<aside class="app-nav" id="app-nav"></aside>
<main class="app-content">
  <header class="topbar">
    <div class="crumb"><b>空间分析</b> / GIS 域 · 空间分析套件<div class="fid">覆盖 F-A01~A10</div></div>
    <div class="spacer"></div>
    <span id="mediaSlot"></span>
    <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
    <span class="tag p"><i></i>演示数据</span>
    <span class="tag s"><i></i>系统在线</span>
  </header>

  <div class="grid g-4" style="margin-top:16px">
    <div class="kpi media"><div class="lab">黄金用例对拍</div><div class="val metric">47<small>/47</small></div><div class="sub up">通过率 100%</div></div>
    <div class="kpi"><div class="lab">分析算法</div><div class="val metric">9</div><div class="sub">MCP 注册</div></div>
    <div class="kpi"><div class="lab">平均耗时</div><div class="val metric">44<small>ms</small></div><div class="sub">PostGIS + 内存图</div></div>
    <div class="kpi"><div class="lab">达标率（&lt;2s）</div><div class="val metric">100<small>%</small></div><div class="sub">性能基线</div></div>
  </div>

  <div class="an-layout">
    <!-- 左：分析类型 -->
    <div class="panel reveal"><div class="card-head"><h3>分析类型</h3><span class="sub">9 项</span></div>
      <div class="card-body an-list" id="anList" style="padding:10px"></div></div>

    <!-- 中：管网示意 -->
    <div class="panel reveal"><div class="card-head"><h3>管网示意</h3><span class="sub" id="anStageSub">结果高亮</span></div>
      <div class="an-stage" style="height:calc(100% - 52px)"><svg id="anSvg" viewBox="0 0 460 320" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>

    <!-- 右：结果面板 -->
    <div class="panel reveal"><div class="card-head"><h3>分析结果</h3><span class="sub" id="anCur">—</span>
      <div class="tools"><button class="btn btn-sm btn-primary" id="anExport">导出结果</button></div></div>
      <div class="an-param" id="anParam"></div>
      <div class="card-body" id="anResult" style="min-height:320px">
        <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>选择左侧分析类型<br>查看空间计算结果</span></div>
      </div>
    </div>
  </div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/components.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script>
const shell = new Shell('analysis');
shell.mount();
shell.mountMediaSwitch();

const MEDIA_COLOR={gas:'#F59E0B',water:'#2FB8C9',heat:'#FB923C'};
const ANALYSIS = [
  {key:'measure',name:'测距',ic:'ruler'},
  {key:'area',name:'测积',ic:'pencil-ruler'},
  {key:'buffer',name:'缓冲',ic:'circle-slash'},
  {key:'overlay',name:'叠加',ic:'layers'},
  {key:'closeValve',name:'关阀',ic:'git-branch'},
  {key:'connectivity',name:'连通',ic:'route'},
  {key:'topology',name:'拓扑',ic:'git-merge'},
  {key:'excavation',name:'开挖',ic:'hard-hat'},
  {key:'graphic',name:'图形',ic:'scan'}
];
const NODES={P001:[60,70],P015:[160,90],P030:[250,60],P052:[340,90],P380:[210,160],P460:[320,180],P700:[400,250],P800:[200,260],P500:[420,130]};
const PIPES=[
  {code:'GS-2024-0001',media:'water',path:['P001','P015','P030','P052']},
  {code:'GS-2024-0006',media:'water',path:['P030','P380','P460']},
  {code:'RQ-2025-0102',media:'gas',path:['P800','P700','P500']}
];

let curKey='measure', bufferR=100;

/* 类型列表 */
document.getElementById('anList').innerHTML = ANALYSIS.map(a=>`<div class="an-item" data-key="${a.key}">${shell.ic(a.ic)}<span>${a.name}</span></div>`).join('');
document.querySelectorAll('#anList .an-item').forEach(it=>it.addEventListener('click',()=>{
  document.querySelectorAll('#anList .an-item').forEach(x=>x.classList.remove('on'));
  it.classList.add('on'); curKey=it.dataset.key; renderParam(); run(curKey);
}));
document.querySelector('#anList .an-item').classList.add('on');

/* 参数区 */
function renderParam(){
  const box=document.getElementById('anParam');
  if(curKey==='buffer') box.innerHTML=`<label class="muted">缓冲半径</label><input class="input" id="bufR" type="number" value="${bufferR}" min="10" step="10"><span class="faint">m</span><button class="btn btn-sm btn-primary" id="bufRun">重新计算</button>`;
  else if(curKey==='connectivity') box.innerHTML=`<label class="muted">容差</label><input class="input" id="tol" value="0.05" style="width:90px"><span class="faint">m</span>`;
  else box.innerHTML=`<span class="faint">当前分析无额外参数，直接运行。</span>`;
  document.getElementById('bufRun')?.addEventListener('click',()=>{ bufferR=+document.getElementById('bufR').value||100; run('buffer'); });
}

/* 中心 SVG */
const anSvg=document.getElementById('anSvg');
function drawBase(){
  let h='<g opacity=".3">';
  for(let x=20;x<=440;x+=55) h+=`<line x1="${x}" y1="0" x2="${x}" y2="320" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  for(let y=0;y<=320;y+=50) h+=`<line x1="20" y1="${y}" x2="440" y2="${y}" stroke="var(--border)" stroke-dasharray="2 6"/>`;
  h+='</g>';
  PIPES.forEach(p=>{ const pts=p.path.map(n=>NODES[n].join(',')).join(' ');
    h+=`<polyline points="${pts}" fill="none" stroke="${MEDIA_COLOR[p.media]}" stroke-width="4" stroke-linecap="round" opacity=".85" id="pl-${p.code}"/>`;});
  Object.entries(NODES).forEach(([k,v])=>{ h+=`<circle cx="${v[0]}" cy="${v[1]}" r="4" fill="var(--surface)" stroke="var(--text-sub)" stroke-width="1.5" id="nd-${k}"/>`;});
  anSvg.innerHTML=h;
}
function highlight(nodes){
  anSvg.querySelectorAll('.hl').forEach(e=>e.remove());
  (nodes||[]).forEach(n=>{ const nd=anSvg.querySelector(`#nd-${n}`); if(!nd)return;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',nd.getAttribute('cx'));c.setAttribute('cy',nd.getAttribute('cy'));c.setAttribute('r','12');
    c.setAttribute('fill','none');c.setAttribute('stroke','var(--danger)');c.setAttribute('stroke-width','2');c.setAttribute('class','hl');
    c.innerHTML=`<animate attributeName="r" values="9;16;9" dur="1.6s" repeatCount="indefinite"/>`;
    anSvg.appendChild(c);
  });
}

/* 运行分析 */
async function run(key){
  document.getElementById('anCur').textContent = ANALYSIS.find(a=>a.key===key).name;
  let html='', nodes=null;
  if(key==='measure'||key==='area'){
    const r=await api.analysis.measure({});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag p"><i></i>量算</span></div>
      <dl class="desc-list"><dt>距离</dt><dd class="metric" style="font-size:18px">${r.distance_m} m</dd>
      <dt>面积</dt><dd>${r.area_m2??'—'}</dd></dl><div class="faint" style="font-size:12px;margin-top:10px">${key==='area'?'测积模式：闭合面面积计算中':'测距模式：折线累计长度'}</div>`;
  } else if(key==='buffer'){
    const r=await api.analysis.buffer({radius:bufferR});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag a"><i></i>缓冲分析</span><span class="tag p"><i></i>半径 ${r.radius_m} m</span></div>
      <dl class="desc-list"><dt>缓冲面积</dt><dd class="metric">${r.area.toLocaleString()} m²</dd><dt>命中管线</dt><dd>${r.pipes} 条</dd><dt>命中阀门</dt><dd>${r.valves} 个</dd></dl>`;
  } else if(key==='overlay'){
    const r=await api.analysis.graphic({});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag s"><i></i>叠加分析</span></div>
      <dl class="desc-list"><dt>叠加模式</dt><dd>矩形 / 多边形</dd><dt>管线</dt><dd>${r.pipes} 条</dd><dt>阀门</dt><dd>${r.valves} 个</dd><dt>计量</dt><dd>${r.meters} 个</dd><dt>周长</dt><dd>${r.length_m} m</dd></dl>`;
  } else if(key==='closeValve'){
    const r=await api.analysis.closeValve({});
    nodes=r.render_nodes;
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag a"><i></i>关阀影响</span><span class="tag p"><i></i>${r.perf.total}</span></div>
      <dl class="desc-list"><dt>关闭阀门</dt><dd class="code">${r.valves.join(' / ')}</dd>
      <dt>影响管段</dt><dd>${r.affected_pipes.join('<br>')}</dd><dt>影响用户</dt><dd class="metric" style="font-size:18px">${r.affected_users} 户</dd>
      <dt>预计时长</dt><dd>${r.est_hours} h</dd><dt>通知数</dt><dd>${r.notices}</dd></dl>
      <div class="divider"></div><div class="faint" style="font-size:12px">性能指标</div>
      <div class="timeline"><div class="tl"><b>空间预筛</b><span class="code">${r.perf.db}</span></div><div class="tl"><b>图遍历</b><span class="code">${r.perf.graph}</span></div><div class="tl done"><b>总耗时</b><span class="code">${r.perf.total}</span></div></div>
      <button class="btn btn-sm btn-warn" style="margin-top:10px;width:100%" onclick="shell.toast('已生成停水通知工单','ok')">生成停水通知工单</button>`;
  } else if(key==='connectivity'){
    const r=await api.analysis.connectivity({});
    nodes=r.path;
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag s"><i></i>连通可达</span></div>
      <dl class="desc-list"><dt>结果</dt><dd class="tag s"><i></i>${r.result}</dd><dt>路径</dt><dd class="code">${r.path.join(' → ')}</dd>
      <dt>跳数</dt><dd class="metric">${r.hops}</dd><dt>容差</dt><dd>${r.tolerance}</dd><dt>耗时</dt><dd>${r.perf}</dd></dl>`;
  } else if(key==='topology'){
    const r=await api.analysis.topology({});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag d"><i></i>发现 ${r.issues.length} 处拓扑问题</span></div>`+
      r.issues.map(i=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)"><span class="tag d"><i></i>${i.type}</span><span class="code">${i.code}</span><span class="faint">${i.desc}</span></div>`).join('')+
      `<div class="faint" style="font-size:12px;margin-top:10px">与 S2 拓扑质检联动，问题可视化标红。</div>`;
  } else if(key==='excavation'){
    const r=await api.analysis.excavation({});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag w"><i></i>开挖影响区</span><span class="tag p"><i></i>半径 ${r.radius_m} m</span></div>
      <dl class="desc-list"><dt>开挖点</dt><dd class="code">${r.center.lat}, ${r.center.lng}</dd><dt>埋深/地面</dt><dd>${r.depth} / ${r.ground} m</dd>
      <dt>规格</dt><dd>${r.spec}</dd><dt>影响管段</dt><dd>${r.affected_pipes.join('<br>')}</dd><dt>周边要素</dt><dd class="code">${r.affected_overlays.join(' / ')}</dd>
      <dt>统计</dt><dd>管 ${r.stat.pipes} · 阀 ${r.stat.valves} · 栓 ${r.stat.hydrants} · 表 ${r.stat.meters}</dd></dl>`;
  } else if(key==='graphic'){
    const r=await api.analysis.graphic({});
    html=`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="tag p"><i></i>图形分析 · ${r.mode}</span></div>
      <dl class="desc-list"><dt>管线</dt><dd>${r.pipes} 条</dd><dt>阀门</dt><dd>${r.valves} 个</dd><dt>计量</dt><dd>${r.meters} 个</dd><dt>周长</dt><dd>${r.length_m} m</dd></dl>`;
  }
  document.getElementById('anResult').innerHTML=html;
  document.getElementById('anStageSub').textContent = ANALYSIS.find(a=>a.key===key).name+' 高亮';
  drawBase(); highlight(nodes);
  shell.toast('分析完成：'+ANALYSIS.find(a=>a.key===key).name,'ok');
}

/* 导出 */
document.getElementById('anExport').addEventListener('click',async()=>{
  const r=await api.analysis.export({key:curKey});
  shell.toast('已导出 '+r.file+'（'+r.rows+' 行）','ok');
});

renderParam();
drawBase();
run('measure');
</script>
</body>
</html>
