<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备与采集 · SNOP 智慧能源运营管理一体化平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="device">
  <aside class="app-nav" id="app-nav"></aside>
  <main class="app-content">
    <header class="topbar">
      <div class="crumb"><b>设备与采集</b> / 感知域<span class="fid">覆盖 F-D01~D10</span></div>
      <div class="spacer"></div>
      <span id="mediaSlot"></span>
      <span class="media-chip" id="mediaChip"><i></i>江南水司 · 供水</span>
      <span class="tag p"><i></i>演示数据</span>
      <span class="tag s"><i></i>系统在线</span>
    </header>

    <section class="grid g-4" style="margin-top:16px">
      <div class="kpi media reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg> 设备类别</div>
        <div class="val metric">12 <small>类</small></div>
        <div class="sub">在册设备合计 <b class="metric">12,483</b> 台</div>
      </div>
      <div class="kpi reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> 在线率</div>
        <div class="val metric">98.2<small>%</small></div>
        <div class="sub up">↑ 较上月 +0.4%</div>
      </div>
      <div class="kpi warn reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> 本月标定</div>
        <div class="val metric">42</div>
        <div class="sub">覆盖 9 类计量设备</div>
      </div>
      <div class="kpi danger reveal">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> 待纠偏</div>
        <div class="val metric">7</div>
        <div class="sub down">坐标漂移待 ETL 回写</div>
      </div>
    </section>

    <div class="panel page-block">
      <div class="tabs" id="tabs">
        <button class="on" data-tab="ledger">设备台账</button>
        <button data-tab="import">采集导入</button>
        <button data-tab="query">数据查询</button>
        <button data-tab="threshold">批量预警值</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </main>

  <script src="assets/icons.js"></script>
  <script src="assets/components.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script>
  const shell = new Shell('device'); shell.mount(); shell.mountMediaSwitch();
  (function(){
    const tabBody = document.getElementById('tabBody');
    let tab = 'ledger';
    const st = { cls:'all', media:shell.media(), status:'all', keyword:'',
                 batchStatus:'all', batchKw:'', gran:'real', group:'', thr:'' };

    /* ---------- 图表工具 ---------- */
    function spark(pts,w=140,h=38,c='var(--primary)'){
      const min=Math.min(...pts),max=Math.max(...pts),rg=(max-min)||1,step=w/(pts.length-1);
      const p=pts.map((v,i)=>(i*step).toFixed(1)+','+(h-((v-min)/rg)*h).toFixed(1)).join(' ');
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${p}"/></svg>`;
    }
    function curveChart(){
      const n=24;
      const s1=Array.from({length:n},(_,i)=>0.52+Math.sin(i/3)*0.18+Math.random()*0.04);
      const s2=Array.from({length:n},(_,i)=>0.44+Math.sin(i/3+1)*0.16+Math.random()*0.04);
      const W=600,H=200,pad=12;
      const min=Math.min(...s1,...s2),max=Math.max(...s1,...s2),rg=(max-min)||1,step=(W-pad*2)/(n-1);
      const plot=(pts,c)=>{const p=pts.map((v,i)=>(pad+i*step).toFixed(1)+','+(H-pad-((v-min)/rg)*(H-pad*2)).toFixed(1)).join(' ');return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${p}"/>`;};
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--surface-2);border-radius:10px">${plot(s1,'var(--primary)')}${plot(s2,'var(--warn)')}</svg>
        <div class="legend" style="margin-top:8px"><span class="li"><span class="sw" style="background:var(--primary)"></span>本机</span><span class="li"><span class="sw" style="background:var(--warn)"></span>去年同期</span></div>`;
    }
    function barChart(data,color='var(--primary)'){
      const W=600,H=200,pad=12,n=data.length,pw=(W-pad*2)/n,max=Math.max(...data)||1;
      const bars=data.map((v,i)=>{const bh=(v/max)*(H-pad*2),x=pad+i*pw+3,y=H-pad-bh;return `<rect x="${x}" y="${y}" width="${Math.max(pw-6,2)}" height="${bh}" rx="3" fill="${color}"/>`;}).join('');
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--surface-2);border-radius:10px">${bars}</svg>`;
    }
    function statusTag(s){
      const map={'在线':['s'],'开启':['s'],'运行':['s'],'完好':['s'],'离线':['d']};
      const m=map[s]||['g']; return `<span class="tag ${m[0]}"><i></i>${s}</span>`;
    }
    function mt(v){return `<span class="metric">${v}</span>`;}

    /* ---------- 设备台账 ---------- */
    function ledgerTpl(){
      return `<div class="toolbar">
        <select class="select filter" data-f="cls" style="width:130px">
          <option value="all">全部类别</option>
          <option>流量计</option><option>压力表</option><option>检测表</option><option>监测表</option>
          <option>阀门</option><option>采集终端</option><option>消防设备</option><option>输配设备</option>
          <option>大用户表</option><option>监控设备</option>
        </select>
        <select class="select filter" data-f="media" style="width:110px">
          <option value="water">供水（本租户）</option>
        </select>
        <select class="select filter" data-f="status" style="width:120px">
          <option value="all">全部状态</option><option>在线</option><option>离线</option><option>开启</option><option>运行</option><option>完好</option>
        </select>
        <div class="grow"></div>
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" data-f="keyword" placeholder="编号 / 名称搜索"></div>
        <button class="btn btn-primary" data-add>+ 新增设备</button>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>类别</th><th>编号</th><th>名称</th><th>介质</th><th>区域</th><th>状态</th><th>安装日期</th><th>最近标定</th><th>操作</th>
      </tr></thead><tbody id="ledgerRows"></tbody></table></div>`;
    }
    async function renderLedger(){
      const d = await api('device.page',{cls:st.cls,media:st.media,status:st.status,keyword:st.keyword});
      const msel = document.querySelector('.filter[data-f="media"]');   /* D7 单租户口径 */
      if(msel){ st.media = shell.media(); shell.tenantMediaSelect(msel); }
      const tb = document.getElementById('ledgerRows');
      if(!tb) return;
      if(!d.list.length){ tb.innerHTML=`<tr><td colspan="9">${shell.emptyHtml('无符合条件的设备')}</td></tr>`; return; }
      tb.innerHTML = d.list.map(x=>`<tr>
        <td>${x.cls}</td><td class="code">${x.code}</td><td>${x.name}</td><td><span class="media-tag"></span>${({gas:'燃气',water:'供水',heat:'热力'})[x.media]||x.media}</td><td>${x.region}</td>
        <td>${statusTag(x.status)}</td><td class="code">${x.install}</td><td class="code">${x.calib}</td>
        <td><div class="row-tools">
          <button class="btn btn-sm" data-detail="${x.code}">${shell.ic('eye')} 详情</button>
          <button class="btn btn-sm btn-warn" data-correct="${x.code}">${shell.ic('map-pin')} 纠偏</button>
        </div></td></tr>`).join('');
    }
    async function openDetail(code){
      const rt = await api('device.realtime',{code});
      const hk = await api('device.history');
      const tl = hk.list.map(h=>`<div class="tl"><b>v${h.ver} · ${h.by}</b><span class="code">${h.ts}</span><div>${h.note}</div></div>`).join('');
      shell.openDrawer({
        title:'设备详情 · '+code,
        bodyHtml:`<div class="kpi media" style="margin-bottom:14px"><div class="lab">实时值</div>
          <div class="val metric">${rt.series[rt.series.length-1]}</div>
          <div class="sub">采样于 ${rt.ts}</div>${spark(rt.series,260,42,'var(--media)')}</div>
          <h3 style="font-size:14px;margin:6px 0 8px">实时趋势（近 12 帧）</h3>
          ${spark(rt.series,520,60,'var(--primary)')}
          <h3 style="font-size:14px;margin:18px 0 8px">历史版本（${shell.ic('history')}）</h3>
          <div class="timeline">${tl}</div>`,
        footerHtml:`<button class="btn btn-warn" data-correct="${code}">${shell.ic('map-pin')} 定位纠偏</button>`
      });
    }

    /* ---------- 采集导入 ---------- */
    function importTpl(){
      return `<div class="toolbar">
        <select class="select filter" data-f="batchStatus" style="width:130px">
          <option value="all">全部状态</option><option>待质检</option><option>质检中</option><option>已入库</option>
        </select>
        <div class="grow"></div>
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" data-f="batchKw" placeholder="批次号搜索"></div>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>批次号</th><th>来源</th><th class="num">点数</th><th class="num">质检通过率</th><th>状态</th><th>创建日期</th><th>操作员</th><th>操作</th>
      </tr></thead><tbody id="batchRows"></tbody></table></div>`;
    }
    async function renderImport(){
      const d = await api('collect.batchPage',{status:st.batchStatus,keyword:st.batchKw});
      const tb = document.getElementById('batchRows');
      if(!tb) return;
      if(!d.list.length){ tb.innerHTML=`<tr><td colspan="8">${shell.emptyHtml('无采集批次')}</td></tr>`; return; }
      tb.innerHTML = d.list.map(x=>`<tr>
        <td class="code">${x.identifier}</td><td>${x.source}</td><td class="num metric">${x.count}</td>
        <td class="num metric">${(x.pass*100).toFixed(1)}%</td>
        <td>${x.status==='已入库'?`<span class="tag s"><i></i>已入库</span>`:x.status==='质检中'?`<span class="tag a"><i></i>质检中</span>`:`<span class="tag w"><i></i>待质检</span>`}</td>
        <td class="code">${x.created}</td><td>${x.operator}</td>
        <td><div class="row-tools">
          <button class="btn btn-sm" data-check="${x.id}">${shell.ic('check')} 质检</button>
          <button class="btn btn-sm btn-primary" data-gen="${x.id}">${shell.ic('database')} 生成入库</button>
        </div></td></tr>`).join('');
    }
    async function doCheck(id){
      const r = await api('collect.check',{id});
      const iss = r.issues.map(i=>`<div class="tl warn"><b>${i.type}</b><span class="code">${i.code}</span></div>`).join('');
      shell.openModal({
        title:'质检结果 · 批次 #'+id, size:520,
        bodyHtml:`<div class="grid g-2" style="margin-bottom:14px">
            <div class="kpi"><div class="lab">综合通过率</div><div class="val metric">${r.pass}%</div></div>
            <div class="kpi warn"><div class="lab">问题点</div><div class="val metric">${r.issues.length}</div></div></div>
          <h3 style="font-size:14px;margin:6px 0 8px">问题点清单（重合点 / 悬挂点）</h3>
          <div class="timeline">${iss}</div>
          <div class="card-body flush" style="background:var(--surface-2);border-radius:8px;padding:10px;margin-top:12px;font-size:12px;color:var(--text-sub)">
            失败行将进入 <span class="code">collect_import_fail</span> 隔离表，不参与几何入库，需人工复核后回补。</div>`
      });
    }

    /* ---------- 数据查询 ---------- */
    function queryTpl(){
      return `<div class="toolbar">
        <div class="tabs" style="border:0;padding:0;margin:0">
          <button class="on" data-gran="real">实时</button><button data-gran="hour">时</button>
          <button data-gran="day">日</button><button data-gran="month">月</button>
        </div>
        <div class="grow"></div><span class="tag p"><i></i>数据源 · 时序库 Timescale</span>
      </div>
      <div id="queryBody" style="padding:16px"></div>`;
    }
    async function renderQuery(){
      const el = document.getElementById('queryBody'); if(!el) return;
      const g = await api('iot.granular');
      if(st.gran==='real'){
        el.innerHTML = `<div class="grid g-3" style="margin-bottom:16px">
          <div class="kpi media"><div class="lab">瞬时流量</div><div class="val metric">${g.realtime}</div><div class="sub">实时采样</div></div>
          <div class="kpi"><div class="lab">日累计</div><div class="val metric">${(g.daily/1000).toFixed(1)}k m³</div><div class="sub">今日</div></div>
          <div class="kpi warn"><div class="lab">月累计</div><div class="val metric">${(g.monthly/10000).toFixed(1)}万 m³</div><div class="sub">本月</div></div></div>
          <div class="card-head" style="border:0;padding:0 0 8px"><h3>实时流量曲线 ${shell.ic('activity')}</h3></div>
          ${curveChart()}`;
      } else if(st.gran==='hour'){
        el.innerHTML = `<div class="kpi" style="margin-bottom:16px"><div class="lab">近 6 小时瞬时流量（m³/h）</div><div class="val metric">${g.hourly.join(' / ')}</div></div>
          ${barChart(g.hourly,'var(--primary)')}`;
      } else if(st.gran==='day'){
        el.innerHTML = `<div class="grid g-2" style="margin-bottom:16px">
          <div class="kpi media"><div class="lab">日供水量</div><div class="val metric">${g.daily.toLocaleString()}</div><div class="sub">m³ / 日</div></div>
          <div class="kpi"><div class="lab">日峰值</div><div class="val metric">${Math.max(...g.hourly)*24}</div><div class="sub">推算峰值</div></div></div>
          ${barChart(g.hourly,'var(--media)')}`;
      } else {
        el.innerHTML = `<div class="grid g-2" style="margin-bottom:16px">
          <div class="kpi media"><div class="lab">月供水量</div><div class="val metric">${(g.monthly/10000).toFixed(1)}<small>万 m³</small></div></div>
          <div class="kpi warn"><div class="lab">日均</div><div class="val metric">${(g.monthly/30).toFixed(0)}</div><div class="sub">m³ / 日</div></div></div>
          ${barChart(g.hourly.map(v=>Math.round(v*30)),'var(--warn)')}`;
      }
    }

    /* ---------- 批量预警值 ---------- */
    function thresholdTpl(){
      return `<div class="card-body">
        <div class="form-grid">
          <div class="field"><label>选择设备组</label>
            <select class="select" data-f="group">
              <option value="">— 请选择 —</option><option>江南片区流量计组</option><option>梅花山压力表组</option>
              <option>高新调压站机组</option><option>过江管段监控组</option></select></div>
          <div class="field"><label>指标类型</label>
            <select class="select" data-f="metric"><option>瞬时流量</option><option>管道压力</option><option>甲烷浓度</option><option>供水温度</option></select></div>
          <div class="field"><label>运算符</label>
            <select class="select" data-f="op"><option>低于</option><option>高于</option><option>等于</option></select></div>
          <div class="field"><label>阈值</label><input class="input" data-f="thr" placeholder="如 0.15 MPa"></div>
          <div class="field"><label>持续时长</label><select class="select" data-f="dur"><option>≥1 min</option><option>≥5 min</option><option>≥30 min</option></select></div>
          <div class="field"><label>介质</label><select class="select" data-f="tmedia"><option value="water">供水（本租户）</option></select></div>
          <div class="field full"><label>预览生效范围（台）</label><input class="input" id="thrScope" value="18" readonly></div>
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" id="thrApply">${shell.ic('zap')} 批量应用预警值</button>
      </div>`;
    }

    /* ---------- 渲染调度 ---------- */
    async function render(){
      if(tab==='ledger'){ tabBody.innerHTML=ledgerTpl(); await renderLedger(); }
      else if(tab==='import'){ tabBody.innerHTML=importTpl(); await renderImport(); }
      else if(tab==='query'){ tabBody.innerHTML=queryTpl(); await renderQuery(); }
      else if(tab==='threshold'){ tabBody.innerHTML=thresholdTpl();
        const tm=document.querySelector('[data-f="tmedia"]');
        if(tm){ tm.value = shell.media(); shell.tenantMediaSelect(tm); } }
    }

    /* ---------- 事件 ---------- */
    document.getElementById('tabs').addEventListener('click',e=>{
      const b=e.target.closest('[data-tab]'); if(!b) return;
      tab=b.dataset.tab;
      [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
      render();
    });
    tabBody.addEventListener('click',async e=>{
      const t=e.target.closest('[data-gran]'); if(t){ st.gran=t.dataset.gran; [...t.parentElement.children].forEach(x=>x.classList.toggle('on',x===t)); renderQuery(); return; }
      const d=e.target.closest('[data-detail]'); if(d){ openDetail(d.dataset.detail); return; }
      const c=e.target.closest('[data-correct]'); if(c){ const r=await api('device.correct',{code:c.dataset.correct}); shell.toast('已触发定位纠偏：'+r.log,'ok'); return; }
      const a=e.target.closest('[data-add]'); if(a){
        shell.openModal({title:'新增设备',size:520,bodyHtml:`<div class="form-grid">
          <div class="field"><label>类别</label><select class="select"><option>流量计</option><option>压力表</option><option>阀门</option></select></div>
          <div class="field"><label>编号</label><input class="input" placeholder="如 FL-2026-XXXX"></div>
          <div class="field"><label>名称</label><input class="input" placeholder="设备名称"></div>
          <div class="field"><label>介质</label><select class="select"><option>供水</option><option>燃气</option><option>热力</option></select></div>
          <div class="field"><label>区域</label><input class="input" placeholder="如 江南片区"></div>
          <div class="field"><label>安装日期</label><input class="input" type="date"></div></div>`,
          onOk:()=>shell.toast('设备已登记（演示数据）','ok')});
        return;
      }
      const ch=e.target.closest('[data-check]'); if(ch){ doCheck(ch.dataset.check); return; }
      const gn=e.target.closest('[data-gen]'); if(gn){ const r=await api('collect.generate',{batch_id:+gn.dataset.gen}); shell.toast('入库完成，生成要素 '+r.feature_generated+' 个','ok'); return; }
    });
    tabBody.addEventListener('input',e=>{
      const s=e.target.closest('.filter'); if(s){ st[s.dataset.f]=e.target.value;
        if(tab==='ledger') renderLedger(); if(tab==='import') renderImport(); }
    });
    document.getElementById('tabBody').addEventListener('click',e=>{
      const ap=e.target.closest('#thrApply'); if(ap){
        const scope=Math.max(1,parseInt(document.getElementById('thrScope').value)||0);
        api('device.thresholdBatch',{count:scope}).then(r=>shell.toast('已对 '+r.affected+' 台设备批量应用预警值','ok'));
      }
    });
    /* D7 单租户口径：切换租户 → 介质筛选跟随本租户并重渲染 */
    document.addEventListener('mediachange',e=>{ st.media = (e && e.detail) || shell.media(); render(); });
    render();
  })();
  </script>
</body>
</html>
