server:
  http:
    addr: :7002
    timeout: 30s
    max_body_bytes: 67108864
    enable_swagger: true
    enable_pprof: false
    cors:
      allow_credentials: true
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "http://localhost:8850"
        - "http://127.0.0.1:8850"
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  grpc:
    addr: 0.0.0.0:6002
    timeout: 10s
    middleware:
      enable_recovery: true
      enable_logging: true
      enable_tracing: true
      enable_validate: true
      enable_metadata: true
      enable_circuit_breaker: false
