syntax = "proto3";

package gis.admin.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 告警服务（告警配置 + 告警信息）。
service AlarmService {
  // 查询告警配置
  rpc GetAlarmConfig(GetAlarmConfigRequest) returns (AlarmConfigForm) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/alarm/config/{overlay_number}"
    };
  }

  // 设置告警配置
  rpc SetAlarmConfig(SetAlarmConfigRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/gis/admin/alarm/config"
      body: "config"
    };
  }

  // 分页查询告警信息
  rpc PageAlarmInfo(PageAlarmInfoRequest) returns (PageAlarmInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/alarm/info/page"
    };
  }
}

// 告警配置表单
message AlarmConfigForm {
  string overlay_number = 1 [(gnostic.openapi.v3.property) = {description: "覆盖物/系统编号"}]; // 覆盖物编号

  string config_info = 2 [(gnostic.openapi.v3.property) = {description: "告警配置 JSON 字符串"}]; // 告警配置
}

// 查询告警配置条件
message GetAlarmConfigRequest {
  string overlay_number = 1 [(gnostic.openapi.v3.property) = {description: "覆盖物/系统编号"}]; // 覆盖物编号
}

// 设置告警配置条件
message SetAlarmConfigRequest {
  AlarmConfigForm config = 1 [(gnostic.openapi.v3.property) = {description: "告警配置表单"}]; // 告警配置表单
}

// 告警信息表单
message AlarmInfoForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "告警ID"}]; // 告警ID

  string overlay_number = 2 [(gnostic.openapi.v3.property) = {description: "覆盖物/系统编号"}]; // 覆盖物编号

  string alarm_type = 3 [(gnostic.openapi.v3.property) = {description: "告警类型"}]; // 告警类型

  optional double alarm_valve = 4 [(gnostic.openapi.v3.property) = {description: "告警值"}]; // 告警值

  optional string alarm_info = 5 [(gnostic.openapi.v3.property) = {description: "告警内容"}]; // 告警内容

  optional string remark = 6 [(gnostic.openapi.v3.property) = {description: "备注"}]; // 备注

  optional string collect_time = 7 [(gnostic.openapi.v3.property) = {description: "采集时间"}]; // 采集时间

  optional bool is_report = 8 [(gnostic.openapi.v3.property) = {description: "是否上报"}]; // 是否上报

  optional string created_at = 9 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 分页查询告警信息条件
message PageAlarmInfoRequest {
  optional int64 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}]; // 页码

  optional int64 page_size = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}]; // 每页数量

  optional string overlay_number = 3 [(gnostic.openapi.v3.property) = {description: "覆盖物编号过滤"}]; // 覆盖物编号

  optional string alarm_type = 4 [(gnostic.openapi.v3.property) = {description: "告警类型过滤"}]; // 告警类型
}

// 分页响应
message PageAlarmInfoResponse {
  repeated AlarmInfoForm list = 1 [(gnostic.openapi.v3.property) = {description: "告警信息列表"}]; // 告警信息列表

  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}