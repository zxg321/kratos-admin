syntax = "proto3";

package gis.admin.v1;

import "gis/common/v1/common.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// GIS 要素服务
service FeatureService {
  // 分页查询要素
  rpc PageFeature(PageFeatureRequest) returns (PageFeatureResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/feature/page"
    };
  }

  // 按 bbox 查询要素（地图视野加载）
  rpc QueryFeatureByBBox(QueryFeatureByBBoxRequest) returns (QueryFeatureByBBoxResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/feature/bbox"
    };
  }

  // 查询要素详情
  rpc GetFeature(GetFeatureRequest) returns (FeatureForm) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/feature/{id}"
    };
  }

  // 创建要素
  rpc CreateFeature(CreateFeatureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/gis/admin/feature"
      body: "feature"
    };
  }

  // 更新要素
  rpc UpdateFeature(UpdateFeatureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/gis/admin/feature/{id}"
      body: "feature"
    };
  }

  // 删除要素
  rpc DeleteFeature(DeleteFeatureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/gis/admin/feature/{ids}"
    };
  }
}

// 要素表单
message FeatureForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "要素ID"}]; // 要素ID

  int64 layer_id = 2 [(gnostic.openapi.v3.property) = {description: "图层ID"}, (buf.validate.field).int64.gt = 0]; // 图层ID

  gis.common.v1.Geometry geometry = 3 [(gnostic.openapi.v3.property) = {description: "几何"}]; // 几何

  string properties = 4 [(gnostic.openapi.v3.property) = {description: "属性 JSON 字符串"}]; // 属性

  optional string created_at = 5 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 分页查询条件
message PageFeatureRequest {
  optional int64 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}]; // 页码

  optional int64 page_size = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}]; // 每页数量

  int64 layer_id = 3 [(gnostic.openapi.v3.property) = {description: "图层ID"}]; // 图层ID
}

// 分页响应
message PageFeatureResponse {
  repeated FeatureForm list = 1 [(gnostic.openapi.v3.property) = {description: "要素列表"}]; // 要素列表

  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// bbox 查询条件（WGS84 经纬度，south/west/north/east）
message QueryFeatureByBBoxRequest {
  int64 layer_id = 1 [(gnostic.openapi.v3.property) = {description: "图层ID"}]; // 图层ID

  double south = 2 [(gnostic.openapi.v3.property) = {description: "最小纬度"}]; // 最小纬度

  double west = 3 [(gnostic.openapi.v3.property) = {description: "最小经度"}]; // 最小经度

  double north = 4 [(gnostic.openapi.v3.property) = {description: "最大纬度"}]; // 最大纬度

  double east = 5 [(gnostic.openapi.v3.property) = {description: "最大经度"}]; // 最大经度

  optional int64 limit = 6 [(gnostic.openapi.v3.property) = {description: "限制条数，默认 1000"}]; // 限制条数
}

// bbox 响应
message QueryFeatureByBBoxResponse {
  repeated FeatureForm list = 1 [(gnostic.openapi.v3.property) = {description: "要素列表"}]; // 要素列表
}

// 详情查询条件
message GetFeatureRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "要素ID"}]; // 要素ID
}

// 创建条件
message CreateFeatureRequest {
  FeatureForm feature = 1 [(gnostic.openapi.v3.property) = {description: "要素表单"}]; // 要素表单
}

// 更新条件
message UpdateFeatureRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "要素ID"}]; // 要素ID

  FeatureForm feature = 2 [(gnostic.openapi.v3.property) = {description: "要素表单"}]; // 要素表单
}

// 删除条件
message DeleteFeatureRequest {
  string ids = 1 [(gnostic.openapi.v3.property) = {description: "ID列表，逗号分隔"}]; // ID列表
}
