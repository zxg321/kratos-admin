syntax = "proto3";

package gis.admin.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// GIS 图层服务
service LayerService {
  // 分页查询图层
  rpc PageLayer(PageLayerRequest) returns (PageLayerResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/layer/page"
    };
  }

  // 查询图层详情
  rpc GetLayer(GetLayerRequest) returns (LayerForm) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/layer/{id}"
    };
  }

  // 创建图层
  rpc CreateLayer(CreateLayerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/gis/admin/layer"
      body: "layer"
    };
  }

  // 更新图层
  rpc UpdateLayer(UpdateLayerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/gis/admin/layer/{id}"
      body: "layer"
    };
  }

  // 删除图层
  rpc DeleteLayer(DeleteLayerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/gis/admin/layer/{ids}"
    };
  }

  // 查询全部启用图层（门户工作台加载）
  rpc ListLayer(ListLayerRequest) returns (ListLayerResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/layer/list"
    };
  }
}

// 图层表单
message LayerForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "图层ID"}]; // 图层ID

  string name = 2 [(gnostic.openapi.v3.property) = {description: "图层名称"}, (buf.validate.field).string.min_len = 1]; // 图层名称

  string layer_type = 3 [(gnostic.openapi.v3.property) = {description: "图层类型: point/line/polygon"}]; // 图层类型

  string style = 4 [(gnostic.openapi.v3.property) = {description: "样式 JSON 字符串"}]; // 样式

  bool visible = 5 [(gnostic.openapi.v3.property) = {description: "是否可见"}]; // 是否可见

  int32 status = 6 [(gnostic.openapi.v3.property) = {description: "状态: 1启用/0停用"}]; // 状态

  optional string created_at = 7 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 分页查询条件
message PageLayerRequest {
  optional int64 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}]; // 页码

  optional int64 page_size = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}]; // 每页数量

  optional string name = 3 [(gnostic.openapi.v3.property) = {description: "名称关键字"}]; // 名称关键字

  optional int32 status = 4 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
}

// 分页响应
message PageLayerResponse {
  repeated LayerForm list = 1 [(gnostic.openapi.v3.property) = {description: "图层列表"}]; // 图层列表

  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 详情查询条件
message GetLayerRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "图层ID"}]; // 图层ID
}

// 创建条件
message CreateLayerRequest {
  LayerForm layer = 1 [(gnostic.openapi.v3.property) = {description: "图层表单"}]; // 图层表单
}

// 更新条件
message UpdateLayerRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "图层ID"}]; // 图层ID

  LayerForm layer = 2 [(gnostic.openapi.v3.property) = {description: "图层表单"}]; // 图层表单
}

// 删除条件
message DeleteLayerRequest {
  string ids = 1 [(gnostic.openapi.v3.property) = {description: "ID列表，逗号分隔"}]; // ID列表
}

// 列表查询条件
message ListLayerRequest {
  optional int32 status = 1 [(gnostic.openapi.v3.property) = {description: "状态，空则全部启用"}]; // 状态
}

// 列表响应
message ListLayerResponse {
  repeated LayerForm list = 1 [(gnostic.openapi.v3.property) = {description: "图层列表"}]; // 图层列表
}
