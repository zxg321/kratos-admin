syntax = "proto3";

package gis.admin.v1;

import "gis/common/v1/common.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 采集管理服务（采集批次 + 采集点导入与明细查询）。
service CollectService {
  // 分页查询采集批次
  rpc PageBatch(PageBatchRequest) returns (PageBatchResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/collect/batch/page"
    };
  }

  // 查询采集批次详情
  rpc GetBatch(GetBatchRequest) returns (CollectBatchForm) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/collect/batch/{id}"
    };
  }

  // 创建采集批次
  rpc CreateBatch(CreateBatchRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/gis/admin/collect/batch"
      body: "batch"
    };
  }

  // 删除采集批次
  rpc DeleteBatch(DeleteBatchRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/gis/admin/collect/batch/{ids}"
    };
  }

  // 分页查询采集点（含明细：坐标/高程/口径/区域）
  rpc PagePoint(PagePointRequest) returns (PagePointResponse) {
    option (google.api.http) = {
      get: "/api/v1/gis/admin/collect/point/page"
    };
  }

  // 从采集批次生成覆盖物/管道
  rpc GenerateFromBatch(GenerateFromBatchRequest) returns (GenerateResult) {
    option (google.api.http) = {
      post: "/api/v1/gis/admin/collect/generate"
      body: "*"
    };
  }
}

// 采集批次表单
message CollectBatchForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "批次ID"}]; // 批次ID

  string identifier = 2 [(gnostic.openapi.v3.property) = {description: "采集标识符"}, (buf.validate.field).string.min_len = 1]; // 采集标识符

  optional string building_date = 3 [(gnostic.openapi.v3.property) = {description: "采集日期"}]; // 采集日期

  optional string data_sources = 4 [(gnostic.openapi.v3.property) = {description: "数据来源(RTK/CAD)"}]; // 数据来源

  optional string file_name = 5 [(gnostic.openapi.v3.property) = {description: "文件名"}]; // 文件名

  optional string file_path = 6 [(gnostic.openapi.v3.property) = {description: "文件路径"}]; // 文件路径

  string import_way = 7 [(gnostic.openapi.v3.property) = {description: "导入方式(P点位/L管线)"}, (buf.validate.field).string.pattern = "^[PL]$"]; // 导入方式

  optional int32 pipe_number = 8 [(gnostic.openapi.v3.property) = {description: "管线数量"}]; // 管线数量

  optional int32 point_number = 9 [(gnostic.openapi.v3.property) = {description: "点位数量"}]; // 点位数量

  optional string created_at = 10 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 分页查询采集批次条件
message PageBatchRequest {
  optional int64 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}]; // 页码

  optional int64 page_size = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}]; // 每页数量

  optional string keyword = 3 [(gnostic.openapi.v3.property) = {description: "标识符关键字"}]; // 关键字

  optional string import_way = 4 [(gnostic.openapi.v3.property) = {description: "导入方式过滤"}]; // 导入方式
}

// 分页响应
message PageBatchResponse {
  repeated CollectBatchForm list = 1 [(gnostic.openapi.v3.property) = {description: "批次列表"}]; // 批次列表

  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 批次详情查询条件
message GetBatchRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "批次ID"}]; // 批次ID
}

// 创建批次条件
message CreateBatchRequest {
  CollectBatchForm batch = 1 [(gnostic.openapi.v3.property) = {description: "批次表单"}]; // 批次表单
}

// 删除批次条件
message DeleteBatchRequest {
  string ids = 1 [(gnostic.openapi.v3.property) = {description: "ID列表，逗号分隔"}]; // ID列表
}

// 采集点表单
message CollectPointForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "点位ID"}]; // 点位ID

  int64 batch_id = 2 [(gnostic.openapi.v3.property) = {description: "批次ID"}]; // 批次ID

  string position = 3 [(gnostic.openapi.v3.property) = {description: "点位标识"}]; // 点位标识

  gis.common.v1.Geometry geometry = 4 [(gnostic.openapi.v3.property) = {description: "点几何"}]; // 点几何

  optional double elevation = 5 [(gnostic.openapi.v3.property) = {description: "高程(m)"}]; // 高程

  optional string feature = 6 [(gnostic.openapi.v3.property) = {description: "特征"}]; // 特征

  optional string specification = 7 [(gnostic.openapi.v3.property) = {description: "口径(mm)"}]; // 口径

  optional string building_area = 8 [(gnostic.openapi.v3.property) = {description: "建筑区域"}]; // 建筑区域

  optional string building_date = 9 [(gnostic.openapi.v3.property) = {description: "建筑日期"}]; // 建筑日期

  optional string created_at = 10 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 分页查询采集点条件
message PagePointRequest {
  optional int64 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}]; // 页码

  optional int64 page_size = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}]; // 每页数量

  int64 batch_id = 3 [(gnostic.openapi.v3.property) = {description: "批次ID"}]; // 批次ID
}

// 分页响应
message PagePointResponse {
  repeated CollectPointForm list = 1 [(gnostic.openapi.v3.property) = {description: "采集点列表"}]; // 采集点列表

  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 从采集批次生成覆盖物/管道条件
message GenerateFromBatchRequest {
  int64 batch_id = 1 [(gnostic.openapi.v3.property) = {description: "批次ID"}]; // 批次ID
}

// 生成结果
message GenerateResult {
  int32 overlay_generated = 1 [(gnostic.openapi.v3.property) = {description: "生成的覆盖物数量"}]; // 覆盖物数量

  int32 pipe_generated = 2 [(gnostic.openapi.v3.property) = {description: "生成的管道数量"}]; // 管道数量

  repeated string skipped = 3 [(gnostic.openapi.v3.property) = {description: "跳过的标识列表"}]; // 跳过列表
}