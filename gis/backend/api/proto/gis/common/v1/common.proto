syntax = "proto3";

package gis.common.v1;

import "gnostic/openapi/v3/annotations.proto";

// 空间几何，coordinates 为 GeoJSON coordinates 文本（JSON 数组字符串）。
message Geometry {
  string type = 1 [(gnostic.openapi.v3.property) = {description: "几何类型: Point/LineString/Polygon/MultiPoint/MultiLineString/MultiPolygon"}]; // 几何类型

  string coordinates = 2 [(gnostic.openapi.v3.property) = {description: "GeoJSON coordinates JSON 字符串"}]; // GeoJSON 坐标

  optional int32 srid = 3 [(gnostic.openapi.v3.property) = {description: "坐标系，默认 4326"}]; // 坐标系

  optional string properties = 4 [(gnostic.openapi.v3.property) = {description: "要素属性 JSON 字符串"}]; // 要素属性
}
