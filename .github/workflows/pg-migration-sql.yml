name: PG Migration SQL

on:
  pull_request:
    paths:
      - "backend/migration/assets/**"
      - "scripts/validate_pg_migration.py"
      - ".github/workflows/pg-migration-sql.yml"
  push:
    branches: [main]
    paths:
      - "backend/migration/assets/**"
      - "scripts/validate_pg_migration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate postgres migration SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pglast（libpg_query 绑定）用于无数据库的 PG 语法解析。
      - run: pip install pglast
      - name: Validate postgres migration SQL
        run: python scripts/validate_pg_migration.py